name: Translation Release Gate

on:
  push:
    branches:
      - refactor/minimal-phoenix
      - 'fix/**'
    paths:
      - '14_学习中心/离线医学知识工作台/phoenix_knowledge/translation_*.py'
      - '14_学习中心/离线医学知识工作台/phoenix_knowledge/office_translation.py'
      - '14_学习中心/离线医学知识工作台/phoenix_knowledge/provider_hub*.py'
      - '14_学习中心/离线医学知识工作台/phoenix_knowledge/llm*.py'
      - '14_学习中心/离线医学知识工作台/tests/test_translation_*.py'
      - '14_学习中心/离线医学知识工作台/tests/test_office_translation.py'
      - '.github/workflows/translation-release-gate.yml'
  pull_request:
    paths:
      - '14_学习中心/离线医学知识工作台/phoenix_knowledge/translation_*.py'
      - '14_学习中心/离线医学知识工作台/phoenix_knowledge/office_translation.py'
      - '14_学习中心/离线医学知识工作台/phoenix_knowledge/provider_hub*.py'
      - '14_学习中心/离线医学知识工作台/phoenix_knowledge/llm*.py'
      - '14_学习中心/离线医学知识工作台/tests/test_translation_*.py'
      - '14_学习中心/离线医学知识工作台/tests/test_office_translation.py'
      - '.github/workflows/translation-release-gate.yml'

permissions:
  contents: read

concurrency:
  group: translation-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translation-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: '14_学习中心/离线医学知识工作台'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt runtime libraries
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install translation test runtime
        run: >-
          python -m pip install --disable-pip-version-check --prefer-binary
          PyMuPDF pypdf python-docx Pillow cryptography numpy PySide6

      - name: Compile translation stability core
        run: >-
          python -m py_compile
          phoenix_knowledge/translator.py
          phoenix_knowledge/office_translation.py
          phoenix_knowledge/translation_models.py
          phoenix_knowledge/translation_semantics.py
          phoenix_knowledge/translation_pdf.py
          phoenix_knowledge/translation_output_validation.py
          phoenix_knowledge/translation_stability_core.py
          phoenix_knowledge/llm.py
          phoenix_knowledge/provider_hub.py
          phoenix_knowledge/provider_hub_v2.py

      - name: Run translation release regression suite
        run: >-
          python -m unittest -v
          tests.test_translation_output_stability
          tests.test_translation_storage_budget
          tests.test_compact_translation_layout
          tests.test_translation_storage_gui
          tests.test_translation_backend_priority
          tests.test_translation_medical_semantics
          tests.test_translation_product_v2
          tests.test_office_translation
          tests.test_provider_hub
