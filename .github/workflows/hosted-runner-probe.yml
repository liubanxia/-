name: Hosted Runner Probe

on:
  push:
    branches:
      - ci/hosted-runner-probe
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Probe macOS and Xcode
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Probe XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version
          echo PUBLIC_MACOS15_XCODEGEN_OK
