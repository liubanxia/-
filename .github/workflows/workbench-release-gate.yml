name: Workbench Release Gate

on:
  push:
    branches:
      - refactor/minimal-phoenix
      - 'fix/**'
    paths:
      - '14_学习中心/离线医学知识工作台/phoenix_knowledge/**/*.py'
      - '14_学习中心/离线医学知识工作台/app.py'
      - '14_学习中心/离线医学知识工作台/onsite_preflight*.py'
      - '14_学习中心/离线医学知识工作台/real_acceptance*.py'
      - '14_学习中心/离线医学知识工作台/tests/**/*.py'
      - '.github/workflows/workbench-release-gate.yml'
  pull_request:
    paths:
      - '14_学习中心/离线医学知识工作台/phoenix_knowledge/**/*.py'
      - '14_学习中心/离线医学知识工作台/app.py'
      - '14_学习中心/离线医学知识工作台/onsite_preflight*.py'
      - '14_学习中心/离线医学知识工作台/real_acceptance*.py'
      - '14_学习中心/离线医学知识工作台/tests/**/*.py'
      - '.github/workflows/workbench-release-gate.yml'

permissions:
  contents: read

concurrency:
  group: workbench-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workbench-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      PHOENIX_KNOWLEDGE_ACCELERATOR: cpu
      PHOENIX_KNOWLEDGE_ALLOW_REMOTE: '0'
    defaults:
      run:
        working-directory: '14_学习中心/离线医学知识工作台'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt runtime libraries
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install lightweight release-test runtime
        run: >-
          python -m pip install --disable-pip-version-check --prefer-binary
          PyMuPDF pypdf python-docx Pillow cryptography numpy PySide6

      - name: Compile release contracts
        run: >-
          python -m py_compile
          app.py
          onsite_preflight.py
          onsite_preflight_final.py
          real_acceptance.py
          real_acceptance_final.py
          phoenix_knowledge/gui_bootstrap.py
          phoenix_knowledge/release_gui_hardening.py
          phoenix_knowledge/translation_models.py
          phoenix_knowledge/output_contracts.py
          phoenix_knowledge/workbench_stability_core.py
          phoenix_knowledge/translation_output_validation.py
          phoenix_knowledge/translation_stability_core.py
          phoenix_knowledge/translation_pdf.py

      - name: Run workbench output and architecture regressions
        run: >-
          python -m unittest -v
          tests.test_workbench_stability_contract
          tests.test_product_integrity_regressions
          tests.test_onsite_preflight
          tests.test_translation_output_stability
          tests.test_translation_storage_budget
          tests.test_compact_translation_layout
          tests.test_translation_storage_gui
          tests.test_gui_bootstrap_contract
          tests.test_translation_backend_priority
          tests.test_final_gui_runtime_contract
