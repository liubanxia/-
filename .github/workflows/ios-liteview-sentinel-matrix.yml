name: LiteView 0.9.0 Stable PiP Radar Test

on:
  push:
    branches:
      - feature/ios-realtime-vision-assist
    paths:
      - '.github/workflows/ios-liteview-sentinel-matrix.yml'
      - 'ios/PhoenixRealtimeVisionAssist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Run lifecycle smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Core/SharedRealtimeStateStore.swift" \
            "$ROOT/Sources/Core/BroadcastLifecycle.swift" \
            "$ROOT/Sources/Vision/PhoenixCapabilityModelBank.swift" \
            "$ROOT/scripts/lifecycle_smoke_main.swift" \
            -o "$RUNNER_TEMP/liteview-lifecycle-smoke"
          "$RUNNER_TEMP/liteview-lifecycle-smoke"

      - name: Build fresh app and Broadcast Extension
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/LiteViewRadarDerivedData"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LiteViewRadarDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Stage small stable radar package
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewRadarDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          test -d "$APP"
          test -d "$EXT"

          rm -rf "$EXT/BroadcastModels"
          rm -rf "$APP"/*.mlmodelc
          rm -f "$APP/PhoenixCapabilityBank.json"

          set_plist_string() {
            local plist="$1" key="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" >/dev/null 2>&1 || \
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }

          set_plist_string "$APP/Info.plist" CFBundleDisplayName LiteView
          set_plist_string "$APP/Info.plist" CFBundleIdentifier com.phoenix.realtimevisionassist
          set_plist_string "$APP/Info.plist" CFBundleShortVersionString 0.9.0
          set_plist_string "$APP/Info.plist" CFBundleVersion 16
          set_plist_string "$EXT/Info.plist" CFBundleDisplayName 'LiteView Broadcast'
          set_plist_string "$EXT/Info.plist" CFBundleIdentifier com.phoenix.realtimevisionassist.broadcast
          set_plist_string "$EXT/Info.plist" CFBundleShortVersionString 0.9.0
          set_plist_string "$EXT/Info.plist" CFBundleVersion 16

          /usr/libexec/PlistBuddy -c 'Delete :NSExtension' "$EXT/Info.plist" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :NSExtension dict' "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSExtension:NSExtensionPointIdentifier string com.apple.broadcast-services-upload' "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSExtension:NSExtensionPrincipalClass string PhoenixBroadcastExtension.BroadcastSampleHandler' "$EXT/Info.plist"

          EXT_SIZE_BYTES="$(du -sk "$EXT" | awk '{print $1 * 1024}')"
          APP_SIZE_BYTES="$(du -sk "$APP" | awk '{print $1 * 1024}')"
          echo "EXT_SIZE_BYTES=$EXT_SIZE_BYTES"
          echo "APP_SIZE_BYTES=$APP_SIZE_BYTES"
          test "$EXT_SIZE_BYTES" -lt 12582912
          test ! -d "$EXT/BroadcastModels"

      - name: Package and verify LiteView 0.9.0 radar IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewRadarDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          ROOT="$RUNNER_TEMP/liteview-090-package"
          PAYLOAD="$ROOT/Payload"
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-radar-manifest.txt"
          VERIFY="$RUNNER_TEMP/liteview-090-verify"

          rm -rf "$ROOT" "$VERIFY" "$IPA" "$MANIFEST"
          mkdir -p "$PAYLOAD" "$VERIFY"
          cp -R "$APP" "$PAYLOAD/"
          (cd "$ROOT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"
          unzip -q "$IPA" -d "$VERIFY"

          VAPP="$VERIFY/Payload/PhoenixRealtimeVisionAssist.app"
          VEXT="$VAPP/PlugIns/PhoenixBroadcastExtension.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$VAPP/Info.plist")" = '0.9.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$VAPP/Info.plist")" = '16'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$VEXT/Info.plist")" = '0.9.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$VEXT/Info.plist")" = '16'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$VEXT/Info.plist")" = 'com.apple.broadcast-services-upload'
          test ! -d "$VEXT/BroadcastModels"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$VAPP/Info.plist" | grep -q audio

          cat > "$MANIFEST" <<EOF
          LiteView 0.9.0 stable PiP radar test
          commit=${GITHUB_SHA}
          build=16
          replaykit_runtime=Apple Vision human rectangles + fast Vision tracker; no custom Core ML model load in Broadcast Extension
          extension_models=none
          display=system Picture in Picture radar window; red observed target + blue short-horizon prediction
          foreground_game_priority=adaptive scan interval + one frame in flight + thermal/latency/frame-pressure backoff
          hidden_position_extrapolation=disabled
          persistence=none for frames, screenshots, audio, or analysis history
          note=PiP is a floating radar, not a transparent arbitrary overlay over another app
          signing=unsigned; re-sign app and embedded Broadcast Extension without removing PlugIns
          EOF

          ls -lh "$IPA" "$MANIFEST"
          shasum -a 256 "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-090-radar
          path: |
            ${{ runner.temp }}/LiteView-unsigned-sideload.ipa
            ${{ runner.temp }}/LiteView-radar-manifest.txt
          if-no-files-found: error

      - name: Publish radar test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='liteview-radar-latest'
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-radar-manifest.txt"
          NOTES='LiteView 0.9.0 removes custom Core ML model loading from the ReplayKit extension to target long-session stability and adds a real system Picture in Picture radar visible over the foreground game. Red shows the currently observed visible target and blue shows a short-horizon motion prediction. This is a deliberately small functional test build; the cold model bank is excluded.'

          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$MANIFEST" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" \
              --title 'LiteView 0.9.0 Stable PiP Radar Test' --notes "$NOTES"
          else
            gh release create "$TAG" "$IPA" "$MANIFEST" --repo "${GITHUB_REPOSITORY}" \
              --title 'LiteView 0.9.0 Stable PiP Radar Test' --notes "$NOTES"
          fi
