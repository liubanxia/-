name: LiteView 0.8 Sentinel Matrix Package

on:
  push:
    branches:
      - feature/ios-realtime-vision-assist
    paths:
      - '.github/workflows/ios-liteview-sentinel-matrix.yml'
      - 'ios/PhoenixRealtimeVisionAssist/Sources/Broadcast/**'
      - 'ios/PhoenixRealtimeVisionAssist/Sources/ExtensionSupport/**'
      - 'ios/PhoenixRealtimeVisionAssist/Resources/BroadcastModels/**'
      - 'ios/PhoenixRealtimeVisionAssist/project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage hot ReplayKit detector matrix
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          BROADCAST_MODELS="$ROOT/Resources/BroadcastModels"
          WORK="$RUNNER_TEMP/liteview-sentinel-models"
          mkdir -p "$BROADCAST_MODELS" "$WORK"
          rm -rf "$BROADCAST_MODELS"/*.mlmodelc

          # Phoenix/LiteView nano detector.
          YOLO_ZIP="$WORK/liteview-yolo11n-coreml.zip"
          YOLO_UNPACK="$WORK/yolo11n-unpack"
          YOLO_COMPILE="$WORK/yolo11n-compiled"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 \
            -o "$YOLO_ZIP" \
            'https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'
          mkdir -p "$YOLO_UNPACK" "$YOLO_COMPILE"
          unzip -q "$YOLO_ZIP" -d "$YOLO_UNPACK"
          YOLO_PACKAGE="$(find "$YOLO_UNPACK" -type d -name 'yolo11n.mlpackage' -not -path '*/__MACOSX/*' -print -quit)"
          test -n "$YOLO_PACKAGE"
          xcrun coremlc compile "$YOLO_PACKAGE" "$YOLO_COMPILE"
          YOLO_COMPILED="$(find "$YOLO_COMPILE" -type d -name '*.mlmodelc' -print -quit)"
          test -n "$YOLO_COMPILED"
          cp -R "$YOLO_COMPILED" "$BROADCAST_MODELS/yolo11n.mlmodelc"

          # Independent quantized fallback. It is present on disk but not resident together with
          # yolo11n; the extension swaps lanes only after repeated empty/error evidence.
          TINY_MODEL="$WORK/YOLOv3TinyInt8LUT.mlmodel"
          TINY_COMPILE="$WORK/tiny-compiled"
          mkdir -p "$TINY_COMPILE"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 \
            -o "$TINY_MODEL" \
            'https://ml-assets.apple.com/coreml/models/Image/ObjectDetection/YOLOv3Tiny/YOLOv3TinyInt8LUT.mlmodel'
          xcrun coremlc compile "$TINY_MODEL" "$TINY_COMPILE"
          TINY_COMPILED="$(find "$TINY_COMPILE" -type d -name '*.mlmodelc' -print -quit)"
          test -n "$TINY_COMPILED"
          cp -R "$TINY_COMPILED" "$BROADCAST_MODELS/YOLOv3TinyInt8LUT.mlmodelc"

          MODEL_COUNT="$(find "$BROADCAST_MODELS" -type d -name '*.mlmodelc' -prune | wc -l | tr -d ' ')"
          test "$MODEL_COUNT" = '2'
          echo '=== ReplayKit hot model bank ==='
          du -sh "$BROADCAST_MODELS"/*.mlmodelc

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Build fresh app and Broadcast Extension
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/LiteViewSentinelDerivedData"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LiteViewSentinelDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Download current near-1GiB Phoenix base package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/liteview-base"
          rm -rf "$BASE_DIR"
          mkdir -p "$BASE_DIR"
          gh release download liteview-sideload-latest \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'LiteView-unsigned-sideload.ipa' \
            --dir "$BASE_DIR"
          test -s "$BASE_DIR/LiteView-unsigned-sideload.ipa"
          ls -lh "$BASE_DIR/LiteView-unsigned-sideload.ipa"

      - name: Transplant low-latency sentinel extension into full bank
        shell: bash
        run: |
          set -euo pipefail
          BASE_IPA="$RUNNER_TEMP/liteview-base/LiteView-unsigned-sideload.ipa"
          UNPACK="$RUNNER_TEMP/liteview-sentinel-unpack"
          PRODUCTS="$RUNNER_TEMP/LiteViewSentinelDerivedData/Build/Products/Release-iphoneos"
          FRESH_EXT="$PRODUCTS/PhoenixRealtimeVisionAssist.app/PlugIns/PhoenixBroadcastExtension.appex"
          STAGED_MODELS='ios/PhoenixRealtimeVisionAssist/Resources/BroadcastModels'
          APP="$UNPACK/Payload/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"

          rm -rf "$UNPACK"
          mkdir -p "$UNPACK"
          unzip -q "$BASE_IPA" -d "$UNPACK"
          test -d "$APP"
          test -d "$FRESH_EXT"

          # Xcode does not reliably copy already-compiled .mlmodelc folders from a generated
          # app-extension resource group. Stage them explicitly into a known bundle subdirectory.
          rm -rf "$FRESH_EXT/BroadcastModels"
          mkdir -p "$FRESH_EXT/BroadcastModels"
          cp -R "$STAGED_MODELS/yolo11n.mlmodelc" "$FRESH_EXT/BroadcastModels/"
          cp -R "$STAGED_MODELS/YOLOv3TinyInt8LUT.mlmodelc" "$FRESH_EXT/BroadcastModels/"

          rm -rf "$EXT"
          mkdir -p "$APP/PlugIns"
          cp -R "$FRESH_EXT" "$EXT"

          set_plist_string() {
            local plist="$1" key="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" >/dev/null 2>&1 || \
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }

          set_plist_string "$APP/Info.plist" CFBundleShortVersionString 0.8.0
          set_plist_string "$APP/Info.plist" CFBundleVersion 11
          set_plist_string "$EXT/Info.plist" CFBundleShortVersionString 0.8.0
          set_plist_string "$EXT/Info.plist" CFBundleVersion 11
          set_plist_string "$EXT/Info.plist" CFBundleIdentifier com.phoenix.realtimevisionassist.broadcast

          /usr/libexec/PlistBuddy -c 'Delete :NSExtension' "$EXT/Info.plist" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :NSExtension dict' "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSExtension:NSExtensionPointIdentifier string com.apple.broadcast-services-upload' "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSExtension:NSExtensionPrincipalClass string PhoenixBroadcastExtension.BroadcastSampleHandler' "$EXT/Info.plist"

          MODEL_COUNT="$(find "$EXT" -type d -name '*.mlmodelc' -prune | wc -l | tr -d ' ')"
          EXT_SIZE_BYTES="$(du -sk "$EXT" | awk '{print $1 * 1024}')"
          echo "EXT_MODEL_COUNT=$MODEL_COUNT"
          echo "EXT_SIZE_BYTES=$EXT_SIZE_BYTES"
          test "$MODEL_COUNT" = '2'
          test "$EXT_SIZE_BYTES" -lt 41943040
          find "$EXT" -type d -name '*.mlmodelc' -prune -exec du -sh {} +

      - name: Package and verify LiteView 0.8 full-bank IPA
        shell: bash
        run: |
          set -euo pipefail
          UNPACK="$RUNNER_TEMP/liteview-sentinel-unpack"
          APP="$UNPACK/Payload/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-sideload-manifest.txt"
          VERIFY="$RUNNER_TEMP/liteview-sentinel-verify"

          rm -f "$IPA" "$MANIFEST"
          rm -rf "$VERIFY"
          (cd "$UNPACK" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"

          IPA_SIZE_BYTES="$(stat -f%z "$IPA")"
          echo "IPA_SIZE_BYTES=$IPA_SIZE_BYTES"
          test "$IPA_SIZE_BYTES" -ge 900000000
          test "$IPA_SIZE_BYTES" -le 1073741824

          mkdir -p "$VERIFY"
          unzip -q "$IPA" -d "$VERIFY"
          VAPP="$VERIFY/Payload/PhoenixRealtimeVisionAssist.app"
          VEXT="$VAPP/PlugIns/PhoenixBroadcastExtension.appex"
          test "$(find "$VEXT" -type d -name '*.mlmodelc' -prune | wc -l | tr -d ' ')" = '2'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$VAPP/Info.plist")" = '0.8.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$VEXT/Info.plist")" = '0.8.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$VEXT/Info.plist")" = 'com.apple.broadcast-services-upload'

          cat > "$MANIFEST" <<EOF
          LiteView 0.8.0 Sentinel Matrix full-bank sideload package
          commit=${GITHUB_SHA}
          build=11
          package_size_budget_bytes=1073741824
          package_base=Phoenix near-1GiB capability bank
          replaykit_runtime=one tiny Core ML detector resident at a time + fast VNTrackObjectRequest between detector refreshes
          replaykit_hot_models=yolo11n + YOLOv3TinyInt8LUT
          replaykit_model_residency=one custom model only; backup remains cold until failover
          replaykit_heavy_refresh=approximately 0.9 seconds while target locked; sparse fallback only
          replaykit_body_pose=disabled
          visible_prediction=short 80-160 ms velocity lead only while current target remains visible; cleared immediately on miss
          visible_marker_point=predicted lead when stable, otherwise current stabilized target
          main_app_cold_bank=preserved from Phoenix capability-bank package
          persistence=none for frames, screenshots, audio, or analysis history
          signing=unsigned; re-sign app and embedded Broadcast Extension without removing PlugIns
          EOF

          ls -lh "$IPA" "$MANIFEST"
          shasum -a 256 "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-08-sentinel-fullbank
          path: |
            ${{ runner.temp }}/LiteView-unsigned-sideload.ipa
            ${{ runner.temp }}/LiteView-sideload-manifest.txt
          if-no-files-found: error

      - name: Publish sentinel full-bank release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='liteview-sentinel-latest'
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-sideload-manifest.txt"
          NOTES='LiteView 0.8.0 keeps the near-1GiB Phoenix capability bank on disk but replaces the ReplayKit runtime with a low-latency sentinel matrix: one tiny Core ML detector resident at a time, a quantized cold fallback, fast object tracking between heavy refreshes, no body-pose lane, and a short visible-only motion lead for the published point.'

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$MANIFEST" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" \
              --title 'LiteView 0.8.0 Sentinel Matrix Full Bank' --notes "$NOTES"
          else
            gh release create "$TAG" "$IPA" "$MANIFEST" --repo "${GITHUB_REPOSITORY}" \
              --title 'LiteView 0.8.0 Sentinel Matrix Full Bank' --notes "$NOTES"
          fi
