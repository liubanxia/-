name: LiteView 0.8.2 Sentinel Matrix Package

on:
  push:
    branches:
      - feature/ios-realtime-vision-assist
    paths:
      - '.github/workflows/ios-liteview-sentinel-matrix.yml'
      - 'ios/PhoenixRealtimeVisionAssist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage hot ReplayKit detector matrix
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          BROADCAST_MODELS="$ROOT/Resources/BroadcastModels"
          WORK="$RUNNER_TEMP/liteview-sentinel-models"
          rm -rf "$BROADCAST_MODELS" "$WORK"
          mkdir -p "$BROADCAST_MODELS" "$WORK"

          YOLO_ZIP="$WORK/liteview-yolo11n-coreml.zip"
          YOLO_UNPACK="$WORK/yolo11n-unpack"
          YOLO_COMPILE="$WORK/yolo11n-compiled"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 \
            -o "$YOLO_ZIP" \
            'https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'
          mkdir -p "$YOLO_UNPACK" "$YOLO_COMPILE"
          unzip -q "$YOLO_ZIP" -d "$YOLO_UNPACK"
          YOLO_PACKAGE="$(find "$YOLO_UNPACK" -type d -name 'yolo11n.mlpackage' -not -path '*/__MACOSX/*' -print -quit)"
          test -n "$YOLO_PACKAGE"
          xcrun coremlc compile "$YOLO_PACKAGE" "$YOLO_COMPILE"
          YOLO_COMPILED="$(find "$YOLO_COMPILE" -type d -name '*.mlmodelc' -print -quit)"
          test -n "$YOLO_COMPILED"
          cp -R "$YOLO_COMPILED" "$BROADCAST_MODELS/yolo11n.mlmodelc"

          TINY_MODEL="$WORK/YOLOv3TinyInt8LUT.mlmodel"
          TINY_COMPILE="$WORK/tiny-compiled"
          mkdir -p "$TINY_COMPILE"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 \
            -o "$TINY_MODEL" \
            'https://ml-assets.apple.com/coreml/models/Image/ObjectDetection/YOLOv3Tiny/YOLOv3TinyInt8LUT.mlmodel'
          xcrun coremlc compile "$TINY_MODEL" "$TINY_COMPILE"
          TINY_COMPILED="$(find "$TINY_COMPILE" -type d -name '*.mlmodelc' -print -quit)"
          test -n "$TINY_COMPILED"
          cp -R "$TINY_COMPILED" "$BROADCAST_MODELS/YOLOv3TinyInt8LUT.mlmodelc"

          MODEL_COUNT="$(find "$BROADCAST_MODELS" -type d -name '*.mlmodelc' -prune | wc -l | tr -d ' ')"
          test "$MODEL_COUNT" = '2'
          du -sh "$BROADCAST_MODELS"/*.mlmodelc

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Run lifecycle and compact-fallback smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Core/SharedRealtimeStateStore.swift" \
            "$ROOT/Sources/Core/BroadcastLifecycle.swift" \
            "$ROOT/Sources/Vision/PhoenixCapabilityModelBank.swift" \
            "$ROOT/scripts/lifecycle_smoke_main.swift" \
            -o "$RUNNER_TEMP/liteview-lifecycle-smoke"
          "$RUNNER_TEMP/liteview-lifecycle-smoke"

      - name: Build fresh app and Broadcast Extension
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/LiteViewSentinelDerivedData"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LiteViewSentinelDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Download previous full-bank package as model source only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/liteview-bank-source"
          rm -rf "$BASE_DIR"
          mkdir -p "$BASE_DIR"
          if gh release view liteview-sentinel-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            SOURCE_TAG='liteview-sentinel-latest'
          else
            SOURCE_TAG='liteview-sideload-latest'
          fi
          echo "SOURCE_TAG=$SOURCE_TAG" >> "$GITHUB_ENV"
          gh release download "$SOURCE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'LiteView-unsigned-sideload.ipa' \
            --dir "$BASE_DIR"
          test -s "$BASE_DIR/LiteView-unsigned-sideload.ipa"
          ls -lh "$BASE_DIR/LiteView-unsigned-sideload.ipa"

      - name: Hydrate fresh app with cold capability bank and hot extension models
        shell: bash
        run: |
          set -euo pipefail
          BASE_IPA="$RUNNER_TEMP/liteview-bank-source/LiteView-unsigned-sideload.ipa"
          BASE_UNPACK="$RUNNER_TEMP/liteview-bank-unpack"
          PRODUCTS="$RUNNER_TEMP/LiteViewSentinelDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          STAGED_MODELS='ios/PhoenixRealtimeVisionAssist/Resources/BroadcastModels'

          rm -rf "$BASE_UNPACK"
          mkdir -p "$BASE_UNPACK"
          unzip -q "$BASE_IPA" -d "$BASE_UNPACK"
          BASE_APP="$BASE_UNPACK/Payload/PhoenixRealtimeVisionAssist.app"
          test -d "$BASE_APP"
          test -d "$APP"
          test -d "$EXT"

          MODEL_COUNT=0
          for SRC in "$BASE_APP"/*.mlmodelc; do
            [ -d "$SRC" ] || continue
            NAME="$(basename "$SRC")"
            rm -rf "$APP/$NAME"
            cp -R "$SRC" "$APP/$NAME"
            MODEL_COUNT=$((MODEL_COUNT + 1))
          done
          if [ -f "$BASE_APP/PhoenixCapabilityBank.json" ]; then
            cp "$BASE_APP/PhoenixCapabilityBank.json" "$APP/PhoenixCapabilityBank.json"
          fi
          test "$MODEL_COUNT" -ge 12

          rm -rf "$EXT/BroadcastModels"
          mkdir -p "$EXT/BroadcastModels"
          cp -R "$STAGED_MODELS/yolo11n.mlmodelc" "$EXT/BroadcastModels/"
          cp -R "$STAGED_MODELS/YOLOv3TinyInt8LUT.mlmodelc" "$EXT/BroadcastModels/"

          set_plist_string() {
            local plist="$1" key="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" >/dev/null 2>&1 || \
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }

          set_plist_string "$APP/Info.plist" CFBundleDisplayName LiteView
          set_plist_string "$APP/Info.plist" CFBundleIdentifier com.phoenix.realtimevisionassist
          set_plist_string "$APP/Info.plist" CFBundleShortVersionString 0.8.2
          set_plist_string "$APP/Info.plist" CFBundleVersion 13
          set_plist_string "$EXT/Info.plist" CFBundleDisplayName 'LiteView Broadcast'
          set_plist_string "$EXT/Info.plist" CFBundleIdentifier com.phoenix.realtimevisionassist.broadcast
          set_plist_string "$EXT/Info.plist" CFBundleShortVersionString 0.8.2
          set_plist_string "$EXT/Info.plist" CFBundleVersion 13

          /usr/libexec/PlistBuddy -c 'Delete :NSExtension' "$EXT/Info.plist" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :NSExtension dict' "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSExtension:NSExtensionPointIdentifier string com.apple.broadcast-services-upload' "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSExtension:NSExtensionPrincipalClass string PhoenixBroadcastExtension.BroadcastSampleHandler' "$EXT/Info.plist"

          EXT_MODEL_COUNT="$(find "$EXT/BroadcastModels" -type d -name '*.mlmodelc' -prune | wc -l | tr -d ' ')"
          EXT_SIZE_BYTES="$(du -sk "$EXT" | awk '{print $1 * 1024}')"
          APP_MODEL_BYTES="$(find "$APP" -maxdepth 1 -type d -name '*.mlmodelc' -prune -exec du -sk {} + | awk '{s += $1} END {print s * 1024}')"
          echo "APP_MODEL_COUNT=$MODEL_COUNT"
          echo "APP_MODEL_BYTES=$APP_MODEL_BYTES"
          echo "EXT_MODEL_COUNT=$EXT_MODEL_COUNT"
          echo "EXT_SIZE_BYTES=$EXT_SIZE_BYTES"
          test "$APP_MODEL_BYTES" -ge 650000000
          test "$EXT_MODEL_COUNT" = '2'
          test "$EXT_SIZE_BYTES" -lt 41943040

      - name: Package and verify LiteView 0.8.2 full-bank IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewSentinelDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          ROOT="$RUNNER_TEMP/liteview-082-package"
          PAYLOAD="$ROOT/Payload"
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-sideload-manifest.txt"
          VERIFY="$RUNNER_TEMP/liteview-082-verify"

          rm -rf "$ROOT" "$VERIFY" "$IPA" "$MANIFEST"
          mkdir -p "$PAYLOAD" "$VERIFY"
          cp -R "$APP" "$PAYLOAD/"
          (cd "$ROOT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"

          IPA_SIZE_BYTES="$(stat -f%z "$IPA")"
          test "$IPA_SIZE_BYTES" -ge 900000000
          test "$IPA_SIZE_BYTES" -le 1073741824
          unzip -q "$IPA" -d "$VERIFY"

          VAPP="$VERIFY/Payload/PhoenixRealtimeVisionAssist.app"
          VEXT="$VAPP/PlugIns/PhoenixBroadcastExtension.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$VAPP/Info.plist")" = '0.8.2'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$VAPP/Info.plist")" = '13'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$VEXT/Info.plist")" = '0.8.2'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$VEXT/Info.plist")" = 'com.phoenix.realtimevisionassist.broadcast'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$VEXT/Info.plist")" = 'com.apple.broadcast-services-upload'
          test "$(find "$VEXT/BroadcastModels" -type d -name '*.mlmodelc' -prune | wc -l | tr -d ' ')" = '2'
          test "$(find "$VAPP" -maxdepth 1 -type d -name '*.mlmodelc' -prune | wc -l | tr -d ' ')" -ge 12

          cat > "$MANIFEST" <<EOF
          LiteView 0.8.2 fresh-code full-bank sideload package
          commit=${GITHUB_SHA}
          build=13
          source_bank_tag=${SOURCE_TAG}
          package_base=fresh main executable + fresh ReplayKit extension + transplanted cold model resources only
          replaykit_runtime=single hot Core ML detector + fast Vision tracker + independently confirmed failover
          replaykit_hot_models=yolo11n + YOLOv3TinyInt8LUT
          fallback_decoder=coordinates/confidence pair + raw Ultralytics tensor + recognized-object output
          frame_pressure_governor=session-relative ReplayKit FPS + inference latency + thermal + low-power
          cross_process_state=App Group exact snapshot + compact libnotify v3 with quantized x/y, confidence and exact pipeline stage
          hidden_position_extrapolation=disabled
          persistence=none for frames, screenshots, audio, or analysis history
          signing=unsigned; re-sign app and embedded Broadcast Extension without removing PlugIns
          EOF

          ls -lh "$IPA" "$MANIFEST"
          shasum -a 256 "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-082-fullbank
          path: |
            ${{ runner.temp }}/LiteView-unsigned-sideload.ipa
            ${{ runner.temp }}/LiteView-sideload-manifest.txt
          if-no-files-found: error

      - name: Publish release and move latest tag to exact build commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='liteview-sentinel-latest'
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-sideload-manifest.txt"
          NOTES='LiteView 0.8.2 fixes the quantized fallback decoder, rotates custom models only after independently confirmed visible misses, and adds session-relative ReplayKit frame-pressure backoff so the foreground app keeps priority. The large Phoenix capability bank remains cold on disk.'

          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$MANIFEST" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" \
              --title 'LiteView 0.8.2 Adaptive Sentinel Full Bank' --notes "$NOTES"
          else
            gh release create "$TAG" "$IPA" "$MANIFEST" --repo "${GITHUB_REPOSITORY}" \
              --title 'LiteView 0.8.2 Adaptive Sentinel Full Bank' --notes "$NOTES"
          fi
