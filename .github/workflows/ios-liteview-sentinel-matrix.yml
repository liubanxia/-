name: LiteView 0.9.1 Hybrid Game Detector Radar

on:
  push:
    branches:
      - feature/ios-realtime-vision-assist
    paths:
      - '.github/workflows/ios-liteview-sentinel-matrix.yml'
      - 'ios/PhoenixRealtimeVisionAssist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage one transient 384px game detector
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MODEL_DIR="$ROOT/Resources/BroadcastModels"
          ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          UNZIP_DIR="$RUNNER_TEMP/liteview-yolo11n-coreml"
          COMPILE_DIR="$RUNNER_TEMP/liteview-yolo11n-compiled"
          URL='https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'

          rm -rf "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          mkdir -p "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 -o "$ZIP" "$URL"
          unzip -q "$ZIP" -d "$UNZIP_DIR"
          SRC="$(find "$UNZIP_DIR" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$SRC"
          xcrun coremlc compile "$SRC" "$COMPILE_DIR"
          SRC_COMPILED="$(find "$COMPILE_DIR" -type d -name '*.mlmodelc' -print -quit)"
          test -n "$SRC_COMPILED"
          cp -R "$SRC_COMPILED" "$MODEL_DIR/yolo11n.mlmodelc"
          test -d "$MODEL_DIR/yolo11n.mlmodelc"
          du -sh "$MODEL_DIR/yolo11n.mlmodelc"

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Run lifecycle smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Core/SharedRealtimeStateStore.swift" \
            "$ROOT/Sources/Core/BroadcastLifecycle.swift" \
            "$ROOT/Sources/Vision/PhoenixCapabilityModelBank.swift" \
            "$ROOT/scripts/lifecycle_smoke_main.swift" \
            -o "$RUNNER_TEMP/liteview-lifecycle-smoke"
          "$RUNNER_TEMP/liteview-lifecycle-smoke"

      - name: Build fresh app and Broadcast Extension
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/LiteViewRadarDerivedData"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LiteViewRadarDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Stage hybrid detector radar package
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewRadarDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          test -d "$APP"
          test -d "$EXT"

          rm -rf "$APP"/*.mlmodelc
          rm -f "$APP/PhoenixCapabilityBank.json"

          set_plist_string() {
            local plist="$1" key="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" >/dev/null 2>&1 || \
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }

          set_plist_string "$APP/Info.plist" CFBundleDisplayName LiteView
          set_plist_string "$APP/Info.plist" CFBundleIdentifier com.phoenix.realtimevisionassist
          set_plist_string "$APP/Info.plist" CFBundleShortVersionString 0.9.1
          set_plist_string "$APP/Info.plist" CFBundleVersion 17
          set_plist_string "$EXT/Info.plist" CFBundleDisplayName 'LiteView Broadcast'
          set_plist_string "$EXT/Info.plist" CFBundleIdentifier com.phoenix.realtimevisionassist.broadcast
          set_plist_string "$EXT/Info.plist" CFBundleShortVersionString 0.9.1
          set_plist_string "$EXT/Info.plist" CFBundleVersion 17

          /usr/libexec/PlistBuddy -c 'Delete :NSExtension' "$EXT/Info.plist" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :NSExtension dict' "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSExtension:NSExtensionPointIdentifier string com.apple.broadcast-services-upload' "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSExtension:NSExtensionPrincipalClass string PhoenixBroadcastExtension.BroadcastSampleHandler' "$EXT/Info.plist"

          MODEL_COUNT="$(find "$EXT" -type d -name '*.mlmodelc' -prune -print | wc -l | tr -d ' ')"
          echo "MODEL_COUNT=$MODEL_COUNT"
          test "$MODEL_COUNT" = '1'
          test -n "$(find "$EXT" -type d -name 'yolo11n.mlmodelc' -prune -print -quit)"
          test -z "$(find "$EXT" -type d -name 'YOLOv3TinyInt8LUT.mlmodelc' -prune -print -quit)"

          EXT_SIZE_BYTES="$(du -sk "$EXT" | awk '{print $1 * 1024}')"
          APP_SIZE_BYTES="$(du -sk "$APP" | awk '{print $1 * 1024}')"
          echo "EXT_SIZE_BYTES=$EXT_SIZE_BYTES"
          echo "APP_SIZE_BYTES=$APP_SIZE_BYTES"
          test "$EXT_SIZE_BYTES" -lt 33554432

      - name: Package and verify LiteView 0.9.1 radar IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewRadarDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          ROOT="$RUNNER_TEMP/liteview-091-package"
          PAYLOAD="$ROOT/Payload"
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-radar-manifest.txt"
          VERIFY="$RUNNER_TEMP/liteview-091-verify"

          rm -rf "$ROOT" "$VERIFY" "$IPA" "$MANIFEST"
          mkdir -p "$PAYLOAD" "$VERIFY"
          cp -R "$APP" "$PAYLOAD/"
          (cd "$ROOT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"
          unzip -q "$IPA" -d "$VERIFY"

          VAPP="$VERIFY/Payload/PhoenixRealtimeVisionAssist.app"
          VEXT="$VAPP/PlugIns/PhoenixBroadcastExtension.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$VAPP/Info.plist")" = '0.9.1'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$VAPP/Info.plist")" = '17'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$VEXT/Info.plist")" = '0.9.1'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$VEXT/Info.plist")" = '17'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$VEXT/Info.plist")" = 'com.apple.broadcast-services-upload'
          test -n "$(find "$VEXT" -type d -name 'yolo11n.mlmodelc' -prune -print -quit)"
          test "$(find "$VEXT" -type d -name '*.mlmodelc' -prune -print | wc -l | tr -d ' ')" = '1'
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$VAPP/Info.plist" | grep -q audio

          cat > "$MANIFEST" <<EOF
          LiteView 0.9.1 hybrid game detector radar
          commit=${GITHUB_SHA}
          build=17
          replaykit_runtime=single yolo11n 384 Core ML sparse reacquisition + fast Vision tracker
          extension_models=yolo11n only; no second fallback model; no cold bank
          model_residency=transient; released immediately after sparse global scan
          display=system Picture in Picture radar window; red observed target + blue short-horizon prediction
          foreground_game_priority=one frame in flight + sparse global scans + tracker between scans + thermal/latency/frame-pressure backoff
          confidence_floor=0.12 for rendered game-character reacquisition
          hidden_position_extrapolation=disabled
          persistence=none for frames, screenshots, audio, or analysis history
          note=PiP is a floating radar, not a transparent arbitrary overlay over another app
          signing=unsigned; re-sign app and embedded Broadcast Extension without removing PlugIns
          EOF

          ls -lh "$IPA" "$MANIFEST"
          shasum -a 256 "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-091-hybrid-radar
          path: |
            ${{ runner.temp }}/LiteView-unsigned-sideload.ipa
            ${{ runner.temp }}/LiteView-radar-manifest.txt
          if-no-files-found: error

      - name: Publish hybrid radar test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='liteview-radar-latest'
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-radar-manifest.txt"
          NOTES='LiteView 0.9.1 restores one game-capable yolo11n detector only for sparse global reacquisition while keeping fast Vision tracking between scans. The Core ML model is released after each global scan to reduce ReplayKit memory residency. No second detector and no cold model bank are bundled. Red is observed target; blue is short-horizon prediction.'

          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$MANIFEST" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" \
              --title 'LiteView 0.9.1 Hybrid Game Detector Radar' --notes "$NOTES"
          else
            gh release create "$TAG" "$IPA" "$MANIFEST" --repo "${GITHUB_REPOSITORY}" \
              --title 'LiteView 0.9.1 Hybrid Game Detector Radar' --notes "$NOTES"
          fi
