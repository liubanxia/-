name: Phoenix core smoke

on:
  push:
    branches:
      - refactor/minimal-phoenix
      - refine/portable-runtime-audit
  pull_request:
    branches:
      - refactor/minimal-phoenix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile critical modules
        shell: pwsh
        run: |
          python -m py_compile "01_开发源码/model_adapters/monai_lung_nodule_ct.py"
          python -m py_compile "01_开发源码/model_adapters/blast_ct.py"
          python -m py_compile "01_开发源码/model_adapters/native_specialist_runtime.py"
          python -m py_compile "01_开发源码/model_adapters/ct_segmentation_runtime.py"
          python -m py_compile "01_开发源码/model_adapters/merlin_runtime.py"
          python -m py_compile "01_开发源码/ai_models/dicom_inference_service.py"
          python -m py_compile "01_开发源码/core/ct_series_selector.py"
          python -m py_compile "01_开发源码/core/ct_nifti.py"
          python -m py_compile "01_开发源码/core/case_router.py"
          python -m py_compile "01_开发源码/core/pipeline.py"
          python -m py_compile "01_开发源码/core/result_fusion.py"
          python -m py_compile "01_开发源码/core/dicom_geometry.py"
          python -m py_compile "01_开发源码/core/lesion_geometry.py"
          python -m py_compile "01_开发源码/core/report_generator.py"
          python -m py_compile "01_开发源码/core/environment_paths.py"
          python -m py_compile "01_开发源码/core/hardware_profile.py"
          python -m py_compile "01_开发源码/core/model_hub.py"
          python -m py_compile "01_开发源码/core/model_pool_policy.py"
          python -m py_compile "01_开发源码/core/build_model_hub.py"
          python -m py_compile "01_开发源码/core/yunpacs_live_controller.py"
          python -m py_compile "01_开发源码/output/marker_style.py"
          python -m py_compile "01_开发源码/output/lesion_viewer.py"
          python -m py_compile "01_开发源码/ui/phoenix_minimal_window.py"
          python -m py_compile "01_开发源码/pacs_io/folder_adapter.py"
          python -m py_compile "01_开发源码/pacs_io/yunpacs_adapter.py"
          python -m py_compile "01_开发源码/pacs_io/yunpacs_cache_adapter.py"
          python -m py_compile "01_开发源码/phoenix_minimal.py"

      - name: Run mocked MONAI direct inference test
        shell: pwsh
        run: python "07_测试/test_monai_lung_adapter_smoke.py"

      - name: Run CT second-stage routing simulation
        shell: pwsh
        run: python "07_测试/test_ct_second_stage_simulation.py"

      - name: Run hospital execution matrix
        shell: pwsh
        run: python "07_测试/test_hospital_execution_matrix.py"

      - name: Run Phoenix core safety tests
        shell: pwsh
        run: python "07_测试/test_phoenix_core_safety.py"

      - name: Run hospital hardware guard tests
        shell: pwsh
        run: python "07_测试/test_hospital_hardware_profile.py"

      - name: Run marker precision tests
        shell: pwsh
        run: python "07_测试/test_marker_precision.py"

      - name: Run portable runtime path audit
        shell: pwsh
        run: python "07_测试/test_portable_runtime_paths.py"
