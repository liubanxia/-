name: LiteView Pixel Capability Bank

on:
  push:
    branches:
      - feature/ios-realtime-vision-assist
    paths:
      - '.github/workflows/ios-liteview-phoenix-1gb-bank.yml'
      - 'ios/PhoenixRealtimeVisionAssist/Sources/Vision/**'
      - 'ios/PhoenixRealtimeVisionAssist/Tests/OfflineVisualBenchmark/**'
      - 'ios/PhoenixRealtimeVisionAssist/project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage pixel-value capability bank
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MODEL_DIR="$ROOT/Resources/Models"
          WORK="$RUNNER_TEMP/liteview-pixel-bank"
          COMPILED_ROOT="$WORK/compiled"
          rm -rf "$MODEL_DIR" "$WORK"
          mkdir -p "$MODEL_DIR" "$WORK" "$COMPILED_ROOT"

          download() {
            local url="$1" out="$2"
            curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 30 -o "$out" "$url"
          }

          compile_mlmodel() {
            local name="$1" url="$2"
            local src="$WORK/$name.mlmodel"
            local out="$COMPILED_ROOT/$name"
            rm -rf "$out"
            mkdir -p "$out"
            download "$url" "$src"
            xcrun coremlc compile "$src" "$out"
            local compiled
            compiled="$(find "$out" -type d -name '*.mlmodelc' -print -quit)"
            test -n "$compiled"
            cp -R "$compiled" "$MODEL_DIR/$name.mlmodelc"
          }

          optional_mlmodel() {
            local name="$1" url="$2"
            if compile_mlmodel "$name" "$url"; then
              echo "OPTIONAL_MODEL_OK=$name"
            else
              echo "OPTIONAL_MODEL_SKIPPED=$name" >&2
              rm -rf "$MODEL_DIR/$name.mlmodelc" "$COMPILED_ROOT/$name" "$WORK/$name.mlmodel"
            fi
          }

          compile_mlpackage_zip() {
            local name="$1" url="$2"
            local zip="$WORK/$name.zip"
            local unpack="$WORK/$name-unpack"
            local out="$COMPILED_ROOT/$name"
            rm -rf "$unpack" "$out"
            mkdir -p "$unpack" "$out"
            download "$url" "$zip"
            unzip -q "$zip" -d "$unpack"
            local manifest package compiled
            manifest="$(find "$unpack" -type f -name 'Manifest.json' -not -path '*/__MACOSX/*' -print -quit)"
            test -n "$manifest"
            package="${manifest%/Manifest.json}"
            xcrun coremlc compile "$package" "$out"
            compiled="$(find "$out" -type d -name '*.mlmodelc' -print -quit)"
            test -n "$compiled"
            cp -R "$compiled" "$MODEL_DIR/$name.mlmodelc"
          }

          optional_mlpackage_zip() {
            local name="$1" url="$2"
            if compile_mlpackage_zip "$name" "$url"; then
              echo "OPTIONAL_PACKAGE_OK=$name"
            else
              echo "OPTIONAL_PACKAGE_SKIPPED=$name" >&2
              rm -rf "$MODEL_DIR/$name.mlmodelc" "$COMPILED_ROOT/$name" "$WORK/$name.zip" "$WORK/$name-unpack"
            fi
          }

          # Localization: four distinct probes. Do not keep every precision duplicate.
          YOLO_ZIP="$WORK/liteview-yolo11n-coreml.zip"
          YOLO_UNPACK="$WORK/yolo11n-unpack"
          YOLO_COMPILE="$COMPILED_ROOT/yolo11n"
          download 'https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip' "$YOLO_ZIP"
          mkdir -p "$YOLO_UNPACK" "$YOLO_COMPILE"
          unzip -q "$YOLO_ZIP" -d "$YOLO_UNPACK"
          YOLO_PACKAGE="$(find "$YOLO_UNPACK" -type d -name 'yolo11n.mlpackage' -not -path '*/__MACOSX/*' -print -quit)"
          test -n "$YOLO_PACKAGE"
          xcrun coremlc compile "$YOLO_PACKAGE" "$YOLO_COMPILE"
          YOLO_COMPILED="$(find "$YOLO_COMPILE" -type d -name '*.mlmodelc' -print -quit)"
          test -n "$YOLO_COMPILED"
          cp -R "$YOLO_COMPILED" "$MODEL_DIR/yolo11n.mlmodelc"

          compile_mlmodel 'YOLOv3TinyInt8LUT' 'https://ml-assets.apple.com/coreml/models/Image/ObjectDetection/YOLOv3Tiny/YOLOv3TinyInt8LUT.mlmodel'
          compile_mlmodel 'YOLOv3Int8LUT' 'https://ml-assets.apple.com/coreml/models/Image/ObjectDetection/YOLOv3/YOLOv3Int8LUT.mlmodel'
          compile_mlmodel 'YOLOv3FP16' 'https://ml-assets.apple.com/coreml/models/Image/ObjectDetection/YOLOv3/YOLOv3FP16.mlmodel'

          # Pixel-level segmentation. Keep one fast quantized and one precision comparison path.
          compile_mlmodel 'DeepLabV3Int8LUT' 'https://ml-assets.apple.com/coreml/models/Image/Segmentation/DeepLabV3/DeepLabV3Int8LUT.mlmodel'
          compile_mlmodel 'DeepLabV3FP16' 'https://ml-assets.apple.com/coreml/models/Image/Segmentation/DeepLabV3/DeepLabV3FP16.mlmodel'

          # Appearance embeddings. Keep headless visual features; remove redundant classifiers.
          compile_mlmodel 'Resnet50Headless' 'https://ml-assets.apple.com/coreml/models/Image/ImageClassification/Resnet50/Resnet50Headless.mlmodel'
          compile_mlpackage_zip 'FastViTT8F16Headless' 'https://ml-assets.apple.com/coreml/models/Image/ImageClassification/FastViT/FastViTT8F16Headless.mlpackage.zip'
          optional_mlpackage_zip 'FastViTMA36F16Headless' 'https://ml-assets.apple.com/coreml/models/Image/ImageClassification/FastViT/FastViTMA36F16Headless.mlpackage.zip'

          # Relative depth/geometry reserve.
          optional_mlpackage_zip 'DepthAnythingV2SmallF16P6' 'https://ml-assets.apple.com/coreml/models/Image/DepthEstimation/DepthAnything/DepthAnythingV2SmallF16P6.mlpackage.zip'
          optional_mlpackage_zip 'DepthAnythingV2SmallF16' 'https://ml-assets.apple.com/coreml/models/Image/DepthEstimation/DepthAnything/DepthAnythingV2SmallF16.mlpackage.zip'

          cat > "$MODEL_DIR/PhoenixCapabilityBank.json" <<'EOF'
          {
            "architecture": "LiteView pixel-value split capability bank",
            "purpose": "offline visible-human pixel benchmark before any runtime integration",
            "pixel_policy": "preserve original source pixels; full frame + overlapping tiles + high-pixel center crops; map detections back to source coordinates before fusion",
            "runtime_rule": "large bank stays cold; never load the bank as a group",
            "kept": {
              "visible_localization": ["yolo11n", "YOLOv3TinyInt8LUT", "YOLOv3Int8LUT", "YOLOv3FP16"],
              "pixel_segmentation": ["DeepLabV3Int8LUT", "DeepLabV3FP16"],
              "feature_embedding": ["Resnet50Headless", "FastViTT8F16Headless", "FastViTMA36F16Headless"],
              "depth_geometry": ["DepthAnythingV2SmallF16P6", "DepthAnythingV2SmallF16"]
            },
            "removed_as_redundant": [
              "YOLOv3TinyFP16", "YOLOv3Tiny", "YOLOv3",
              "DeepLabV3",
              "MobileNetV2Int8LUT", "MobileNetV2FP16", "MobileNetV2",
              "Resnet50Int8LUT", "Resnet50FP16", "Resnet50",
              "FastViTT8F16", "FastViTMA36F16"
            ],
            "broadcast_extension": "no large bank; offline benchmark first",
            "persistence": "no captured frames or analysis history"
          }
          EOF

          echo '=== Pixel capability bank ==='
          du -sh "$MODEL_DIR"/*.mlmodelc 2>/dev/null | sort -h || true
          MODEL_COUNT="$(find "$MODEL_DIR" -type d -name '*.mlmodelc' -prune | wc -l | tr -d ' ')"
          MODEL_BANK_BYTES="$(du -sk "$MODEL_DIR" | awk '{print $1 * 1024}')"
          echo "MODEL_COUNT=$MODEL_COUNT"
          echo "MODEL_BANK_BYTES=$MODEL_BANK_BYTES"
          test "$MODEL_COUNT" -ge 8
          test "$MODEL_BANK_BYTES" -ge 200000000
          test "$MODEL_BANK_BYTES" -le 1200000000

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Run pixel bank smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Core/SharedRealtimeStateStore.swift" \
            "$ROOT/Sources/Core/BroadcastLifecycle.swift" \
            "$ROOT/Sources/Vision/PhoenixCapabilityModelBank.swift" \
            "$ROOT/scripts/lifecycle_smoke_main.swift" \
            -o "$RUNNER_TEMP/liteview-pixel-bank-smoke"
          "$RUNNER_TEMP/liteview-pixel-bank-smoke"

      - name: Build unsigned iPhone target
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/LiteViewPixelBankDerivedData"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LiteViewPixelBankDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Embed cold bank in main app only
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewPixelBankDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          MODEL_SRC='ios/PhoenixRealtimeVisionAssist/Resources/Models'
          test -d "$APP"
          test -d "$EXT"

          for SRC in "$MODEL_SRC"/*.mlmodelc; do
            [ -d "$SRC" ] || continue
            cp -R "$SRC" "$APP/$(basename "$SRC")"
          done
          cp "$MODEL_SRC/PhoenixCapabilityBank.json" "$APP/PhoenixCapabilityBank.json"

          # Never put the large bank in ReplayKit.
          find "$EXT" -type d -name '*.mlmodelc' -prune -exec rm -rf {} + || true

          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.9.2' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 18' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.9.2' "$EXT/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 18' "$EXT/Info.plist" || true

          APP_MODEL_COUNT="$(find "$APP" -maxdepth 1 -type d -name '*.mlmodelc' -prune | wc -l | tr -d ' ')"
          EXT_MODEL_COUNT="$(find "$EXT" -type d -name '*.mlmodelc' -prune | wc -l | tr -d ' ')"
          echo "APP_MODEL_COUNT=$APP_MODEL_COUNT"
          echo "EXT_MODEL_COUNT=$EXT_MODEL_COUNT"
          test "$APP_MODEL_COUNT" -ge 8
          test "$EXT_MODEL_COUNT" = '0'

      - name: Package pixel-bank IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewPixelBankDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          ROOT="$RUNNER_TEMP/liteview-pixel-bank-package"
          PAYLOAD="$ROOT/Payload"
          IPA="$RUNNER_TEMP/LiteView-PixelBank-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-PixelBank-manifest.txt"
          rm -rf "$ROOT" "$IPA" "$MANIFEST"
          mkdir -p "$PAYLOAD"
          cp -R "$APP" "$PAYLOAD/"
          (cd "$ROOT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"

          cat > "$MANIFEST" <<EOF
          LiteView 0.9.2 Pixel Capability Bank
          commit=${GITHUB_SHA}
          build=18
          purpose=offline pixel-preserving visible-human benchmark
          large_bank_location=main app only
          replaykit_large_bank=disabled
          pixel_plan=full frame + overlapping source-pixel tiles + center high-pixel crops
          EOF

          ls -lh "$IPA" "$MANIFEST"
          shasum -a 256 "$IPA"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-pixel-capability-bank
          path: |
            ${{ runner.temp }}/LiteView-PixelBank-unsigned-sideload.ipa
            ${{ runner.temp }}/LiteView-PixelBank-manifest.txt

      - name: Publish pixel bank release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='liteview-pixel-bank-latest'
          IPA="$RUNNER_TEMP/LiteView-PixelBank-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-PixelBank-manifest.txt"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$MANIFEST" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" \
              --title 'LiteView 0.9.2 Pixel Capability Bank' \
              --notes 'Restores the large Phoenix-style visual bank after pruning redundant classifier/precision duplicates. The bank is bundled only in the main app for offline pixel-preserving evaluation; ReplayKit remains lightweight.'
          else
            gh release create "$TAG" "$IPA" "$MANIFEST" --repo "${GITHUB_REPOSITORY}" \
              --title 'LiteView 0.9.2 Pixel Capability Bank' \
              --notes 'Restores the large Phoenix-style visual bank after pruning redundant classifier/precision duplicates. The bank is bundled only in the main app for offline pixel-preserving evaluation; ReplayKit remains lightweight.'
          fi
