name: LiteView Memory-Safe iOS Package

on:
  push:
    branches:
      - feature/ios-realtime-vision-assist
    paths:
      - 'ios/PhoenixRealtimeVisionAssist/**'
      - '.github/workflows/ios-liteview-memorysafe-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage and compile primary Core ML model for main app only
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MODEL_DIR="$ROOT/Resources/Models"
          PACKAGE="$MODEL_DIR/yolo11n.mlpackage"
          COMPILED="$MODEL_DIR/yolo11n.mlmodelc"
          ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          UNZIP_DIR="$RUNNER_TEMP/liteview-yolo11n-coreml"
          COMPILE_DIR="$RUNNER_TEMP/liteview-coreml-compiled"
          URL='https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'

          rm -rf "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          mkdir -p "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 -o "$ZIP" "$URL"
          unzip -q "$ZIP" -d "$UNZIP_DIR"
          SRC="$(find "$UNZIP_DIR" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$SRC"
          cp -R "$SRC" "$PACKAGE"
          xcrun coremlc compile "$PACKAGE" "$COMPILE_DIR"
          SRC_COMPILED="$(find "$COMPILE_DIR" -type d -name '*.mlmodelc' -print -quit)"
          test -n "$SRC_COMPILED"
          cp -R "$SRC_COMPILED" "$COMPILED"
          test -d "$COMPILED"

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Verify lightweight matrix runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          PROJECT="$ROOT/PhoenixRealtimeVisionAssist.xcodeproj/project.pbxproj"
          CONFIG="$ROOT/Sources/Core/RuntimeConfiguration.swift"
          SHARED="$ROOT/Sources/Core/SharedRealtimeStateStore.swift"
          LATCH="$ROOT/Sources/Core/DarwinBroadcastSignalLatch.swift"
          APP="$ROOT/Sources/App/PhoenixRealtimeVisionAssistApp.swift"
          HANDLER="$ROOT/Sources/Broadcast/BroadcastSampleHandler.swift"
          ANALYZER="$ROOT/Sources/Broadcast/LightweightBroadcastAnalyzer.swift"
          DETECTOR="$ROOT/Sources/Vision/RealtimePersonDetector.swift"
          COREML="$ROOT/Sources/Vision/CoreMLPersonDetector.swift"

          grep -Fq 'Config/App.entitlements' "$PROJECT"
          grep -Fq 'Config/Broadcast.entitlements' "$PROJECT"
          grep -Fq 'SharedRealtimeStateStore.swift' "$PROJECT"
          grep -Fq 'DarwinBroadcastSignalLatch.swift' "$PROJECT"
          grep -Fq 'LightweightBroadcastAnalyzer.swift' "$PROJECT"
          grep -Fq 'EntitlementFreeBroadcastStateChannel' "$SHARED"
          grep -Fq 'liteview_notify_set_state' "$SHARED"
          grep -Fq 'notify_check' "$LATCH"
          grep -Fq 'DarwinBroadcastSignalLatch' "$APP"
          grep -Fq 'extensionHeartbeatConfirmed' "$APP"
          grep -Fq 'enableModelMatrix: Bool = true' "$CONFIG"
          grep -Fq 'useCustomCoreMLModel: Bool = true' "$CONFIG"
          grep -Fq 'enableAudioLevelAnalysis: Bool = false' "$CONFIG"
          grep -Fq 'enableScreenCueAnalysis: Bool = false' "$CONFIG"
          grep -Fq 'predictionCount: Int = 0' "$CONFIG"
          grep -Fq 'VNDetectHumanBodyPoseRequest' "$ANALYZER"
          grep -Fq 'upperBodyOnly: true' "$ANALYZER"
          grep -Fq 'detectWithMatrix' "$DETECTOR"
          grep -Fq 'discoverCompiledModels' "$COREML"
          grep -Fq 'soundIndicatorCount: 0' "$HANDLER"

          if grep -R -Fq 'import CoreML' "$ROOT/Sources/Broadcast"; then
            echo 'Broadcast Extension must stay free of custom Core ML.' >&2
            exit 1
          fi

      - name: Run start-stop-start lifecycle smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Core/SharedRealtimeStateStore.swift" \
            "$ROOT/Sources/Core/BroadcastLifecycle.swift" \
            "$ROOT/scripts/lifecycle_smoke_main.swift" \
            -o "$RUNNER_TEMP/liteview-lifecycle-smoke"
          "$RUNNER_TEMP/liteview-lifecycle-smoke"

      - name: Build unsigned iPhone device target
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/LiteViewMemorySafeDerivedData"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LiteViewMemorySafeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Normalize and verify ReplayKit package
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewMemorySafeDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          APP_PLIST="$APP/Info.plist"
          EXT_PLIST="$EXT/Info.plist"
          MODEL_SRC='ios/PhoenixRealtimeVisionAssist/Resources/Models/yolo11n.mlmodelc'
          MODEL_DST="$APP/yolo11n.mlmodelc"

          test -d "$APP"
          test -d "$EXT"
          test -d "$MODEL_SRC"
          if [ ! -d "$MODEL_DST" ]; then
            cp -R "$MODEL_SRC" "$MODEL_DST"
          fi
          find "$EXT" -type d -name '*.mlmodelc' -prune -exec rm -rf {} + || true

          set_plist_string() {
            local plist="$1" key="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" >/dev/null 2>&1 || \
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }

          set_plist_string "$APP_PLIST" CFBundleDisplayName LiteView
          set_plist_string "$APP_PLIST" CFBundleIdentifier com.phoenix.realtimevisionassist
          set_plist_string "$APP_PLIST" CFBundleShortVersionString 0.4.1
          set_plist_string "$APP_PLIST" CFBundleVersion 7

          set_plist_string "$EXT_PLIST" CFBundleDisplayName 'LiteView Broadcast'
          set_plist_string "$EXT_PLIST" CFBundleIdentifier com.phoenix.realtimevisionassist.broadcast
          set_plist_string "$EXT_PLIST" CFBundleShortVersionString 0.4.1
          set_plist_string "$EXT_PLIST" CFBundleVersion 7

          /usr/libexec/PlistBuddy -c 'Delete :NSExtension' "$EXT_PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :NSExtension dict' "$EXT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :NSExtension:NSExtensionPointIdentifier string com.apple.broadcast-services-upload' "$EXT_PLIST"
          /usr/libexec/PlistBuddy -c 'Add :NSExtension:NSExtensionPrincipalClass string PhoenixBroadcastExtension.BroadcastSampleHandler' "$EXT_PLIST"

          EXT_SIZE_BYTES="$(du -sk "$EXT" | awk '{print $1 * 1024}')"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PLIST")"
          EXT_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT_PLIST")"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
          EXT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$EXT_PLIST")"
          EXT_POINT="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT_PLIST")"
          EXT_CLASS="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT_PLIST")"

          echo "APP_ID=$APP_ID"
          echo "EXT_ID=$EXT_ID"
          echo "APP_VERSION=$APP_VERSION"
          echo "EXT_VERSION=$EXT_VERSION"
          echo "EXT_SIZE_BYTES=$EXT_SIZE_BYTES"
          echo "EXT_POINT=$EXT_POINT"
          echo "EXT_CLASS=$EXT_CLASS"

          test -d "$MODEL_DST"
          test -z "$(find "$EXT" -type d -name '*.mlmodelc' -print -quit)"
          test "$EXT_SIZE_BYTES" -lt 12582912
          test "$APP_ID" = 'com.phoenix.realtimevisionassist'
          test "$EXT_ID" = 'com.phoenix.realtimevisionassist.broadcast'
          test "$APP_VERSION" = '0.4.1'
          test "$EXT_VERSION" = '0.4.1'
          test "$EXT_POINT" = 'com.apple.broadcast-services-upload'
          test "$EXT_CLASS" = 'PhoenixBroadcastExtension.BroadcastSampleHandler'

          echo '=== Bundle sizes ==='
          du -sh "$APP" "$EXT" "$MODEL_DST"

      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewMemorySafeDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          ROOT="$RUNNER_TEMP/LiteViewMemorySafePackage"
          PAYLOAD="$ROOT/Payload"
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-sideload-manifest.txt"
          VERIFY="$RUNNER_TEMP/LiteViewMemorySafeVerify"

          rm -rf "$ROOT" "$IPA" "$MANIFEST" "$VERIFY"
          mkdir -p "$PAYLOAD" "$VERIFY"
          cp -R "$APP" "$PAYLOAD/"
          (cd "$ROOT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"

          IPA_SIZE_BYTES="$(stat -f%z "$IPA")"
          test "$IPA_SIZE_BYTES" -le 1073741824
          /usr/bin/unzip -q "$IPA" -d "$VERIFY"

          VAPP="$VERIFY/Payload/PhoenixRealtimeVisionAssist.app"
          VEXT="$VAPP/PlugIns/PhoenixBroadcastExtension.appex"
          test -d "$VAPP/yolo11n.mlmodelc"
          test -z "$(find "$VEXT" -type d -name '*.mlmodelc' -print -quit)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$VAPP/Info.plist")" = 'com.phoenix.realtimevisionassist'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$VEXT/Info.plist")" = 'com.phoenix.realtimevisionassist.broadcast'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$VEXT/Info.plist")" = 'com.apple.broadcast-services-upload'

          cat > "$MANIFEST" <<EOF
          LiteView memory-safe unsigned sideload package
          commit=${GITHUB_SHA}
          version=0.4.1
          app_bundle_id=com.phoenix.realtimevisionassist
          extension_bundle_id=com.phoenix.realtimevisionassist.broadcast
          extension_point=com.apple.broadcast-services-upload
          app_group=group.com.phoenix.realtimevisionassist
          package_size_budget_bytes=1073741824
          broadcast_extension_size_budget_bytes=12582912
          broadcast_extension_custom_model=none
          broadcast_extension_model_matrix=Apple Vision full-body rectangles + upper-body rectangles + human body pose; adaptive rotation/fallback
          main_app_model_matrix=lazy Core ML detector pool + Apple Vision human rectangles + human body pose verifier
          main_app_coreml_primary=yolo11n.mlmodelc
          main_app_coreml_pool=drop-in compatible compiled models; one custom model resident at a time; automatic failover
          runtime_policy=secondary lanes only on empty/failure or periodic verification; low-power/thermal states reduce matrix work
          lifecycle=App Group snapshot + compact libnotify state + live Darwin events + pollable notify_check latch + UIScreen capture fallback
          heartbeat_recovery=latched lifecycle events survive main-app suspension; capture fallback no longer reports broadcast as waiting
          default_runtime=visible-content-only; optional audio/screen-cue analysis off by default; hidden-position extrapolation off
          persistence=none for frames, screenshots, audio, or analysis history
          signing=unsigned; re-sign main app and embedded Broadcast Extension without removing PlugIns
          EOF

          ls -lh "$IPA" "$MANIFEST"
          shasum -a 256 "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-memorysafe-unsigned-sideload
          path: |
            ${{ runner.temp }}/LiteView-unsigned-sideload.ipa
            ${{ runner.temp }}/LiteView-sideload-manifest.txt
          if-no-files-found: error

      - name: Publish public sideload release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='liteview-sideload-latest'
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-sideload-manifest.txt"
          NOTES='LiteView 0.4.1 keeps the lightweight AI matrix and fixes the persistent waiting-for-heartbeat state. The main app now arms pollable Darwin notify_check latches before broadcast, so lifecycle posts made while the app is suspended can be consumed after returning. UIScreen capture remains a system fallback and no longer blocks the running state when third-party re-signing prevents richer cross-process metrics.'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$MANIFEST" --clobber
            gh release edit "$TAG" --title 'LiteView 0.4.1 heartbeat-recovery sideload package' --notes "$NOTES"
          else
            gh release create "$TAG" "$IPA" "$MANIFEST" \
              --title 'LiteView 0.4.1 heartbeat-recovery sideload package' \
              --notes "$NOTES"
          fi
