name: LiteView Memory-Safe iOS Package

on:
  push:
    branches:
      - feature/ios-realtime-vision-assist
    paths:
      - 'ios/PhoenixRealtimeVisionAssist/**'
      - '.github/workflows/ios-liteview-memorysafe-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage and compile Core ML model for main app only
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MODEL_DIR="$ROOT/Resources/Models"
          PACKAGE="$MODEL_DIR/yolo11n.mlpackage"
          COMPILED="$MODEL_DIR/yolo11n.mlmodelc"
          ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          UNZIP_DIR="$RUNNER_TEMP/liteview-yolo11n-coreml"
          COMPILE_DIR="$RUNNER_TEMP/liteview-coreml-compiled"
          URL='https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'

          rm -rf "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          mkdir -p "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 -o "$ZIP" "$URL"
          unzip -q "$ZIP" -d "$UNZIP_DIR"
          SRC="$(find "$UNZIP_DIR" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$SRC"
          cp -R "$SRC" "$PACKAGE"
          xcrun coremlc compile "$PACKAGE" "$COMPILE_DIR"
          SRC_COMPILED="$(find "$COMPILE_DIR" -type d -name '*.mlmodelc' -print -quit)"
          test -n "$SRC_COMPILED"
          cp -R "$SRC_COMPILED" "$COMPILED"
          test -d "$COMPILED"

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Verify lifecycle and App Group wiring
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          PROJECT="$ROOT/PhoenixRealtimeVisionAssist.xcodeproj/project.pbxproj"
          APP_ENTITLEMENTS="$ROOT/Config/App.entitlements"
          EXT_ENTITLEMENTS="$ROOT/Config/Broadcast.entitlements"

          python3 - "$APP_ENTITLEMENTS" "$EXT_ENTITLEMENTS" <<'PY'
          import plistlib
          import sys

          expected = ["group.com.phoenix.realtimevisionassist"]
          for path in sys.argv[1:]:
              with open(path, "rb") as stream:
                  entitlements = plistlib.load(stream)
              actual = entitlements.get("com.apple.security.application-groups")
              if actual != expected:
                  raise SystemExit(f"{path}: unexpected App Group value {actual!r}")
          PY
          grep -Fq 'Config/App.entitlements' "$PROJECT"
          grep -Fq 'Config/Broadcast.entitlements' "$PROJECT"
          grep -Fq 'SharedRealtimeStateStore.swift' "$PROJECT"
          grep -Fq 'LightweightBroadcastAnalyzer.swift' "$PROJECT"
          grep -Fq 'BroadcastLifecycleTests.swift' "$PROJECT"

      - name: Run start-stop-start lifecycle smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Core/SharedRealtimeStateStore.swift" \
            "$ROOT/Sources/Core/BroadcastLifecycle.swift" \
            "$ROOT/scripts/lifecycle_smoke_main.swift" \
            -o "$RUNNER_TEMP/liteview-lifecycle-smoke"
          "$RUNNER_TEMP/liteview-lifecycle-smoke"

      - name: Build unsigned iPhone device target
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/LiteViewMemorySafeDerivedData"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LiteViewMemorySafeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Preserve and verify ReplayKit metadata
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          PRODUCTS="$RUNNER_TEMP/LiteViewMemorySafeDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          BUILT_PLIST="$EXT/Info.plist"

          test -d "$APP"
          test -d "$EXT"
          test -d "$APP/yolo11n.mlmodelc"
          test ! -d "$EXT/yolo11n.mlmodelc"

          EXT_SIZE_BYTES="$(du -sk "$EXT" | awk '{print $1 * 1024}')"
          test "$EXT_SIZE_BYTES" -lt 12582912

          EXT_POINT='com.apple.broadcast-services-upload'
          EXT_CLASS='PhoenixBroadcastExtension.BroadcastSampleHandler'
          /usr/libexec/PlistBuddy -c 'Delete :NSExtension' "$BUILT_PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :NSExtension dict' "$BUILT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSExtension:NSExtensionPointIdentifier string $EXT_POINT" "$BUILT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSExtension:NSExtensionPrincipalClass string $EXT_CLASS" "$BUILT_PLIST"

          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          EXT_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT/Info.plist")"
          test "$APP_ID" = 'com.phoenix.realtimevisionassist'
          test "$EXT_ID" = 'com.phoenix.realtimevisionassist.broadcast'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = 'LiteView'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$EXT/Info.plist")" = 'LiteView Broadcast'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$BUILT_PLIST")" = 'com.apple.broadcast-services-upload'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$BUILT_PLIST")" = 'PhoenixBroadcastExtension.BroadcastSampleHandler'

          echo '=== Bundle sizes ==='
          du -sh "$APP" "$EXT" "$APP/yolo11n.mlmodelc"
          echo '=== Extension files ==='
          find "$EXT" -maxdepth 2 -type f -print

      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewMemorySafeDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          ROOT="$RUNNER_TEMP/LiteViewMemorySafePackage"
          PAYLOAD="$ROOT/Payload"
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-sideload-manifest.txt"
          VERIFY="$RUNNER_TEMP/LiteViewMemorySafeVerify"

          rm -rf "$ROOT" "$IPA" "$MANIFEST" "$VERIFY"
          mkdir -p "$PAYLOAD" "$VERIFY"
          cp -R "$APP" "$PAYLOAD/"
          (cd "$ROOT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"
          /usr/bin/unzip -q "$IPA" -d "$VERIFY"

          VAPP="$VERIFY/Payload/PhoenixRealtimeVisionAssist.app"
          VEXT="$VAPP/PlugIns/PhoenixBroadcastExtension.appex"
          test -f "$VAPP/Info.plist"
          test -f "$VEXT/Info.plist"
          test -d "$VAPP/yolo11n.mlmodelc"
          test ! -d "$VEXT/yolo11n.mlmodelc"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$VAPP/Info.plist")" = 'LiteView'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$VEXT/Info.plist")" = 'LiteView Broadcast'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$VEXT/Info.plist")" = 'com.apple.broadcast-services-upload'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$VEXT/Info.plist")" = 'PhoenixBroadcastExtension.BroadcastSampleHandler'

          cat > "$MANIFEST" <<EOF
          LiteView memory-safe unsigned sideload package
          commit=${GITHUB_SHA}
          version=0.2.0
          app_bundle_id=com.phoenix.realtimevisionassist
          extension_bundle_id=com.phoenix.realtimevisionassist.broadcast
          extension_point=com.apple.broadcast-services-upload
          app_group=group.com.phoenix.realtimevisionassist
          broadcast_extension_model=none
          broadcast_extension_analysis=adaptive Vision human rectangles plus direct BGRA sound-cue sampling
          lifecycle=Darwin heartbeat plus App Group snapshot plus ReplayKit picker rebuild
          main_app_coreml=yolo11n.mlmodelc
          signing=unsigned; re-sign main app and embedded Broadcast Extension without removing PlugIns
          EOF

          ls -lh "$IPA" "$MANIFEST"
          shasum -a 256 "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-memorysafe-unsigned-sideload
          path: |
            ${{ runner.temp }}/LiteView-unsigned-sideload.ipa
            ${{ runner.temp }}/LiteView-sideload-manifest.txt
          if-no-files-found: error

      - name: Publish public sideload release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='liteview-sideload-latest'
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-sideload-manifest.txt"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$MANIFEST" --clobber
            gh release edit "$TAG" --title 'LiteView 0.2.0 stable restart sideload package' --notes 'Start → stop → start-again lifecycle rebuilt as a state machine. The extension keeps adaptive lightweight analysis, App Group snapshots, entitlement-free heartbeats, stale-session recovery, and no frame retention. Re-sign the app and embedded Broadcast Extension without removing PlugIns.'
          else
            gh release create "$TAG" "$IPA" "$MANIFEST" \
              --title 'LiteView 0.2.0 stable restart sideload package' \
              --notes 'Start → stop → start-again lifecycle rebuilt as a state machine. The extension keeps adaptive lightweight analysis, App Group snapshots, entitlement-free heartbeats, stale-session recovery, and no frame retention. Re-sign the app and embedded Broadcast Extension without removing PlugIns.'
          fi
