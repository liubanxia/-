name: Offline medical knowledge workbench smoke

on:
  push:
    branches:
      - refactor/minimal-phoenix
      - feature/offline-medical-knowledge-workbench
  pull_request:
    branches:
      - refactor/minimal-phoenix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: 14_学习中心/离线医学知识工作台
    env:
      QT_QPA_PLATFORM: offscreen
      PHOENIX_KNOWLEDGE_ACCELERATOR: cpu
      PHOENIX_KNOWLEDGE_DEEP_QA: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install workbench release-candidate test dependencies
        shell: pwsh
        run: >-
          python -m pip install --disable-pip-version-check
          PyMuPDF pypdf Pillow cryptography numpy python-docx PySide6

      - name: Compile workbench
        shell: pwsh
        run: |
          python -m py_compile app.py
          python -m py_compile model_download.py
          python -m py_compile release_license_tool.py
          python -m py_compile runtime_preflight.py
          python -m py_compile real_acceptance.py
          Get-ChildItem phoenix_knowledge -Filter *.py | ForEach-Object { python -m py_compile $_.FullName }

      - name: Run full workbench regression suite
        shell: pwsh
        run: python -m unittest discover -s tests -v
