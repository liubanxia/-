name: Offline medical knowledge workbench smoke

on:
  push:
    branches:
      - refactor/minimal-phoenix
      - feature/offline-medical-knowledge-workbench
  pull_request:
    branches:
      - refactor/minimal-phoenix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 14_学习中心/离线医学知识工作台

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight workbench test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check PyMuPDF cryptography

      - name: Compile workbench
        shell: pwsh
        run: |
          python -m py_compile app.py
          python -m py_compile model_download.py
          python -m py_compile release_license_tool.py
          Get-ChildItem phoenix_knowledge -Filter *.py | ForEach-Object { python -m py_compile $_.FullName }

      - name: Run core and real-PDF smoke tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
