name: LiteView Live Markers and Warnings Candidate

on:
  push:
    branches:
      - feature/liteview-audio-clean-overlay
    paths:
      - 'ios/PhoenixRealtimeVisionAssist/**'
      - '.github/workflows/liteview-audio-clean-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audio-clean-overlay:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage production YOLO11n model
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MODEL_DIR="$ROOT/Resources/BroadcastModels"
          ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          UNZIP_DIR="$RUNNER_TEMP/liteview-yolo11n-coreml"
          COMPILE_DIR="$RUNNER_TEMP/liteview-audio-clean-model"
          URL='https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'

          rm -rf "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          mkdir -p "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 -o "$ZIP" "$URL"
          unzip -q "$ZIP" -d "$UNZIP_DIR"
          SRC="$(find "$UNZIP_DIR" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$SRC"
          xcrun coremlc compile "$SRC" "$COMPILE_DIR"
          COMPILED="$(find "$COMPILE_DIR" -type d -name 'yolo11n.mlmodelc' -print -quit)"
          test -n "$COMPILED"
          cp -R "$COMPILED" "$MODEL_DIR/yolo11n.mlmodelc"

      - name: Guard audio and floating-dot wiring
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          HANDLER="$ROOT/Sources/Broadcast/EnhancedBroadcastSampleHandler.swift"
          AUDIO="$ROOT/Sources/Broadcast/BroadcastAudioTelemetryAnalyzer.swift"
          ACCEPTANCE="$ROOT/Sources/Broadcast/BroadcastDeviceAcceptanceTelemetry.swift"
          ACCEPTANCE_PANEL="$ROOT/Sources/App/DeviceAcceptancePanel.swift"
          FLOATING_DOTS="$ROOT/Sources/App/FloatingDotPiPController.swift"
          APP_ENTRY="$ROOT/Sources/App/PhoenixRealtimeVisionAssistApp.swift"
          APP_PLIST="$ROOT/Sources/App/Info.plist"
          PLIST="$ROOT/Sources/Broadcast/Info.plist"
          PROJECT="$ROOT/project.yml"
          ANALYZER="$ROOT/Sources/Broadcast/LightweightBroadcastAnalyzer.swift"

          grep -q 'case \.audioApp' "$HANDLER"
          grep -q 'audioAnalyzer.consume(sampleBuffer)' "$HANDLER"
          grep -q 'case \.audioMic' "$HANDLER"
          grep -q 'audio-diagnostics.v1' "$AUDIO"
          grep -q 'leftLevel' "$AUDIO"
          grep -q 'rightLevel' "$AUDIO"
          grep -q 'dominantBand' "$AUDIO"
          grep -q 'device-acceptance.v1' "$ACCEPTANCE"
          grep -q 'BroadcastDeviceAcceptanceTelemetryPublisher' "$ROOT/Sources/Broadcast/BroadcastSampleHandler.swift"
          grep -q 'DeviceAcceptancePanel' "$ACCEPTANCE_PANEL"
          grep -q 'audioApp 未持续投递' "$ACCEPTANCE_PANEL"
          grep -q 'FloatingDotPiPCard' "$APP_ENTRY"
          grep -q 'sampleBufferDisplayLayer' "$FLOATING_DOTS"
          grep -q 'CMSampleBufferCreateReadyWithImageBuffer' "$FLOATING_DOTS"
          grep -q 'CVPixelBufferPoolCreatePixelBuffer' "$FLOATING_DOTS"
          grep -q 'AVPictureInPictureSampleBufferPlaybackDelegate' "$FLOATING_DOTS"
          grep -q '开启悬浮标点' "$FLOATING_DOTS"
          grep -q '测试标点与预警' "$FLOATING_DOTS"
          grep -q 'AudioServicesPlaySystemSound' "$FLOATING_DOTS"
          grep -q 'lastBackgroundRenderDelta' "$FLOATING_DOTS"
          grep -q 'appEnteredBackground' "$APP_ENTRY"
          grep -q 'audio-diagnostics.v1' "$FLOATING_DOTS"
          grep -q 'LITEVIEW_FLOATING_DOTS_BUILD24' "$FLOATING_DOTS"
          grep -q 'AVAudioSession' "$FLOATING_DOTS"
          grep -q 'mixWithOthers' "$FLOATING_DOTS"
          grep -q 'minimumConfidence: 0.08' "$ANALYZER"
          grep -q 'minimumConfidence: 0.06' "$ANALYZER"
          grep -q 'EnhancedBroadcastSampleHandler' "$PLIST"
          grep -q 'RadarPiPController.swift' "$PROJECT"
          grep -q 'RadarBootstrapLoader.m' "$PROJECT"
          grep -q 'UIBackgroundModes' "$PROJECT"
          grep -q 'UIBackgroundModes' "$APP_PLIST"
          echo 'LIVE_MARKER_WARNING_WIRING_PASS'

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Verify floating dots included and legacy radar excluded
        shell: bash
        run: |
          set -euo pipefail
          PBX='ios/PhoenixRealtimeVisionAssist/PhoenixRealtimeVisionAssist.xcodeproj/project.pbxproj'
          ! grep -q 'RadarPiPController.swift' "$PBX"
          ! grep -q 'RadarBootstrapLoader.m' "$PBX"
          grep -q 'FloatingDotPiPController.swift' "$PBX"
          echo 'FLOATING_DOT_TARGET_PASS'

      - name: Run lifecycle smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Core/SharedRealtimeStateStore.swift" \
            "$ROOT/Sources/Core/BroadcastLifecycle.swift" \
            "$ROOT/Sources/Vision/PhoenixCapabilityModelBank.swift" \
            "$ROOT/scripts/lifecycle_smoke_main.swift" \
            -o "$RUNNER_TEMP/liteview-audio-clean-lifecycle"
          "$RUNNER_TEMP/liteview-audio-clean-lifecycle"

      - name: Run synthetic PCM telemetry test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Broadcast/BroadcastAudioTelemetryAnalyzer.swift" \
            "$ROOT/scripts/audio_synthetic_smoke.swift" \
            -framework AudioToolbox \
            -framework CoreMedia \
            -framework CoreFoundation \
            -o "$RUNNER_TEMP/liteview-audio-synthetic-smoke"
          "$RUNNER_TEMP/liteview-audio-synthetic-smoke"

      - name: Run device acceptance telemetry packing test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Broadcast/BroadcastDeviceAcceptanceTelemetry.swift" \
            "$ROOT/scripts/device_acceptance_telemetry_smoke.swift" \
            -o "$RUNNER_TEMP/liteview-device-acceptance-smoke"
          "$RUNNER_TEMP/liteview-device-acceptance-smoke"

      - name: Build unsigned iPhone Release app and Broadcast Extension
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/LiteViewAudioCleanDerivedData"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LiteViewAudioCleanDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Normalize 0.9.7 Build 24 and verify final binaries
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewAudioCleanDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          APP_PLIST="$APP/Info.plist"
          EXT_PLIST="$EXT/Info.plist"
          APP_BIN="$APP/PhoenixRealtimeVisionAssist"
          EXT_BIN="$EXT/PhoenixBroadcastExtension"
          APP_STRINGS="$RUNNER_TEMP/liteview-build24-app-strings.txt"
          EXT_STRINGS="$RUNNER_TEMP/liteview-build24-extension-strings.txt"
          APP_LINKS="$RUNNER_TEMP/liteview-build24-app-links.txt"

          test -d "$APP"
          test -d "$EXT"
          test -x "$APP_BIN"
          test -x "$EXT_BIN"
          strings "$APP_BIN" > "$APP_STRINGS"
          strings "$EXT_BIN" > "$EXT_STRINGS"
          otool -L "$APP_BIN" > "$APP_LINKS"

          set_plist_string() {
            local plist="$1" key="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" >/dev/null 2>&1 || \
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }

          set_plist_string "$APP_PLIST" CFBundleDisplayName LiteView
          set_plist_string "$APP_PLIST" CFBundleShortVersionString 0.9.7
          set_plist_string "$APP_PLIST" CFBundleVersion 24
          set_plist_string "$EXT_PLIST" CFBundleDisplayName 'LiteView Broadcast'
          set_plist_string "$EXT_PLIST" CFBundleShortVersionString 0.9.7
          set_plist_string "$EXT_PLIST" CFBundleVersion 24

          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT_PLIST")" = 'PhoenixBroadcastExtension.EnhancedBroadcastSampleHandler'
          test -n "$(find "$EXT" -type d -name 'yolo11n.mlmodelc' -prune -print -quit)"
          grep -q 'audio-diagnostics.v1' "$EXT_STRINGS"
          grep -q 'device-acceptance.v1' "$EXT_STRINGS"
          grep -q 'device-acceptance.v1' "$APP_STRINGS"
          grep -q 'FloatingDotPiPModel' "$APP_STRINGS"
          grep -q 'LITEVIEW_FLOATING_DOTS_BUILD24' "$APP_STRINGS"
          grep -q 'AVKit.framework' "$APP_LINKS"
          grep -q 'AVFoundation.framework' "$APP_LINKS"
          grep -q 'AudioToolbox.framework' "$APP_LINKS"
          ! grep -q 'LiteViewRadarBootstrap' "$APP_STRINGS"
          ! grep -q '开启游戏雷达' "$APP_STRINGS"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$APP_PLIST")" = audio
          echo 'FINAL_BINARY_VERIFICATION_PASS'

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewAudioCleanDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          ROOT="$RUNNER_TEMP/LiteViewAudioCleanPackage"
          PAYLOAD="$ROOT/Payload"
          IPA="$RUNNER_TEMP/LiteView-0.9.7-Build24-LiveMarkersWarnings-unsigned.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-0.9.7-Build24-LiveMarkersWarnings.txt"

          rm -rf "$ROOT" "$IPA" "$MANIFEST"
          mkdir -p "$PAYLOAD"
          cp -R "$APP" "$PAYLOAD/"
          (cd "$ROOT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"

          IPA_SIZE_BYTES="$(stat -f%z "$IPA")"
          IPA_SHA256="$(shasum -a 256 "$IPA" | awk '{print $1}')"

          cat > "$MANIFEST" <<EOF
          LiteView 0.9.7 Build 24 Live Markers and Warnings Candidate
          commit=${GITHUB_SHA}
          version=0.9.7
          build=24
          ipa_size_bytes=${IPA_SIZE_BYTES}
          ipa_sha256=${IPA_SHA256}
          video_pipeline=validated YOLO11n + ROI + tracker path preserved
          replaykit_audio=audioApp connected through EnhancedBroadcastSampleHandler
          synthetic_audio_test=48kHz stereo Float32 CMSampleBuffer -> analyzer -> Darwin telemetry PASS required
          audio_diagnostics=left/right aggregate level + peak + coarse frequency band + transient + sample rate + channel count
          audio_freshness=monotonic uptime slot + foreground/background delta; proves recent sustained audioApp delivery
          device_acceptance=video frame delta + AI delta + ReplayKit fps + inference latency + thermal state + low power state
          acceptance_persistence=volatile Darwin aggregate state only; cleared at next broadcast start
          microphone=ignored
          audio_persistence=none; no PCM history or audio files
          floating_dots=4fps AVSampleBufferDisplayLayer PiP; red observed target plus blue short-horizon prediction
          visual_warning=pulsing red border and warning glyph on visible-person evidence
          haptic_warning=throttled vibration on new visible-person evidence or fresh strong audio transient
          sound_warning=orange left/right edge cue from fresh stereo audioApp transient; not claimed as person identity
          renderer_self_test=8-second deterministic moving red/blue points, border, sound-direction cue, and vibration
          renderer_background_evidence=foreground/background render-frame delta shown after returning from game
          pipeline_status=WAIT/FRAMES/AI/NO TARGET/TARGET/AI ERROR state rendered inside PiP
          coordinate_mapping=top-down detector coordinates converted once for raw Core Graphics bitmap
          radar_runtime=legacy radar Swift/ObjC sources excluded from app target and absent from final app binary
          pip_keepalive=audio background mode plus playback session with mixWithOthers; no audio generated or persisted
          scope=visible-person vision plus generic app-audio diagnostics; no hidden-player or occlusion-location inference
          signing=unsigned; re-sign main app and embedded Broadcast Extension without removing PlugIns
          EOF

          echo "IPA_SIZE_BYTES=$IPA_SIZE_BYTES"
          echo "IPA_SHA256=$IPA_SHA256"
          cat "$MANIFEST"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-live-markers-warnings-0.9.7-build24
          path: |
            ${{ runner.temp }}/LiteView-0.9.7-Build24-LiveMarkersWarnings-unsigned.ipa
            ${{ runner.temp }}/LiteView-0.9.7-Build24-LiveMarkersWarnings.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='liteview-audio-clean-overlay-latest'
          IPA="$RUNNER_TEMP/LiteView-0.9.7-Build24-LiveMarkersWarnings-unsigned.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-0.9.7-Build24-LiveMarkersWarnings.txt"
          NOTES='LiteView 0.9.7 Build 24 live-markers candidate. Replaces the suspended video-call-style PiP view with a 4fps AVSampleBufferDisplayLayer PiP path, adds an 8-second renderer/warning self-test, pulsing visual and throttled vibration warnings, orange stereo-transient direction cues, explicit in-PiP pipeline states, and slightly more sensitive first-person acquisition. The PiP keepalive session mixes with other audio and produces or persists no audio.'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$MANIFEST" --clobber
            gh release edit "$TAG" --title 'LiteView 0.9.7 Build 24 Live Markers and Warnings' --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$IPA" "$MANIFEST" \
              --target "$GITHUB_SHA" \
              --title 'LiteView 0.9.7 Build 24 Live Markers and Warnings' \
              --notes "$NOTES"
          fi
