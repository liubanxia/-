name: LiteView Stability First Analysis Candidate

on:
  push:
    branches:
      - feature/liteview-audio-clean-overlay
    paths:
      - 'ios/PhoenixRealtimeVisionAssist/**'
      - '.github/workflows/liteview-audio-clean-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stability-first-analysis:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage production YOLO11n model
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MODEL_DIR="$ROOT/Resources/BroadcastModels"
          ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          UNZIP_DIR="$RUNNER_TEMP/liteview-yolo11n-coreml"
          COMPILE_DIR="$RUNNER_TEMP/liteview-build36-model"
          URL='https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'
          rm -rf "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          mkdir -p "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 -o "$ZIP" "$URL"
          unzip -q "$ZIP" -d "$UNZIP_DIR"
          SRC="$(find "$UNZIP_DIR" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$SRC"
          xcrun coremlc compile "$SRC" "$COMPILE_DIR"
          COMPILED="$(find "$COMPILE_DIR" -type d -name 'yolo11n.mlmodelc' -print -quit)"
          test -n "$COMPILED"
          cp -R "$COMPILED" "$MODEL_DIR/yolo11n.mlmodelc"

      - name: Guard Build 36 stability-first analysis
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MAPOCR="$ROOT/Sources/ExtensionSupport/BroadcastMapLocalizationAnalyzer.swift"
          COMPASS="$ROOT/Sources/ExtensionSupport/BroadcastCompassHeadingAnalyzer.swift"
          HUD="$ROOT/Sources/ExtensionSupport/BroadcastHUDSoundAnalyzer.swift"
          HANDLER="$ROOT/Sources/Broadcast/EnhancedBroadcastSampleHandler.swift"
          PROJECT="$ROOT/project.yml"

          grep -q 'requiredHits = switching ? 3 : 2' "$MAPOCR"
          grep -q 'Fragment matching is deliberately conservative' "$MAPOCR"
          grep -q 'confirmLargeJump' "$COMPASS"
          grep -q 'confidence >= 0.44' "$COMPASS"
          grep -q 'hits >= 2' "$HUD"
          grep -q 'verticalHits >= 2' "$HUD"
          grep -q 'mapLocalizationAnalyzer.consumeVideo' "$HANDLER"
          grep -q 'CURRENT_PROJECT_VERSION: 36' "$PROJECT"
          grep -q 'MARKETING_VERSION: 0.9.19' "$PROJECT"
          echo 'BUILD36_STABILITY_GUARD_PASS'

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Verify Build 36 target wiring
        shell: bash
        run: |
          set -euo pipefail
          PBX='ios/PhoenixRealtimeVisionAssist/PhoenixRealtimeVisionAssist.xcodeproj/project.pbxproj'
          grep -q 'AutoCircularMinimapRadarController.swift' "$PBX"
          grep -q 'BroadcastMapLocalizationAnalyzer.swift' "$PBX"
          grep -q 'BroadcastCompassHeadingAnalyzer.swift' "$PBX"
          grep -q 'BroadcastHUDSoundAnalyzer.swift' "$PBX"
          grep -q 'MapLocalizationStateChannel.swift' "$PBX"
          ! grep -q 'EdgeHUDRadarController.swift in Sources' "$PBX"
          echo 'BUILD36_TARGET_WIRING_PASS'

      - name: Run lifecycle smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Core/SharedRealtimeStateStore.swift" \
            "$ROOT/Sources/Core/BroadcastLifecycle.swift" \
            "$ROOT/Sources/Vision/PhoenixCapabilityModelBank.swift" \
            "$ROOT/scripts/lifecycle_smoke_main.swift" \
            -o "$RUNNER_TEMP/liteview-build36-lifecycle"
          "$RUNNER_TEMP/liteview-build36-lifecycle"

      - name: Run synthetic PCM telemetry test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Broadcast/BroadcastAudioTelemetryAnalyzer.swift" \
            "$ROOT/scripts/audio_synthetic_smoke.swift" \
            -framework AudioToolbox \
            -framework CoreMedia \
            -framework CoreFoundation \
            -o "$RUNNER_TEMP/liteview-build36-audio"
          "$RUNNER_TEMP/liteview-build36-audio"

      - name: Build unsigned iPhone Release app and Broadcast Extension
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/LiteViewBuild36DerivedData"
          rm -rf "$DERIVED"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Normalize 0.9.19 Build 36 and verify final binaries
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewBuild36DerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          APP_PLIST="$APP/Info.plist"
          EXT_PLIST="$EXT/Info.plist"
          APP_BIN="$APP/PhoenixRealtimeVisionAssist"
          EXT_BIN="$EXT/PhoenixBroadcastExtension"
          APP_LINKS="$RUNNER_TEMP/build36-app-links.txt"
          EXT_LINKS="$RUNNER_TEMP/build36-ext-links.txt"
          test -d "$APP" && test -d "$EXT" && test -x "$APP_BIN" && test -x "$EXT_BIN"
          otool -L "$APP_BIN" > "$APP_LINKS"
          otool -L "$EXT_BIN" > "$EXT_LINKS"

          set_plist_string() {
            local plist="$1" key="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" >/dev/null 2>&1 || \
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }
          set_plist_string "$APP_PLIST" CFBundleDisplayName LiteView
          set_plist_string "$APP_PLIST" CFBundleShortVersionString 0.9.19
          set_plist_string "$APP_PLIST" CFBundleVersion 36
          set_plist_string "$EXT_PLIST" CFBundleDisplayName 'LiteView Broadcast'
          set_plist_string "$EXT_PLIST" CFBundleShortVersionString 0.9.19
          set_plist_string "$EXT_PLIST" CFBundleVersion 36

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")" = '36'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXT_PLIST")" = '36'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT_PLIST")" = 'PhoenixBroadcastExtension.EnhancedBroadcastSampleHandler'
          test -n "$(find "$EXT" -type d -name 'yolo11n.mlmodelc' -prune -print -quit)"
          grep -q 'AVKit.framework' "$APP_LINKS"
          grep -q 'AVFoundation.framework' "$APP_LINKS"
          grep -q 'Vision.framework' "$EXT_LINKS"
          echo 'BUILD36_FINAL_BINARY_PASS'

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewBuild36DerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          ROOT="$RUNNER_TEMP/LiteViewBuild36Package"
          IPA="$RUNNER_TEMP/LiteView-0.9.19-Build36-StabilityFirstAnalysis-unsigned.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-0.9.19-Build36-StabilityFirstAnalysis.txt"
          rm -rf "$ROOT" "$IPA" "$MANIFEST"
          mkdir -p "$ROOT/Payload"
          cp -R "$APP" "$ROOT/Payload/"
          (cd "$ROOT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"
          SIZE="$(stat -f%z "$IPA")"
          SHA="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          cat > "$MANIFEST" <<EOF
          LiteView 0.9.19 Build 36 Stability First Analysis
          commit=${GITHUB_SHA}
          version=0.9.19
          build=36
          ipa_size_bytes=${SIZE}
          ipa_sha256=${SHA}
          map_poi=multi-frame hysteresis; map switches 3-hit gated
          compass=large-jump two-sample confirmation
          hud_sound=two-frame cue tracking; vertical arrow two-hit gated
          visible_people=existing multi-target tracker retained to avoid recall regression
          hidden_game_state=none
          memory_access=none
          signing=unsigned; preserve PlugIns when re-signing
          EOF
          echo "IPA_SIZE_BYTES=$SIZE"
          echo "IPA_SHA256=$SHA"
          cat "$MANIFEST"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-stability-first-analysis-0.9.19-build36
          path: |
            ${{ runner.temp }}/LiteView-0.9.19-Build36-StabilityFirstAnalysis-unsigned.ipa
            ${{ runner.temp }}/LiteView-0.9.19-Build36-StabilityFirstAnalysis.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='liteview-audio-clean-overlay-latest'
          IPA="$RUNNER_TEMP/LiteView-0.9.19-Build36-StabilityFirstAnalysis-unsigned.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-0.9.19-Build36-StabilityFirstAnalysis.txt"
          NOTES='Build 36 changes the analysis layer from single-frame acceptance to stability-first fusion. Map/POI switches require repeated OCR evidence, large compass jumps require a second confirming sample, and rendered soundwave/vertical-arrow cues require cross-frame persistence. Existing visible-person multi-target tracking is retained so the accuracy fix does not simply trade false positives for more missed people.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$MANIFEST" --clobber
            gh release edit "$TAG" --title 'LiteView 0.9.19 Build 36 Stability First Analysis' --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$IPA" "$MANIFEST" \
              --target "$GITHUB_SHA" \
              --title 'LiteView 0.9.19 Build 36 Stability First Analysis' \
              --notes "$NOTES"
          fi
