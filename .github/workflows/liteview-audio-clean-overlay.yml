name: LiteView Edge HUD Candidate

on:
  push:
    branches:
      - feature/liteview-audio-clean-overlay
    paths:
      - 'ios/PhoenixRealtimeVisionAssist/**'
      - '.github/workflows/liteview-audio-clean-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-edge-hud:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage production YOLO11n model
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MODEL_DIR="$ROOT/Resources/BroadcastModels"
          ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          UNZIP_DIR="$RUNNER_TEMP/liteview-yolo11n-coreml"
          COMPILE_DIR="$RUNNER_TEMP/liteview-build33-model"
          URL='https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'
          rm -rf "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          mkdir -p "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 -o "$ZIP" "$URL"
          unzip -q "$ZIP" -d "$UNZIP_DIR"
          SRC="$(find "$UNZIP_DIR" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$SRC"
          xcrun coremlc compile "$SRC" "$COMPILE_DIR"
          COMPILED="$(find "$COMPILE_DIR" -type d -name 'yolo11n.mlmodelc' -print -quit)"
          test -n "$COMPILED"
          cp -R "$COMPILED" "$MODEL_DIR/yolo11n.mlmodelc"

      - name: Guard Build 33 edge HUD wiring
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          CTRL="$ROOT/Sources/App/EdgeHUDRadarController.swift"
          HUD="$ROOT/Sources/ExtensionSupport/BroadcastHUDSoundAnalyzer.swift"
          COMPASS="$ROOT/Sources/ExtensionSupport/BroadcastCompassHeadingAnalyzer.swift"
          SPATIAL="$ROOT/Sources/Broadcast/BroadcastSpatialAudioAnalyzer.swift"
          HANDLER="$ROOT/Sources/Broadcast/EnhancedBroadcastSampleHandler.swift"
          PROJECT="$ROOT/project.yml"

          grep -q 'B33 EDGE HUD' "$CTRL"
          grep -q 'LITEVIEW_EDGE_HUD_BUILD33' "$CTRL"
          grep -q 'kCVPixelBufferWidthKey: 480' "$CTRL"
          grep -q 'kCVPixelBufferHeightKey: 96' "$CTRL"
          grep -q '0.08...0.35' "$CTRL"
          grep -q 'HUDSoundStateReader' "$CTRL"
          grep -q 'CompassHeadingStateReader' "$CTRL"
          grep -q 'SpatialAudioStateReader' "$CTRL"
          grep -q 'BroadcastHUDSoundAnalyzer' "$HUD"
          grep -q 'verticalCue' "$HUD"
          grep -q 'BroadcastCompassHeadingAnalyzer' "$COMPASS"
          grep -q 'bestNormalizedCorrelation' "$SPATIAL"
          grep -q 'hudSoundAnalyzer.consumeVideo' "$HANDLER"
          grep -q 'compassAnalyzer.consumeVideo' "$HANDLER"
          grep -q 'CURRENT_PROJECT_VERSION: 33' "$PROJECT"
          grep -q 'MARKETING_VERSION: 0.9.16' "$PROJECT"
          grep -q 'HUDFusedRadarController.swift' "$PROJECT"
          echo 'BUILD33_EDGE_HUD_WIRING_PASS'

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Verify Build 33 target wiring
        shell: bash
        run: |
          set -euo pipefail
          PBX='ios/PhoenixRealtimeVisionAssist/PhoenixRealtimeVisionAssist.xcodeproj/project.pbxproj'
          grep -q 'EdgeHUDRadarController.swift' "$PBX"
          grep -q 'BroadcastHUDSoundAnalyzer.swift' "$PBX"
          grep -q 'BroadcastCompassHeadingAnalyzer.swift' "$PBX"
          ! grep -q 'HUDFusedRadarController.swift in Sources' "$PBX"
          ! grep -q 'EvidenceFirstRadarController.swift in Sources' "$PBX"
          ! grep -q 'VisibleMultiMapRadarController.swift in Sources' "$PBX"
          ! grep -q 'MultiMapFloatingRadarController.swift in Sources' "$PBX"
          ! grep -q 'FullMapFloatingRadarController.swift in Sources' "$PBX"
          ! grep -q 'FloatingDotPiPController.swift in Sources' "$PBX"
          echo 'BUILD33_TARGET_WIRING_PASS'

      - name: Run lifecycle smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Core/SharedRealtimeStateStore.swift" \
            "$ROOT/Sources/Core/BroadcastLifecycle.swift" \
            "$ROOT/Sources/Vision/PhoenixCapabilityModelBank.swift" \
            "$ROOT/scripts/lifecycle_smoke_main.swift" \
            -o "$RUNNER_TEMP/liteview-build33-lifecycle"
          "$RUNNER_TEMP/liteview-build33-lifecycle"

      - name: Run synthetic PCM telemetry test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Broadcast/BroadcastAudioTelemetryAnalyzer.swift" \
            "$ROOT/scripts/audio_synthetic_smoke.swift" \
            -framework AudioToolbox \
            -framework CoreMedia \
            -framework CoreFoundation \
            -o "$RUNNER_TEMP/liteview-build33-audio"
          "$RUNNER_TEMP/liteview-build33-audio"

      - name: Build unsigned iPhone Release app and Broadcast Extension
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/LiteViewBuild33DerivedData"
          rm -rf "$DERIVED"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Normalize 0.9.16 Build 33 and verify final binaries
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewBuild33DerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          APP_PLIST="$APP/Info.plist"
          EXT_PLIST="$EXT/Info.plist"
          APP_BIN="$APP/PhoenixRealtimeVisionAssist"
          EXT_BIN="$EXT/PhoenixBroadcastExtension"
          APP_LINKS="$RUNNER_TEMP/build33-app-links.txt"
          EXT_LINKS="$RUNNER_TEMP/build33-ext-links.txt"
          test -d "$APP" && test -d "$EXT" && test -x "$APP_BIN" && test -x "$EXT_BIN"
          otool -L "$APP_BIN" > "$APP_LINKS"
          otool -L "$EXT_BIN" > "$EXT_LINKS"

          set_plist_string() {
            local plist="$1" key="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" >/dev/null 2>&1 || \
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }
          set_plist_string "$APP_PLIST" CFBundleDisplayName LiteView
          set_plist_string "$APP_PLIST" CFBundleShortVersionString 0.9.16
          set_plist_string "$APP_PLIST" CFBundleVersion 33
          set_plist_string "$EXT_PLIST" CFBundleDisplayName 'LiteView Broadcast'
          set_plist_string "$EXT_PLIST" CFBundleShortVersionString 0.9.16
          set_plist_string "$EXT_PLIST" CFBundleVersion 33

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")" = '33'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXT_PLIST")" = '33'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT_PLIST")" = 'PhoenixBroadcastExtension.EnhancedBroadcastSampleHandler'
          test -n "$(find "$EXT" -type d -name 'yolo11n.mlmodelc' -prune -print -quit)"
          grep -q 'AVKit.framework' "$APP_LINKS"
          grep -q 'AVFoundation.framework' "$APP_LINKS"
          grep -q 'AudioToolbox.framework' "$APP_LINKS"
          grep -q 'Vision.framework' "$EXT_LINKS"
          echo 'BUILD33_FINAL_BINARY_PASS'

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewBuild33DerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          ROOT="$RUNNER_TEMP/LiteViewBuild33Package"
          IPA="$RUNNER_TEMP/LiteView-0.9.16-Build33-EdgeHUD-unsigned.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-0.9.16-Build33-EdgeHUD.txt"
          rm -rf "$ROOT" "$IPA" "$MANIFEST"
          mkdir -p "$ROOT/Payload"
          cp -R "$APP" "$ROOT/Payload/"
          (cd "$ROOT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"
          SIZE="$(stat -f%z "$IPA")"
          SHA="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          cat > "$MANIFEST" <<EOF
          LiteView 0.9.16 Build 33 Edge HUD
          commit=${GITHUB_SHA}
          version=0.9.16
          build=33
          ipa_size_bytes=${SIZE}
          ipa_sha256=${SHA}
          pip_canvas=480x96 ultra-wide edge strip
          default_background_opacity=20%
          adjustable_background_opacity=8%-35%
          full_map_overlay=removed from always-on PiP
          visual_marker=thin red direction dot only
          sound_marker=small orange/pink triangle with optional up/down cue
          self_marker=small green center dot
          compass=automatic top-screen OCR retained
          hrtf=stereo delay/coherence retained as secondary evidence
          hud_sound=screen-visible soundwave recognition retained as primary sound evidence
          hidden_game_state=none
          memory_access=none
          signing=unsigned; preserve PlugIns when re-signing
          EOF
          echo "IPA_SIZE_BYTES=$SIZE"
          echo "IPA_SHA256=$SHA"
          cat "$MANIFEST"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-edge-hud-0.9.16-build33
          path: |
            ${{ runner.temp }}/LiteView-0.9.16-Build33-EdgeHUD-unsigned.ipa
            ${{ runner.temp }}/LiteView-0.9.16-Build33-EdgeHUD.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='liteview-audio-clean-overlay-latest'
          IPA="$RUNNER_TEMP/LiteView-0.9.16-Build33-EdgeHUD-unsigned.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-0.9.16-Build33-EdgeHUD.txt"
          NOTES='Build 33 removes the always-on square full-map PiP that obscured gameplay. The active overlay is now a 480x96 ultra-wide edge strip with 8%-35% background opacity. It keeps thin visible-person direction dots, screen-visible soundwave direction and up/down cues, automatic compass OCR, and HRTF secondary audio evidence while leaving the main game view unobstructed.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$MANIFEST" --clobber
            gh release edit "$TAG" --title 'LiteView 0.9.16 Build 33 Edge HUD' --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$IPA" "$MANIFEST" \
              --target "$GITHUB_SHA" \
              --title 'LiteView 0.9.16 Build 33 Edge HUD' \
              --notes "$NOTES"
          fi
