name: LiteView Six Map Predictive Radar Candidate

on:
  push:
    branches:
      - feature/liteview-audio-clean-overlay
    paths:
      - 'ios/PhoenixRealtimeVisionAssist/**'
      - '.github/workflows/liteview-audio-clean-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audio-clean-overlay:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage production YOLO11n model
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MODEL_DIR="$ROOT/Resources/BroadcastModels"
          ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          UNZIP_DIR="$RUNNER_TEMP/liteview-yolo11n-coreml"
          COMPILE_DIR="$RUNNER_TEMP/liteview-six-map-model"
          URL='https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'
          rm -rf "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          mkdir -p "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 -o "$ZIP" "$URL"
          unzip -q "$ZIP" -d "$UNZIP_DIR"
          SRC="$(find "$UNZIP_DIR" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$SRC"
          xcrun coremlc compile "$SRC" "$COMPILE_DIR"
          COMPILED="$(find "$COMPILE_DIR" -type d -name 'yolo11n.mlmodelc' -print -quit)"
          test -n "$COMPILED"
          cp -R "$COMPILED" "$MODEL_DIR/yolo11n.mlmodelc"

      - name: Guard six-map wiring
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          CONTROLLER="$ROOT/Sources/App/MultiMapFloatingRadarController.swift"
          MAP_SEEDS="$ROOT/Sources/Map/DeltaMapSeeds.swift"
          MAP_CATALOG="$ROOT/Sources/Map/DeltaMapCatalog.swift"
          MAP_ENGINE="$ROOT/Sources/Map/FullMapPredictiveRadarEngine.swift"
          PROJECT="$ROOT/project.yml"
          HANDLER="$ROOT/Sources/Broadcast/EnhancedBroadcastSampleHandler.swift"
          AUDIO="$ROOT/Sources/Broadcast/BroadcastAudioTelemetryAnalyzer.swift"
          ANALYZER="$ROOT/Sources/Broadcast/LightweightBroadcastAnalyzer.swift"

          grep -q 'selectedMapID' "$CONTROLLER"
          grep -q 'LITEVIEW_MULTI_MAP_RADAR_BUILD29' "$CONTROLLER"
          grep -q 'DeltaMapCatalog.defaultAnchorID' "$CONTROLLER"
          grep -q 'predictionEngine.knowledge(for: selectedMapID)' "$CONTROLLER"
          grep -q 'predictionEngine.predictRoutes' "$CONTROLLER"
          grep -q 'exp(-age / 2.25)' "$CONTROLLER"
          grep -q 'stableTargetFrameCount >= 2' "$CONTROLLER"
          grep -q 'kCMSampleAttachmentKey_DisplayImmediately' "$CONTROLLER"
          grep -q 'AudioServicesPlaySystemSound' "$CONTROLLER"
          grep -q 'audio-diagnostics.v1' "$CONTROLLER"
          grep -q 'case \.audioApp' "$HANDLER"
          grep -q 'audioAnalyzer.consume(sampleBuffer)' "$HANDLER"
          grep -q 'leftLevel' "$AUDIO"
          grep -q 'rightLevel' "$AUDIO"
          grep -q 'FullMapPredictiveRadarEngine' "$MAP_ENGINE"
          grep -q 'static let zeroDam' "$MAP_SEEDS"
          grep -q 'static let layaliGrove' "$MAP_SEEDS"
          grep -q 'static let spaceCity' "$MAP_SEEDS"
          grep -q 'static let brakkesh' "$MAP_SEEDS"
          grep -q 'static let tidePrison' "$MAP_SEEDS"
          grep -q 'static let az3' "$MAP_SEEDS"
          grep -q 'Zero Dam / 零号大坝' "$MAP_CATALOG"
          grep -q 'Layali Grove / 长弓溪谷' "$MAP_CATALOG"
          grep -q 'Space City / 航天基地' "$MAP_CATALOG"
          grep -q 'Brakkesh / 巴克什' "$MAP_CATALOG"
          grep -q 'Tide Prison / 潮汐监狱' "$MAP_CATALOG"
          grep -q 'AZ3 / 核电站' "$MAP_CATALOG"
          grep -q 'FullMapFloatingRadarController.swift' "$PROJECT"
          grep -q 'CURRENT_PROJECT_VERSION: 29' "$PROJECT"
          grep -q 'MARKETING_VERSION: 0.9.12' "$PROJECT"
          grep -q 'minimumConfidence: 0.08' "$ANALYZER"
          grep -q 'VNDetectHumanRectanglesRequest' "$ANALYZER"
          echo 'SIX_MAP_WIRING_PASS'

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Verify only six-map controller is compiled
        shell: bash
        run: |
          set -euo pipefail
          PBX='ios/PhoenixRealtimeVisionAssist/PhoenixRealtimeVisionAssist.xcodeproj/project.pbxproj'
          ! grep -q 'RadarPiPController.swift' "$PBX"
          ! grep -q 'FloatingDotPiPController.swift' "$PBX"
          ! grep -q 'FullMapFloatingRadarController.swift' "$PBX"
          grep -q 'MultiMapFloatingRadarController.swift' "$PBX"
          grep -q 'FullMapPredictiveRadarEngineTests.swift' "$PBX"
          echo 'SIX_MAP_TARGET_PASS'

      - name: Run lifecycle smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Core/SharedRealtimeStateStore.swift" \
            "$ROOT/Sources/Core/BroadcastLifecycle.swift" \
            "$ROOT/Sources/Vision/PhoenixCapabilityModelBank.swift" \
            "$ROOT/scripts/lifecycle_smoke_main.swift" \
            -o "$RUNNER_TEMP/liteview-six-map-lifecycle"
          "$RUNNER_TEMP/liteview-six-map-lifecycle"

      - name: Run synthetic PCM telemetry test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Broadcast/BroadcastAudioTelemetryAnalyzer.swift" \
            "$ROOT/scripts/audio_synthetic_smoke.swift" \
            -framework AudioToolbox \
            -framework CoreMedia \
            -framework CoreFoundation \
            -o "$RUNNER_TEMP/liteview-six-map-audio"
          "$RUNNER_TEMP/liteview-six-map-audio"

      - name: Build unsigned iPhone Release app and tests
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/LiteViewSixMapDerivedData"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LiteViewSixMapDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Normalize 0.9.12 Build 29 and verify final binaries
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewSixMapDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          APP_PLIST="$APP/Info.plist"
          EXT_PLIST="$EXT/Info.plist"
          APP_BIN="$APP/PhoenixRealtimeVisionAssist"
          EXT_BIN="$EXT/PhoenixBroadcastExtension"
          APP_STRINGS="$RUNNER_TEMP/liteview-build29-app-strings.txt"
          EXT_STRINGS="$RUNNER_TEMP/liteview-build29-extension-strings.txt"

          test -d "$APP"
          test -d "$EXT"
          test -x "$APP_BIN"
          test -x "$EXT_BIN"
          strings "$APP_BIN" > "$APP_STRINGS"
          strings "$EXT_BIN" > "$EXT_STRINGS"

          set_plist_string() {
            local plist="$1" key="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" >/dev/null 2>&1 || \
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }

          set_plist_string "$APP_PLIST" CFBundleDisplayName LiteView
          set_plist_string "$APP_PLIST" CFBundleShortVersionString 0.9.12
          set_plist_string "$APP_PLIST" CFBundleVersion 29
          set_plist_string "$EXT_PLIST" CFBundleDisplayName 'LiteView Broadcast'
          set_plist_string "$EXT_PLIST" CFBundleShortVersionString 0.9.12
          set_plist_string "$EXT_PLIST" CFBundleVersion 29

          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT_PLIST")" = 'PhoenixBroadcastExtension.EnhancedBroadcastSampleHandler'
          test -n "$(find "$EXT" -type d -name 'yolo11n.mlmodelc' -prune -print -quit)"
          grep -q 'LITEVIEW_MULTI_MAP_RADAR_BUILD29' "$APP_STRINGS"
          grep -q 'FloatingDotPiPModel' "$APP_STRINGS"
          grep -q 'Zero Dam /' "$APP_STRINGS"
          grep -q 'Space City /' "$APP_STRINGS"
          grep -q 'Tide Prison /' "$APP_STRINGS"
          grep -q 'audio-diagnostics.v1' "$EXT_STRINGS"
          ! grep -q 'LiteViewRadarBootstrap' "$APP_STRINGS"
          echo 'BUILD29_BINARY_PASS'

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewSixMapDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          ROOT="$RUNNER_TEMP/LiteViewSixMapPackage"
          PAYLOAD="$ROOT/Payload"
          IPA="$RUNNER_TEMP/LiteView-0.9.12-Build29-SixMapPredictiveRadar-unsigned.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-0.9.12-Build29-SixMapPredictiveRadar.txt"
          rm -rf "$ROOT" "$IPA" "$MANIFEST"
          mkdir -p "$PAYLOAD"
          cp -R "$APP" "$PAYLOAD/"
          (cd "$ROOT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"
          IPA_SIZE_BYTES="$(stat -f%z "$IPA")"
          IPA_SHA256="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          cat > "$MANIFEST" <<EOF
          LiteView 0.9.12 Build 29 Six Map Predictive Radar
          commit=${GITHUB_SHA}
          version=0.9.12
          build=29
          ipa_size_bytes=${IPA_SIZE_BYTES}
          ipa_sha256=${IPA_SHA256}
          maps=Zero Dam; Layali Grove; Space City; Brakkesh; Tide Prison; AZ3
          topology=normalized public POI/route relationships only
          visual=stable visible-person screen bearing -> red topology estimate
          prediction=up to four blue route candidates; about 4.5 second exponential decay
          audio=fresh stereo transient -> orange low-confidence route candidates
          calibration=user selects map, current-area anchor and heading
          persistence=volatile only; no audio/video/history retained
          prohibited_inputs=game memory; injection; DMA; hidden entity coordinates
          signing=unsigned; preserve PlugIns while re-signing
          EOF
          echo "IPA_SIZE_BYTES=$IPA_SIZE_BYTES"
          echo "IPA_SHA256=$IPA_SHA256"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-six-map-predictive-radar-0.9.12-build29
          path: |
            ${{ runner.temp }}/LiteView-0.9.12-Build29-SixMapPredictiveRadar-unsigned.ipa
            ${{ runner.temp }}/LiteView-0.9.12-Build29-SixMapPredictiveRadar.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='liteview-audio-clean-overlay-latest'
          IPA="$RUNNER_TEMP/LiteView-0.9.12-Build29-SixMapPredictiveRadar-unsigned.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-0.9.12-Build29-SixMapPredictiveRadar.txt"
          NOTES='LiteView 0.9.12 Build 29 extends the public-topology predictive PiP radar to all six current Operations maps: Zero Dam, Layali Grove, Space City, Brakkesh, Tide Prison and AZ3. Select the map, current-area anchor and heading before play. Red is recent visible-person topology mapping, blue is short-lived route probability, orange is coarse stereo direction. No game memory, injection, DMA or hidden entity feed is used.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$MANIFEST" --clobber
            gh release edit "$TAG" --title 'LiteView 0.9.12 Build 29 Six Map Predictive Radar' --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$IPA" "$MANIFEST" \
              --target "$GITHUB_SHA" \
              --title 'LiteView 0.9.12 Build 29 Six Map Predictive Radar' \
              --notes "$NOTES"
          fi
