name: LiteView Web Radar Candidate

on:
  push:
    branches:
      - feature/liteview-audio-clean-overlay
    paths:
      - 'ios/PhoenixRealtimeVisionAssist/**'
      - 'web/liteview-radar/**'
      - '.github/workflows/liteview-audio-clean-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web-radar-candidate:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage production YOLO11n model
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MODEL_DIR="$ROOT/Resources/BroadcastModels"
          ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          UNZIP_DIR="$RUNNER_TEMP/liteview-yolo11n-coreml"
          COMPILE_DIR="$RUNNER_TEMP/liteview-build38-model"
          URL='https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'
          rm -rf "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          mkdir -p "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 -o "$ZIP" "$URL"
          unzip -q "$ZIP" -d "$UNZIP_DIR"
          SRC="$(find "$UNZIP_DIR" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$SRC"
          xcrun coremlc compile "$SRC" "$COMPILE_DIR"
          COMPILED="$(find "$COMPILE_DIR" -type d -name 'yolo11n.mlmodelc' -print -quit)"
          test -n "$COMPILED"
          cp -R "$COMPILED" "$MODEL_DIR/yolo11n.mlmodelc"

      - name: Guard Build 38 Web Radar wiring
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          HANDLER="$ROOT/Sources/Broadcast/EnhancedBroadcastSampleHandler.swift"
          BRIDGE="$ROOT/Sources/Broadcast/BroadcastWebRadarBridge.swift"
          LOCALIZER="$ROOT/Sources/ExtensionSupport/BroadcastContinuousMapLocalizer.swift"
          FULLMAP="$ROOT/Sources/ExtensionSupport/BroadcastFullMapVisibilityAnalyzer.swift"
          PROJECT="$ROOT/project.yml"
          SERVER='web/liteview-radar/server.py'

          grep -q 'BroadcastWebRadarBridge' "$HANDLER"
          grep -q 'BroadcastContinuousMapLocalizer' "$HANDLER"
          grep -q 'BroadcastFullMapVisibilityAnalyzer' "$HANDLER"
          grep -q 'auto-lan-discovery' "$BRIDGE"
          grep -q 'rawFrameUpload: false' "$BRIDGE"
          grep -q 'VNGenerateImageFeaturePrintRequest' "$LOCALIZER"
          grep -q 'matchedPOICount >= 2' "$LOCALIZER"
          grep -q 'richPOISet' "$FULLMAP"
          grep -q 'LITEVIEW_RADAR_V1' "$SERVER"
          grep -q 'CURRENT_PROJECT_VERSION: 38' "$PROJECT"
          grep -q 'MARKETING_VERSION: 0.9.21' "$PROJECT"
          echo 'BUILD38_WEB_RADAR_GUARD_PASS'

      - name: Web Radar smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile web/liteview-radar/server.py web/liteview-radar/demo_sender.py
          SMOKE_PORT=18765
          (cd web/liteview-radar && python3 server.py --host 127.0.0.1 --port "$SMOKE_PORT" > "$RUNNER_TEMP/web-radar.log" 2>&1 & echo $! > "$RUNNER_TEMP/web-radar.pid")
          python3 - <<'PY'
          import json,time,urllib.request
          base='http://127.0.0.1:18765'
          last=None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(base+'/health',timeout=.5) as r: health=json.load(r)
                  assert health['ok'] and health['discovery']['magic']=='LITEVIEW_RADAR_V1'
                  break
              except Exception as exc:
                  last=exc
                  time.sleep(.1)
          else:
              raise SystemExit(f'Web Radar relay failed to start: {last}')
          payload={'map':'AZ3','player':{'x':.42,'y':.61,'heading':133,'confidence':.88,'mode':'tracking'},'targets':[{'screenX':.28,'screenY':.55,'confidence':.79,'boxHeight':.11,'stableFrames':3}],'sounds':[{'kind':'footstep','lateral':-.4,'bearing':-36,'proximity':.62,'verticalCue':1,'confidence':.73,'source':'hud'}]}
          req=urllib.request.Request(base+'/api/state',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=1) as r: assert json.load(r)['ok']
          with urllib.request.urlopen(base+'/api/state',timeout=1) as r: state=json.load(r)
          assert state['map']=='AZ3' and abs(state['player']['x']-.42)<1e-9 and len(state['targets'])==1
          print('BUILD38_WEB_RADAR_SMOKE_PASS')
          PY
          kill "$(cat "$RUNNER_TEMP/web-radar.pid")" >/dev/null 2>&1 || true

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Verify Build 38 target wiring
        shell: bash
        run: |
          set -euo pipefail
          PBX='ios/PhoenixRealtimeVisionAssist/PhoenixRealtimeVisionAssist.xcodeproj/project.pbxproj'
          grep -q 'MultiScalePersonAnalyzer.swift' "$PBX"
          grep -q 'BroadcastWebRadarBridge.swift' "$PBX"
          grep -q 'BroadcastContinuousMapLocalizer.swift' "$PBX"
          grep -q 'BroadcastFullMapVisibilityAnalyzer.swift' "$PBX"
          grep -q 'ContinuousMapPositionStateChannel.swift' "$PBX"
          grep -q 'MapScreenVisibilityStateChannel.swift' "$PBX"
          echo 'BUILD38_TARGET_WIRING_PASS'

      - name: Build unsigned iPhone Release app and Broadcast Extension
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/LiteViewBuild38DerivedData"
          rm -rf "$DERIVED"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Normalize Build 38 and verify final binaries
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewBuild38DerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          APP_PLIST="$APP/Info.plist"
          EXT_PLIST="$EXT/Info.plist"
          APP_BIN="$APP/PhoenixRealtimeVisionAssist"
          EXT_BIN="$EXT/PhoenixBroadcastExtension"
          test -d "$APP" && test -d "$EXT" && test -x "$APP_BIN" && test -x "$EXT_BIN"

          set_plist_string() {
            local plist="$1" key="$2" value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }
          set_plist_string "$APP_PLIST" CFBundleDisplayName LiteView
          set_plist_string "$APP_PLIST" CFBundleShortVersionString 0.9.21
          set_plist_string "$APP_PLIST" CFBundleVersion 38
          set_plist_string "$EXT_PLIST" CFBundleDisplayName 'LiteView Broadcast'
          set_plist_string "$EXT_PLIST" CFBundleShortVersionString 0.9.21
          set_plist_string "$EXT_PLIST" CFBundleVersion 38

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")" = '38'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXT_PLIST")" = '38'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT_PLIST")" = 'PhoenixBroadcastExtension.EnhancedBroadcastSampleHandler'
          test -n "$(find "$EXT" -type d -name 'yolo11n.mlmodelc' -prune -print -quit)"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$EXT_PLIST" | grep -q 'Web Radar'
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$EXT_PLIST" | grep -q 'true'
          otool -L "$EXT_BIN" | grep -q 'Network.framework'
          echo 'BUILD38_FINAL_BINARY_PASS'

      - name: Package unsigned IPA and Web Radar bundle
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewBuild38DerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          ROOT="$RUNNER_TEMP/LiteViewBuild38Package"
          IPA="$RUNNER_TEMP/LiteView-0.9.21-Build38-WebRadar-unsigned.ipa"
          WEBZIP="$RUNNER_TEMP/LiteView-WebRadar-0.9.21-Build38.zip"
          MANIFEST="$RUNNER_TEMP/LiteView-0.9.21-Build38-WebRadar.txt"
          rm -rf "$ROOT" "$IPA" "$WEBZIP" "$MANIFEST"
          mkdir -p "$ROOT/Payload"
          cp -R "$APP" "$ROOT/Payload/"
          (cd "$ROOT" && /usr/bin/zip -qry "$IPA" Payload)
          (cd web && /usr/bin/zip -qry "$WEBZIP" liteview-radar)
          test -s "$IPA" && test -s "$WEBZIP"
          IPA_SIZE="$(stat -f%z "$IPA")"
          IPA_SHA="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          WEB_SIZE="$(stat -f%z "$WEBZIP")"
          WEB_SHA="$(shasum -a 256 "$WEBZIP" | awk '{print $1}')"
          cat > "$MANIFEST" <<EOF
          LiteView 0.9.21 Build 38 Web Radar
          commit=${GITHUB_SHA}
          version=0.9.21
          build=38
          ipa_size_bytes=${IPA_SIZE}
          ipa_sha256=${IPA_SHA}
          web_zip_size_bytes=${WEB_SIZE}
          web_zip_sha256=${WEB_SHA}
          transport=Broadcast Extension compact JSON -> LAN HTTP POST -> SSE browser
          discovery=automatic UDP LITEVIEW_RADAR_V1 beacon on port 8766
          az3_reference=screen-visible full-map feature-print grid, memory only
          continuous_position=published only after confidence-gated minimap/reference match
          raw_video_upload=false
          hidden_game_state=none
          memory_access=none
          signing=unsigned; preserve PlugIns/PhoenixBroadcastExtension.appex when re-signing
          EOF
          cat "$MANIFEST"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-web-radar-0.9.21-build38
          path: |
            ${{ runner.temp }}/LiteView-0.9.21-Build38-WebRadar-unsigned.ipa
            ${{ runner.temp }}/LiteView-WebRadar-0.9.21-Build38.zip
            ${{ runner.temp }}/LiteView-0.9.21-Build38-WebRadar.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='liteview-audio-clean-overlay-latest'
          IPA="$RUNNER_TEMP/LiteView-0.9.21-Build38-WebRadar-unsigned.ipa"
          WEBZIP="$RUNNER_TEMP/LiteView-WebRadar-0.9.21-Build38.zip"
          MANIFEST="$RUNNER_TEMP/LiteView-0.9.21-Build38-WebRadar.txt"
          NOTES='Build 38 adds the first real Web Radar data path. The Broadcast Extension sends only LiteView screen-visible/person/HUD-sound/compass/map evidence as compact LAN JSON. The Python relay advertises itself on the LAN so the extension can auto-discover it, then browsers receive state over SSE. For AZ3 self-localization, opening the normal full-map screen can create an in-memory Vision feature-print reference grid; later minimap matches publish continuous normalized x/y only when distance and best-vs-second-best confidence gates pass. Ambiguous registration publishes no position rather than a fake coordinate. No raw frames are uploaded and no game process memory is read.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$WEBZIP" "$MANIFEST" --clobber
            gh release edit "$TAG" --title 'LiteView 0.9.21 Build 38 Web Radar' --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$IPA" "$WEBZIP" "$MANIFEST" --target "$GITHUB_SHA" --title 'LiteView 0.9.21 Build 38 Web Radar' --notes "$NOTES"
          fi
