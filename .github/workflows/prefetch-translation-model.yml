name: Prefetch translation model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefetch-marian-en-zh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install downloader
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=0.30"

      - name: Download compact English-Chinese translation model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import snapshot_download

          target = Path("cloud_models/opus-mt-en-zh")
          snapshot_download(
              repo_id="Helsinki-NLP/opus-mt-en-zh",
              local_dir=str(target),
              ignore_patterns=["*.h5", "*.msgpack", "*.ot"],
          )

          required = [
              "config.json",
              "pytorch_model.bin",
              "source.spm",
              "target.spm",
              "vocab.json",
          ]
          missing = [name for name in required if not (target / name).is_file()]
          if missing:
              raise SystemExit(f"missing required model files: {missing}")

          total = sum(p.stat().st_size for p in target.rglob("*") if p.is_file())
          print(f"MODEL_READY path={target} bytes={total}")
          PY

      - name: Save cloud model package
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-opus-mt-en-zh-offline
          path: cloud_models/opus-mt-en-zh
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
