name: LiteView iOS Build

on:
  push:
    branches:
      - feature/ios-realtime-vision-assist
    paths:
      - 'ios/PhoenixRealtimeVisionAssist/**'
      - '.github/workflows/ios-liteview-build.yml'
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate ReplayKit and future Mac prep
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          APP_ENT="$ROOT/Config/App.entitlements"
          EXT_ENT="$ROOT/Config/Broadcast.entitlements"
          EXT_PLIST="$ROOT/Sources/Broadcast/Info.plist"
          PREP="$ROOT/scripts/macos_prepare_xcode.sh"

          bash -n "$PREP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$APP_ENT")" = 'group.com.phoenix.realtimevisionassist'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$EXT_ENT")" = 'group.com.phoenix.realtimevisionassist'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT_PLIST")" = 'com.apple.broadcast-services-upload'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT_PLIST" | grep -Fq 'BroadcastSampleHandler'

      - name: Stage and compile Core ML release model
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MODEL_DIR="$ROOT/Resources/Models"
          PACKAGE="$MODEL_DIR/yolo11n.mlpackage"
          COMPILED="$MODEL_DIR/yolo11n.mlmodelc"
          ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          UNZIP_DIR="$RUNNER_TEMP/liteview-yolo11n-coreml"
          COMPILE_DIR="$RUNNER_TEMP/liteview-coreml-compiled"
          URL='https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'

          rm -rf "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          mkdir -p "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"

          curl -fL \
            --retry 8 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 20 \
            -o "$ZIP" \
            "$URL"

          unzip -q "$ZIP" -d "$UNZIP_DIR"
          SRC="$(find "$UNZIP_DIR" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$SRC"
          cp -R "$SRC" "$PACKAGE"

          test -f "$PACKAGE/Manifest.json"
          test -f "$PACKAGE/Data/com.apple.CoreML/model.mlmodel"

          xcrun coremlc compile "$PACKAGE" "$COMPILE_DIR"
          SRC_COMPILED="$(find "$COMPILE_DIR" -type d -name '*.mlmodelc' -print -quit)"
          test -n "$SRC_COMPILED"
          cp -R "$SRC_COMPILED" "$COMPILED"

          test -d "$COMPILED"
          find "$COMPILED" -maxdepth 2 -type f -print
          du -sh "$PACKAGE" "$COMPILED"

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: List schemes
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodebuild -project PhoenixRealtimeVisionAssist.xcodeproj -list

      - name: Run deterministic pipeline simulation tests
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: |
          set -o pipefail
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test | tee xcodebuild-tests.log

      - name: Build iOS Simulator
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/LiteViewDerivedData"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/LiteViewDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Verify compiled Core ML resource
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewDerivedData/Build/Products/Debug-iphonesimulator"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$PRODUCTS/PhoenixBroadcastExtension.appex"

          test -d "$APP"
          test -d "$EXT"

          APP_MODEL="$(find "$APP" -type d -name 'yolo11n.mlmodelc' -print -quit)"
          EXT_MODEL="$(find "$EXT" -type d -name 'yolo11n.mlmodelc' -print -quit)"

          test -n "$APP_MODEL"
          test -n "$EXT_MODEL"

          echo "APP_MODEL=$APP_MODEL"
          echo "EXT_MODEL=$EXT_MODEL"
          du -sh "$APP_MODEL" "$EXT_MODEL"

      - name: Build unsigned iPhone device target
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/LiteViewDeviceDerivedData"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LiteViewDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-device.log

      - name: Verify unsigned device bundle
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewDeviceDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"

          test -d "$APP"
          test -d "$EXT"
          test -d "$APP/yolo11n.mlmodelc"
          test -d "$EXT/yolo11n.mlmodelc"

          echo "DEVICE_APP=$APP"
          echo "DEVICE_EXT=$EXT"
          du -sh "$APP" "$EXT" "$APP/yolo11n.mlmodelc" "$EXT/yolo11n.mlmodelc"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: liteview-xcodebuild-logs
          path: |
            ios/PhoenixRealtimeVisionAssist/xcodebuild.log
            ios/PhoenixRealtimeVisionAssist/xcodebuild-tests.log
            ios/PhoenixRealtimeVisionAssist/xcodebuild-device.log
          if-no-files-found: ignore
