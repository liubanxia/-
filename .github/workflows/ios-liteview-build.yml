name: LiteView iOS Build

on:
  push:
    branches:
      - feature/ios-realtime-vision-assist
    paths:
      - 'ios/PhoenixRealtimeVisionAssist/**'
      - '.github/workflows/ios-liteview-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  device-package:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate ReplayKit and Mac prep
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          APP_ENT="$ROOT/Config/App.entitlements"
          EXT_ENT="$ROOT/Config/Broadcast.entitlements"
          EXT_PLIST="$ROOT/Sources/Broadcast/Info.plist"
          PREP="$ROOT/scripts/macos_prepare_xcode.sh"

          bash -n "$PREP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$APP_ENT")" = 'group.com.phoenix.realtimevisionassist'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$EXT_ENT")" = 'group.com.phoenix.realtimevisionassist'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT_PLIST")" = 'com.apple.broadcast-services-upload'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT_PLIST" | grep -Fq 'BroadcastSampleHandler'

      - name: Stage and compile Core ML release model
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MODEL_DIR="$ROOT/Resources/Models"
          PACKAGE="$MODEL_DIR/yolo11n.mlpackage"
          COMPILED="$MODEL_DIR/yolo11n.mlmodelc"
          ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          UNZIP_DIR="$RUNNER_TEMP/liteview-yolo11n-coreml"
          COMPILE_DIR="$RUNNER_TEMP/liteview-coreml-compiled"
          URL='https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'

          rm -rf "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          mkdir -p "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"

          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 -o "$ZIP" "$URL"
          unzip -q "$ZIP" -d "$UNZIP_DIR"

          SRC="$(find "$UNZIP_DIR" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$SRC"
          cp -R "$SRC" "$PACKAGE"
          test -f "$PACKAGE/Manifest.json"
          test -f "$PACKAGE/Data/com.apple.CoreML/model.mlmodel"

          xcrun coremlc compile "$PACKAGE" "$COMPILE_DIR"
          SRC_COMPILED="$(find "$COMPILE_DIR" -type d -name '*.mlmodelc' -print -quit)"
          test -n "$SRC_COMPILED"
          cp -R "$SRC_COMPILED" "$COMPILED"
          test -d "$COMPILED"
          du -sh "$PACKAGE" "$COMPILED"

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Build unsigned iPhone device target
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/LiteViewDeviceDerivedData"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LiteViewDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-device.log

      - name: Preserve ReplayKit metadata in unsigned extension bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          SOURCE_PLIST="$ROOT/Sources/Broadcast/Info.plist"
          PRODUCTS="$RUNNER_TEMP/LiteViewDeviceDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          BUILT_PLIST="$EXT/Info.plist"

          test -f "$SOURCE_PLIST"
          test -f "$BUILT_PLIST"

          EXT_POINT="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$SOURCE_PLIST")"
          EXT_CLASS="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$SOURCE_PLIST")"

          /usr/libexec/PlistBuddy -c 'Delete :NSExtension' "$BUILT_PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :NSExtension dict' "$BUILT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSExtension:NSExtensionPointIdentifier string $EXT_POINT" "$BUILT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSExtension:NSExtensionPrincipalClass string $EXT_CLASS" "$BUILT_PLIST"

          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$BUILT_PLIST")" = 'com.apple.broadcast-services-upload'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$BUILT_PLIST" | grep -Fq 'BroadcastSampleHandler'

      - name: Verify unsigned device bundle
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewDeviceDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"

          test -d "$APP"
          test -d "$EXT"
          test -d "$APP/yolo11n.mlmodelc"
          test -d "$EXT/yolo11n.mlmodelc"

          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          EXT_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT/Info.plist")"
          EXT_POINT="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")"
          EXT_CLASS="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT/Info.plist")"

          test "$APP_ID" = 'com.phoenix.realtimevisionassist'
          test "$EXT_ID" = 'com.phoenix.realtimevisionassist.broadcast'
          test "$EXT_POINT" = 'com.apple.broadcast-services-upload'
          echo "$EXT_CLASS" | grep -Fq 'BroadcastSampleHandler'

          echo "DEVICE_APP=$APP"
          echo "DEVICE_EXT=$EXT"
          du -sh "$APP" "$EXT" "$APP/yolo11n.mlmodelc" "$EXT/yolo11n.mlmodelc"

      - name: Package and verify unsigned sideload IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewDeviceDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          ROOT="$RUNNER_TEMP/LiteViewSideload"
          PAYLOAD="$ROOT/Payload"
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-sideload-manifest.txt"
          VERIFY="$RUNNER_TEMP/LiteViewSideloadVerify"

          rm -rf "$ROOT" "$IPA" "$MANIFEST" "$VERIFY"
          mkdir -p "$PAYLOAD" "$VERIFY"
          cp -R "$APP" "$PAYLOAD/"

          (
            cd "$ROOT"
            /usr/bin/zip -qry "$IPA" Payload
          )

          test -s "$IPA"
          /usr/bin/unzip -q "$IPA" -d "$VERIFY"

          VAPP="$VERIFY/Payload/PhoenixRealtimeVisionAssist.app"
          VEXT="$VAPP/PlugIns/PhoenixBroadcastExtension.appex"
          test -f "$VAPP/Info.plist"
          test -f "$VEXT/Info.plist"
          test -d "$VAPP/yolo11n.mlmodelc"
          test -d "$VEXT/yolo11n.mlmodelc"

          VAPP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$VAPP/Info.plist")"
          VEXT_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$VEXT/Info.plist")"
          VEXT_POINT="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$VEXT/Info.plist")"
          VEXT_CLASS="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$VEXT/Info.plist")"

          test "$VAPP_ID" = 'com.phoenix.realtimevisionassist'
          test "$VEXT_ID" = 'com.phoenix.realtimevisionassist.broadcast'
          test "$VEXT_POINT" = 'com.apple.broadcast-services-upload'
          echo "$VEXT_CLASS" | grep -Fq 'BroadcastSampleHandler'

          cat > "$MANIFEST" <<EOF
          LiteView unsigned sideload package
          commit=${GITHUB_SHA}
          app_bundle_id=${VAPP_ID}
          extension_bundle_id=${VEXT_ID}
          extension_point=${VEXT_POINT}
          extension_class=${VEXT_CLASS}
          app_group=group.com.phoenix.realtimevisionassist
          signing=unsigned; SideStore/Feather must re-sign the app and embedded Broadcast Extension
          EOF

          echo "IPA_APP=$VAPP_ID"
          echo "IPA_EXTENSION=$VEXT_ID"
          echo "IPA_EXTENSION_POINT=$VEXT_POINT"
          echo "IPA_EXTENSION_CLASS=$VEXT_CLASS"
          ls -lh "$IPA" "$MANIFEST"

      - name: Upload sideload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: liteview-unsigned-sideload
          path: |
            ${{ runner.temp }}/LiteView-unsigned-sideload.ipa
            ${{ runner.temp }}/LiteView-sideload-manifest.txt
          if-no-files-found: error

      - name: Publish public sideload release
        if: github.ref == 'refs/heads/feature/ios-realtime-vision-assist'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='liteview-sideload-latest'
          IPA="$RUNNER_TEMP/LiteView-unsigned-sideload.ipa"
          MANIFEST="$RUNNER_TEMP/LiteView-sideload-manifest.txt"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$MANIFEST" --clobber
          else
            gh release create "$TAG" "$IPA" "$MANIFEST" \
              --title 'LiteView unsigned sideload test package' \
              --notes 'Unsigned iPhone test package for local re-signing with SideStore/Feather. Includes the ReplayKit Broadcast Extension and Core ML resources.'
          fi

      - name: Upload device build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: liteview-xcodebuild-device-log
          path: ios/PhoenixRealtimeVisionAssist/xcodebuild-device.log
          if-no-files-found: ignore
