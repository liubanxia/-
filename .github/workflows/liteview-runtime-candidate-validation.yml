name: LiteView Runtime Candidate Validation

on:
  push:
    branches:
      - feature/ios-realtime-vision-runtime-candidate
    paths:
      - '.github/workflows/liteview-runtime-candidate-validation.yml'
      - 'ios/PhoenixRealtimeVisionAssist/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime-candidate:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage one YOLO11n 384 Core ML model
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          MODEL_DIR="$ROOT/Resources/BroadcastModels"
          ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          UNZIP_DIR="$RUNNER_TEMP/liteview-yolo11n-coreml"
          COMPILE_DIR="$RUNNER_TEMP/liteview-yolo11n-compiled"
          URL='https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'

          rm -rf "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          mkdir -p "$MODEL_DIR" "$UNZIP_DIR" "$COMPILE_DIR"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 -o "$ZIP" "$URL"
          unzip -q "$ZIP" -d "$UNZIP_DIR"
          SRC="$(find "$UNZIP_DIR" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$SRC"
          xcrun coremlc compile "$SRC" "$COMPILE_DIR"
          SRC_COMPILED="$(find "$COMPILE_DIR" -type d -name '*.mlmodelc' -print -quit)"
          test -n "$SRC_COMPILED"
          cp -R "$SRC_COMPILED" "$MODEL_DIR/yolo11n.mlmodelc"
          test -d "$MODEL_DIR/yolo11n.mlmodelc"

      - name: Guard allocation-stable runtime contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          PRE="$ROOT/Sources/ExtensionSupport/BroadcastFramePreprocessor.swift"
          DET="$ROOT/Sources/ExtensionSupport/BroadcastNanoPersonDetector.swift"
          ANA="$ROOT/Sources/Broadcast/LightweightBroadcastAnalyzer.swift"
          HANDLER="$ROOT/Sources/Broadcast/BroadcastSampleHandler.swift"
          TEL="$ROOT/Sources/Broadcast/TrueInferenceTelemetry.swift"
          OVERLAY="$ROOT/Sources/App/TrueInferenceTelemetryOverlay.m"
          PROJECT="$ROOT/project.yml"

          test -f "$PRE"
          test -f "$DET"
          test -f "$TEL"
          test -f "$OVERLAY"

          # High-resolution frames must go through reusable vImage preprocessing and direct Core ML.
          grep -q 'model.prediction(from: provider)' "$DET"
          grep -q 'private static let preferredName = "yolo11n"' "$DET"
          ! grep -q 'VNCoreMLRequest' "$DET"
          ! grep -q 'VNImageRequestHandler' "$DET"
          ! grep -q 'YOLOv3TinyInt8LUT' "$DET"
          test "$(grep -c 'model.prediction(from: provider)' "$DET")" = '1'

          # Production preprocessor must support the ReplayKit formats validated by the contract job.
          grep -q 'kCVPixelFormatType_32BGRA' "$PRE"
          grep -q 'kCVPixelFormatType_420YpCbCr8BiPlanarFullRange' "$PRE"
          grep -q 'kCVPixelFormatType_420YpCbCr8BiPlanarVideoRange' "$PRE"
          grep -q 'vImageScale_ARGB8888' "$PRE"
          grep -q 'vImageScale_Planar8' "$PRE"
          grep -q 'vImageScale_CbCr8' "$PRE"
          grep -q 'vImageConvert_420Yp8_CbCr8ToARGB8888' "$PRE"
          grep -q 'vImageRotate90_ARGB8888' "$PRE"
          grep -q 'vImageHorizontalReflect_ARGB8888' "$PRE"
          grep -q 'vImageVerticalReflect_ARGB8888' "$PRE"
          grep -q 'unsupportedPixelFormat' "$PRE"

          # Sparse cadence and one-ROI-per-frame contract remain unchanged.
          grep -q 'let coverage = 0.60' "$ANA"
          grep -q 'minimumConfidence: 0.09' "$ANA"
          grep -q 'minimumConfidence: 0.12' "$ANA"
          grep -q 'roiPhase = (roiPhase + 1) & 1' "$ANA"
          ! grep -q 'VNDetectHumanRectanglesRequest' "$ANA"
          ! grep -q 'runHumanRectangleFallback' "$ANA"
          ! grep -q 'preferBackgroundProcessing' "$ANA"

          # Vision tracker sequence state must be request-scoped. Reusing a VNSequenceRequestHandler
          # across tracker frames caused measurable long-session RSS growth in the pooled A/B gate.
          grep -q 'let handler = VNSequenceRequestHandler()' "$ANA"
          ! grep -q 'private var sequenceHandler' "$ANA"
          ! grep -q 'private let sequenceHandler' "$ANA"
          test "$(grep -c 'VNSequenceRequestHandler()' "$ANA")" = '1'

          # Entitlement-free detector diagnostics must expose the actual input/preprocess/ML/decode chain.
          grep -q 'frameDiagnosticsNotificationName = "com.phoenix.realtimevisionassist.broadcast.frame-diagnostics.v1"' "$TEL"
          grep -q 'preprocessAttempted' "$TEL"
          grep -q 'preprocessSucceeded' "$TEL"
          grep -q 'latestPixelFormatCode' "$TEL"
          grep -q 'latestOrientationCode' "$TEL"
          grep -q 'guard sample.preprocessAttempted else { return }' "$TEL"
          grep -q 'preprocessAttempted' "$DET"
          grep -q 'telemetryPixelFormat' "$DET"
          grep -q 'LiteViewFrameDiagnosticsNotificationName' "$OVERLAY"
          grep -q '候选真推理遥测' "$OVERLAY"
          grep -q 'NV12 420f' "$OVERLAY"
          grep -q 'NV12 420v' "$OVERLAY"
          ! grep -q '0.8.4 / Build 15' "$OVERLAY"

          # Resource release belongs to session teardown only, not every scan.
          RELEASE_COUNT="$(grep -c 'nanoDetector.releaseResources()' "$ANA")"
          test "$RELEASE_COUNT" = '1'

          python3 - <<'PY'
          from pathlib import Path
          ana = Path('ios/PhoenixRealtimeVisionAssist/Sources/Broadcast/LightweightBroadcastAnalyzer.swift').read_text()
          pre = Path('ios/PhoenixRealtimeVisionAssist/Sources/ExtensionSupport/BroadcastFramePreprocessor.swift').read_text()
          tel = Path('ios/PhoenixRealtimeVisionAssist/Sources/Broadcast/TrueInferenceTelemetry.swift').read_text()
          overlay = Path('ios/PhoenixRealtimeVisionAssist/Sources/App/TrueInferenceTelemetryOverlay.m').read_text()
          project = Path('ios/PhoenixRealtimeVisionAssist/project.yml').read_text()
          assert 'trackedObservation == nil ? 2.60 : 3.20' in ana
          assert 'CGRect(x: 0, y: 0, width: coverage, height: 1)' in ana
          assert 'CGRect(x: offset, y: 0, width: coverage, height: 1)' in ana
          assert 'CGRect(x: 0, y: offset, width: 1, height: coverage)' in ana
          assert 'CGRect(x: 0, y: 0, width: 1, height: coverage)' in ana
          assert 'let handler = VNSequenceRequestHandler()' in ana
          assert 'private var sequenceHandler' not in ana
          assert 'private let sequenceHandler' not in ana
          assert 'case .right:' in pre and 'case .left:' in pre
          assert 'case .leftMirrored:' in pre and 'case .rightMirrored:' in pre
          assert 'detectorSequence' in tel and 'latestPreprocessSucceeded' in tel
          assert '最近链：预处理' in overlay
          assert '- path: Sources/ExtensionSupport' in project
          print('ALLOCATION_STABLE_RUNTIME_CONTRACT_PASS')
          print('BOUNDED_VISION_TRACKER_HANDLER_PASS')
          print('FRAME_DIAGNOSTICS_CONTRACT_PASS')
          PY

          # The ReplayKit frame ownership bridge must stay narrow: no raw CVPixelBuffer capture in
          # the Dispatch closure and no full-frame copy added just to satisfy Sendable checking.
          grep -q 'private final class AnalysisFrame: @unchecked Sendable' "$HANDLER"
          grep -q 'let analysisFrame = AnalysisFrame(' "$HANDLER"
          ! grep -Fq '[weak self, pixelBuffer]' "$HANDLER"

          # Exactly one packaged model remains in the Broadcast Extension resource bank.
          test "$(find "$ROOT/Resources/BroadcastModels" -type d -name '*.mlmodelc' -prune -print | wc -l | tr -d ' ')" = '1'
          test -z "$(find "$ROOT/Resources/BroadcastModels" -type d -name 'YOLOv3TinyInt8LUT.mlmodelc' -prune -print -quit)"

      - name: Generate project
        working-directory: ios/PhoenixRealtimeVisionAssist
        run: xcodegen generate

      - name: Run lifecycle smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          xcrun swiftc \
            "$ROOT/Sources/Core/SharedRealtimeStateStore.swift" \
            "$ROOT/Sources/Core/BroadcastLifecycle.swift" \
            "$ROOT/Sources/Vision/PhoenixCapabilityModelBank.swift" \
            "$ROOT/scripts/lifecycle_smoke_main.swift" \
            -o "$RUNNER_TEMP/liteview-lifecycle-smoke"
          "$RUNNER_TEMP/liteview-lifecycle-smoke"

      - name: Build app and Broadcast Extension without packaging
        working-directory: ios/PhoenixRealtimeVisionAssist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/LiteViewRuntimeCandidateDerivedData"
          BUILD_LOG="$RUNNER_TEMP/runtime-candidate-xcodebuild.log"
          xcodebuild \
            -project PhoenixRealtimeVisionAssist.xcodeproj \
            -scheme PhoenixRealtimeVisionAssist \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LiteViewRuntimeCandidateDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$BUILD_LOG"

      - name: Guard ReplayKit concurrency diagnostics
        shell: bash
        run: |
          set -euo pipefail
          BUILD_LOG="$RUNNER_TEMP/runtime-candidate-xcodebuild.log"
          test -s "$BUILD_LOG"
          if grep -Fq "capture of 'pixelBuffer' with non-sendable type 'CVImageBuffer'" "$BUILD_LOG"; then
            echo 'Raw CVPixelBuffer Sendable warning returned.' >&2
            exit 1
          fi
          if grep -Fq "capture of 'pixelBuffer' with non-sendable type 'CVBuffer'" "$BUILD_LOG"; then
            echo 'Raw CVPixelBuffer Sendable warning returned.' >&2
            exit 1
          fi
          echo 'REPLAYKIT_CONCURRENCY_DIAGNOSTIC_PASS'

      - name: Verify built extension model count and size
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/LiteViewRuntimeCandidateDerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/PhoenixRealtimeVisionAssist.app"
          EXT="$APP/PlugIns/PhoenixBroadcastExtension.appex"
          test -d "$APP"
          test -d "$EXT"
          MODEL_COUNT="$(find "$EXT" -type d -name '*.mlmodelc' -prune -print | wc -l | tr -d ' ')"
          echo "MODEL_COUNT=$MODEL_COUNT"
          test "$MODEL_COUNT" = '1'
          test -n "$(find "$EXT" -type d -name 'yolo11n.mlmodelc' -prune -print -quit)"
          EXT_SIZE_BYTES="$(du -sk "$EXT" | awk '{print $1 * 1024}')"
          echo "EXT_SIZE_BYTES=$EXT_SIZE_BYTES"
          test "$EXT_SIZE_BYTES" -lt 33554432

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## LiteView runtime candidate'
            echo
            echo '- One resident YOLO11n-384 Core ML model.'
            echo '- High-resolution model preprocessing uses reusable vImage buffers followed by direct MLModel.prediction.'
            echo '- Production preprocessor supports BGRA, NV12 420f and NV12 420v; the separate contract job validates all eight EXIF orientations.'
            echo '- Tracker-loss reacquisition runs one 60% ROI per eligible frame and alternates phases.'
            echo '- VNTrackObjectRequest uses a request-scoped VNSequenceRequestHandler; long-lived Vision sequence handlers are forbidden.'
            echo '- No high-resolution VNCoreMLRequest or generic human-detector fallback is allowed in the candidate detector path.'
            echo '- Entitlement-free frame diagnostics expose ReplayKit pixel format/orientation and preprocessing/Core ML/decode stage without persisting frames.'
            echo '- ReplayKit analysis keeps the narrow retained-frame ownership bridge; no full-frame copy is introduced.'
            echo '- No IPA or GitHub release is created by this workflow.'
            echo '- Build/host validation does not establish on-device recognition quality or the iPhone ReplayKit jetsam ceiling.'
          } >> "$GITHUB_STEP_SUMMARY"
