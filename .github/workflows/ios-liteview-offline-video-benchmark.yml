name: LiteView Offline Far-Human Validation

on:
  push:
    branches:
      - feature/ios-realtime-vision-assist
    paths:
      - 'ios/PhoenixRealtimeVisionAssist/Tests/OfflineVisualBenchmark/**'
      - '.github/workflows/ios-liteview-offline-video-benchmark.yml'
  workflow_dispatch:

jobs:
  far-human-validation:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install video and detector tools
        shell: bash
        run: |
          set -euo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python -m pip install --upgrade pip
          python -m pip install yt-dlp ultralytics opencv-python-headless

      - name: Download negative-memory and two blind validation excerpts
        id: video
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/liteview-far-v5"
          mkdir -p "$WORK/train" "$WORK/validation_a" "$WORK/validation_b"

          TRAIN_URL='https://www.dailymotion.com/video/x9j3ct8'
          VALIDATION_A_URL='https://www.dailymotion.com/video/xa3wu7y'
          VALIDATION_B_URL='https://www.dailymotion.com/video/xa3wui6'

          download_excerpt() {
            local url="$1"
            local outdir="$2"
            local section="$3"
            rm -f "$outdir"/source.*
            python -m yt_dlp \
              --no-playlist \
              --download-sections "$section" \
              --force-keyframes-at-cuts \
              -f 'bv*[height<=1080]+ba/b[height<=1080]/best[height<=1080]/best' \
              --merge-output-format mp4 \
              -o "$outdir/source.%(ext)s" \
              "$url"
          }

          download_excerpt "$TRAIN_URL" "$WORK/train" '*00:00:32-00:01:02'
          download_excerpt "$VALIDATION_A_URL" "$WORK/validation_a" '*00:02:18-00:02:48'
          download_excerpt "$VALIDATION_B_URL" "$WORK/validation_b" '*00:00:20-00:00:50'

          TRAIN_VIDEO="$(find "$WORK/train" -maxdepth 1 -type f -name 'source.*' -print -quit)"
          VALIDATION_A_VIDEO="$(find "$WORK/validation_a" -maxdepth 1 -type f -name 'source.*' -print -quit)"
          VALIDATION_B_VIDEO="$(find "$WORK/validation_b" -maxdepth 1 -type f -name 'source.*' -print -quit)"
          test -n "$TRAIN_VIDEO"
          test -n "$VALIDATION_A_VIDEO"
          test -n "$VALIDATION_B_VIDEO"

          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json "$TRAIN_VIDEO" > "$WORK/train_probe.json"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json "$VALIDATION_A_VIDEO" > "$WORK/validation_a_probe.json"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json "$VALIDATION_B_VIDEO" > "$WORK/validation_b_probe.json"

          echo 'TRAIN_PROBE'; cat "$WORK/train_probe.json"
          echo 'VALIDATION_A_PROBE'; cat "$WORK/validation_a_probe.json"
          echo 'VALIDATION_B_PROBE'; cat "$WORK/validation_b_probe.json"

          echo "work=$WORK" >> "$GITHUB_OUTPUT"
          echo "train_video=$TRAIN_VIDEO" >> "$GITHUB_OUTPUT"
          echo "validation_a_video=$VALIDATION_A_VIDEO" >> "$GITHUB_OUTPUT"
          echo "validation_b_video=$VALIDATION_B_VIDEO" >> "$GITHUB_OUTPUT"
          echo "train_url=$TRAIN_URL" >> "$GITHUB_OUTPUT"
          echo "validation_a_url=$VALIDATION_A_URL" >> "$GITHUB_OUTPUT"
          echo "validation_b_url=$VALIDATION_B_URL" >> "$GITHUB_OUTPUT"

      - name: Extract source-resolution frame sequences
        shell: bash
        env:
          WORK: ${{ steps.video.outputs.work }}
          TRAIN_VIDEO: ${{ steps.video.outputs.train_video }}
          VALIDATION_A_VIDEO: ${{ steps.video.outputs.validation_a_video }}
          VALIDATION_B_VIDEO: ${{ steps.video.outputs.validation_b_video }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/train_frames" "$WORK/validation_a_frames" "$WORK/validation_b_frames"
          ffmpeg -hide_banner -loglevel error -i "$TRAIN_VIDEO" -vf 'fps=2' -q:v 2 "$WORK/train_frames/frame_%03d.jpg"
          ffmpeg -hide_banner -loglevel error -i "$VALIDATION_A_VIDEO" -vf 'fps=2' -q:v 2 "$WORK/validation_a_frames/frame_%03d.jpg"
          ffmpeg -hide_banner -loglevel error -i "$VALIDATION_B_VIDEO" -vf 'fps=2' -q:v 2 "$WORK/validation_b_frames/frame_%03d.jpg"
          TRAIN_COUNT="$(find "$WORK/train_frames" -name 'frame_*.jpg' | wc -l | tr -d ' ')"
          A_COUNT="$(find "$WORK/validation_a_frames" -name 'frame_*.jpg' | wc -l | tr -d ' ')"
          B_COUNT="$(find "$WORK/validation_b_frames" -name 'frame_*.jpg' | wc -l | tr -d ' ')"
          echo "TRAIN_FRAME_COUNT=$TRAIN_COUNT"
          echo "VALIDATION_A_FRAME_COUNT=$A_COUNT"
          echo "VALIDATION_B_FRAME_COUNT=$B_COUNT"
          test "$TRAIN_COUNT" -ge 40
          test "$A_COUNT" -ge 40
          test "$B_COUNT" -ge 40

      - name: Run far-human pyramid and blind validation
        shell: bash
        env:
          WORK: ${{ steps.video.outputs.work }}
          TRAIN_URL: ${{ steps.video.outputs.train_url }}
          VALIDATION_A_URL: ${{ steps.video.outputs.validation_a_url }}
          VALIDATION_B_URL: ${{ steps.video.outputs.validation_b_url }}
        run: |
          set -euo pipefail
          python ios/PhoenixRealtimeVisionAssist/Tests/OfflineVisualBenchmark/run_far_human_benchmark.py \
            --train-frames "$WORK/train_frames" \
            --validation-a-frames "$WORK/validation_a_frames" \
            --validation-b-frames "$WORK/validation_b_frames" \
            --output "$WORK/results" \
            --train-source-url "$TRAIN_URL" \
            --validation-a-source-url "$VALIDATION_A_URL" \
            --validation-b-source-url "$VALIDATION_B_URL" \
            --memory-model yolo11n.pt \
            --memory-seg-model yolo11n-seg.pt \
            --memory-pose-model yolo11n-pose.pt \
            --model yolo11s.pt \
            --seg-model yolo11s-seg.pt \
            --pose-model yolo11s-pose.pt \
            --confidence 0.08 \
            --seg-confidence 0.08 \
            --pose-confidence 0.08 \
            --min-track-hits 3
          cat "$WORK/results/summary_far_v5.md" >> "$GITHUB_STEP_SUMMARY"
          echo '--- far_benchmark_v5.json ---'
          cat "$WORK/results/far_benchmark_v5.json"

      - name: Upload far-human numeric report and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: liteview-offline-far-human-v5
          path: |
            ${{ steps.video.outputs.work }}/train_probe.json
            ${{ steps.video.outputs.work }}/validation_a_probe.json
            ${{ steps.video.outputs.work }}/validation_b_probe.json
            ${{ steps.video.outputs.work }}/results/far_benchmark_v5.json
            ${{ steps.video.outputs.work }}/results/far_validation_v5.csv
            ${{ steps.video.outputs.work }}/results/summary_far_v5.md
            ${{ steps.video.outputs.work }}/results/hard_negative_memory_bank_v5.jpg
            ${{ steps.video.outputs.work }}/results/validation_A_contact_sheet_v5.jpg
            ${{ steps.video.outputs.work }}/results/validation_B_contact_sheet_v5.jpg
            ${{ steps.video.outputs.work }}/results/far_candidate_gallery_v5.jpg
            ${{ steps.video.outputs.work }}/results/fps_hard_negative_memory_v5.npz
          retention-days: 7
          if-no-files-found: error
