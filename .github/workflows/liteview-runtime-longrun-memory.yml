name: LiteView Runtime Long-Run Memory

on:
  push:
    branches:
      - feature/ios-realtime-vision-runtime-candidate
    paths:
      - '.github/workflows/liteview-runtime-longrun-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-run-memory:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage one YOLO11n 384 Core ML model
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          UNZIP_DIR="$RUNNER_TEMP/liteview-yolo11n-coreml"
          COMPILE_DIR="$RUNNER_TEMP/liteview-yolo11n-compiled"
          URL='https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'

          rm -rf "$UNZIP_DIR" "$COMPILE_DIR"
          mkdir -p "$UNZIP_DIR" "$COMPILE_DIR" build/longrun
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 -o "$ZIP" "$URL"
          unzip -q "$ZIP" -d "$UNZIP_DIR"
          SRC="$(find "$UNZIP_DIR" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$SRC"
          xcrun coremlc compile "$SRC" "$COMPILE_DIR"
          MODEL="$(find "$COMPILE_DIR" -type d -name 'yolo11n.mlmodelc' -print -quit)"
          test -n "$MODEL"
          echo "$MODEL" > build/longrun/model_path.txt

      - name: Build resident-model stress probe
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/liteview_longrun_probe.swift" <<'SWIFT'
          import CoreFoundation
          import CoreML
          import CoreVideo
          import Foundation
          import ImageIO
          import Vision

          guard CommandLine.arguments.count == 3 else {
              fatalError("usage: probe <model.mlmodelc> <iterations>")
          }
          let modelURL = URL(fileURLWithPath: CommandLine.arguments[1])
          guard let iterations = Int(CommandLine.arguments[2]), iterations >= 100 else {
              fatalError("iterations must be >= 100")
          }

          var source: CVPixelBuffer?
          let attrs: [CFString: Any] = [
              kCVPixelBufferCGImageCompatibilityKey: true,
              kCVPixelBufferCGBitmapContextCompatibilityKey: true,
              kCVPixelBufferIOSurfacePropertiesKey: [:] as CFDictionary,
          ]
          let status = CVPixelBufferCreate(
              kCFAllocatorDefault,
              1920,
              1080,
              kCVPixelFormatType_32BGRA,
              attrs as CFDictionary,
              &source
          )
          guard status == kCVReturnSuccess, let pixelBuffer = source else {
              fatalError("pixel buffer create failed")
          }
          CVPixelBufferLockBaseAddress(pixelBuffer, [])
          if let base = CVPixelBufferGetBaseAddress(pixelBuffer) {
              memset(base, 31, CVPixelBufferGetDataSize(pixelBuffer))
          }
          CVPixelBufferUnlockBaseAddress(pixelBuffer, [])

          let configuration = MLModelConfiguration()
          configuration.computeUnits = .cpuAndNeuralEngine
          let mlModel = try MLModel(contentsOf: modelURL, configuration: configuration)
          let visionModel = try VNCoreMLModel(for: mlModel)

          let full = CGRect(x: 0, y: 0, width: 1, height: 1)
          let left = CGRect(x: 0, y: 0, width: 0.68, height: 1)
          let right = CGRect(x: 0.32, y: 0, width: 0.68, height: 1)

          func perform(_ roi: CGRect, background: Bool) throws -> [Int] {
              let request = VNCoreMLRequest(model: visionModel)
              request.imageCropAndScaleOption = .scaleFit
              request.regionOfInterest = roi
              request.preferBackgroundProcessing = background
              let handler = VNImageRequestHandler(
                  cvPixelBuffer: pixelBuffer,
                  orientation: .up,
                  options: [:]
              )
              try handler.perform([request])
              return (request.results ?? [])
                  .compactMap { $0 as? VNCoreMLFeatureValueObservation }
                  .compactMap { $0.featureValue.multiArrayValue }
                  .first?.shape.map(\.intValue) ?? []
          }

          // Warm all three preprocessing shapes before the measured stress phase.
          for i in 0..<36 {
              try autoreleasepool {
                  let roi = i % 6 == 0 ? full : (i % 2 == 0 ? left : right)
                  let shape = try perform(roi, background: roi == full)
                  guard shape.count == 3, shape.contains(84) else {
                      fatalError("unexpected warmup output shape \(shape)")
                  }
              }
          }
          print("LONGRUN_READY")
          fflush(stdout)

          var fullCount = 0
          var roiCount = 0
          let started = CFAbsoluteTimeGetCurrent()
          for i in 0..<iterations {
              try autoreleasepool {
                  let isFull = i % 12 == 0
                  let roi = isFull ? full : (i % 2 == 0 ? left : right)
                  let shape = try perform(roi, background: isFull)
                  guard shape.count == 3, shape.contains(84) else {
                      fatalError("unexpected output shape at \(i): \(shape)")
                  }
                  if isFull { fullCount += 1 } else { roiCount += 1 }
              }
              if i % 100 == 0 {
                  print("LONGRUN_PROGRESS iteration=\(i)")
                  fflush(stdout)
              }
          }
          let elapsed = CFAbsoluteTimeGetCurrent() - started
          print(String(
              format: "LONGRUN_DONE iterations=%d full=%d roi=%d elapsed_sec=%.3f",
              iterations, fullCount, roiCount, elapsed
          ))
          SWIFT
          xcrun swiftc "$RUNNER_TEMP/liteview_longrun_probe.swift" -o "$RUNNER_TEMP/liteview_longrun_probe"

      - name: Run 1200-request memory plateau stress
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$(cat build/longrun/model_path.txt)"
          OUT='build/longrun/probe.stdout'
          ERR='build/longrun/probe.stderr'
          RSS='build/longrun/rss_kib.txt'
          : > "$RSS"

          "$RUNNER_TEMP/liteview_longrun_probe" "$MODEL" 1200 >"$OUT" 2>"$ERR" &
          PID=$!
          SAMPLE=0
          while kill -0 "$PID" 2>/dev/null; do
            VALUE="$(ps -o rss= -p "$PID" 2>/dev/null | awk '{print $1}' || true)"
            if [ -n "$VALUE" ]; then
              printf '%d %s\n' "$SAMPLE" "$VALUE" >> "$RSS"
              SAMPLE=$((SAMPLE + 1))
            fi
            sleep 0.15
          done
          wait "$PID"
          cat "$OUT"
          cat "$ERR"
          echo "RSS_SAMPLES=$(wc -l < "$RSS" | tr -d ' ')"

      - name: Guard late-run memory plateau
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import statistics

          samples = []
          for line in Path('build/longrun/rss_kib.txt').read_text().splitlines():
              parts = line.split()
              if len(parts) == 2:
                  samples.append(int(parts[1]) / 1024.0)
          assert len(samples) >= 150, len(samples)

          n = len(samples)
          q3 = samples[n // 2:(3 * n) // 4]
          q4 = samples[(3 * n) // 4:]
          late = samples[n // 2:]
          assert q3 and q4 and len(late) >= 40

          q3_med = statistics.median(q3)
          q4_med = statistics.median(q4)
          q4_sorted = sorted(q4)
          q4_p95 = q4_sorted[min(len(q4_sorted)-1, int((len(q4_sorted)-1)*0.95))]
          plateau_growth = q4_med - q3_med
          peak = max(samples)

          xs = list(range(len(late)))
          xbar = statistics.mean(xs)
          ybar = statistics.mean(late)
          denom = sum((x - xbar) ** 2 for x in xs)
          slope = sum((x - xbar) * (y - ybar) for x, y in zip(xs, late)) / denom if denom else 0.0

          report = {
              'samples': n,
              'third_quarter_median_mib': round(q3_med, 2),
              'last_quarter_median_mib': round(q4_med, 2),
              'last_quarter_p95_mib': round(q4_p95, 2),
              'peak_mib': round(peak, 2),
              'late_plateau_growth_mib': round(plateau_growth, 2),
              'late_half_slope_mib_per_sample': round(slope, 5),
          }
          Path('build/longrun/memory_report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))

          # By the second half, Core ML/Vision caches should have settled. A true allocation leak
          # would keep raising both the late-quarter median and the late-half regression slope.
          assert plateau_growth <= 4.0, report
          assert q4_p95 <= q3_med + 8.0, report
          assert slope <= 0.02, report
          print('LONGRUN_MEMORY_PLATEAU_PASS')
          PY

      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo '## LiteView long-run resident-model plateau stress'
            echo
            echo 'One resident YOLO11n-384 Vision model receives 1200 serial requests after a 36-request warmup. Every 12th request is full-frame/background-preferred; all other requests alternate the two 68% ROIs.'
            echo
            if [ -f build/longrun/memory_report.json ]; then
              echo '```json'
              cat build/longrun/memory_report.json
              echo '```'
            fi
            echo
            echo 'This is a macOS comparative memory-trend test. It does not establish the iPhone ReplayKit jetsam ceiling.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload long-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liteview-runtime-longrun-memory
          path: build/longrun/
          retention-days: 7
          if-no-files-found: warn
