name: LiteView ROI Coordinate Contract

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-realtime-vision-assist
    paths:
      - '.github/workflows/liteview-roi-coordinate-contract.yml'

permissions:
  contents: read

jobs:
  roi-coordinate-contract:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy<=2.3.5' 'coremltools>=9.0' 'ultralytics[export-coreml]' opencv-python-headless

      - name: Download model and COCO128
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/model build/data build/case build/report
          curl -fL --retry 8 --retry-delay 2 \
            'https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11n.pt' \
            -o build/model/yolo11n.pt
          curl -fL --retry 8 --retry-delay 2 \
            'https://github.com/ultralytics/assets/releases/download/v0.0.0/coco128.zip' \
            -o build/data/coco128.zip
          unzip -q build/data/coco128.zip -d build/data
          test -d build/data/coco128/images
          test -d build/data/coco128/labels

      - name: Export YOLO11n 384 Core ML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/export build/compiled
          cp build/model/yolo11n.pt build/export/yolo11n.pt
          (
            cd build/export
            python - <<'PY'
          from pathlib import Path
          import coremltools as ct
          from ultralytics import YOLO
          pkg = Path(YOLO('yolo11n.pt').export(format='coreml', imgsz=384, nms=False))
          spec = ct.utils.load_spec(str(pkg))
          images = [x.type.imageType for x in spec.description.input if x.type.WhichOneof('Type') == 'imageType']
          assert len(images) == 1
          assert int(images[0].width) == 384 and int(images[0].height) == 384
          print('EXPORT_PASS')
          PY
          )
          xcrun coremlc compile build/export/yolo11n.mlpackage build/compiled
          test -d build/compiled/yolo11n.mlmodelc

      - name: Select deterministic annotated ROI case
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import cv2
          from ultralytics import YOLO

          root = Path('build/data/coco128')
          image_root = root / 'images' / 'train2017'
          label_root = root / 'labels' / 'train2017'
          model = YOLO('build/model/yolo11n.pt')

          def iou(a, b):
              ax1, ay1, ax2, ay2 = a; bx1, by1, bx2, by2 = b
              ix1, iy1 = max(ax1,bx1), max(ay1,by1)
              ix2, iy2 = min(ax2,bx2), min(ay2,by2)
              iw, ih = max(0,ix2-ix1), max(0,iy2-iy1)
              inter = iw*ih
              if inter <= 0: return 0.0
              aa=(ax2-ax1)*(ay2-ay1); ba=(bx2-bx1)*(by2-by1)
              return inter/max(aa+ba-inter,1e-9)

          def rois(w,h):
              coverage=0.68
              if w >= h:
                  rw=round(w*coverage)
                  return [(0,0,rw,h),(w-rw,0,w,h)]
              rh=round(h*coverage)
              return [(0,0,w,rh),(0,h-rh,w,h)]

          selected=None
          for lp in sorted(label_root.glob('*.txt')):
              ip=image_root/(lp.stem+'.jpg')
              if not ip.exists(): continue
              img=cv2.imread(str(ip))
              if img is None: continue
              h,w=img.shape[:2]
              gts=[]
              for line in lp.read_text().splitlines():
                  p=line.split()
                  if len(p)<5 or int(float(p[0])) != 0: continue
                  cx,cy,bw,bh=map(float,p[1:5])
                  gts.append(((cx-bw/2)*w,(cy-bh/2)*h,(cx+bw/2)*w,(cy+bh/2)*h))
              if not gts: continue
              for roi_index,roi in enumerate(rois(w,h)):
                  x1,y1,x2,y2=roi
                  crop=img[y1:y2,x1:x2]
                  result=model.predict(crop,imgsz=384,conf=0.09,iou=0.50,classes=[0],device='cpu',verbose=False,max_det=50)[0]
                  if result.boxes is None: continue
                  preds=[]
                  for box,score in zip(result.boxes.xyxy.cpu().numpy(),result.boxes.conf.cpu().numpy()):
                      local=tuple(float(v) for v in box)
                      mapped=(local[0]+x1,local[1]+y1,local[2]+x1,local[3]+y1)
                      preds.append((mapped,local,float(score)))
                  for gt in gts:
                      for mapped,local,score in preds:
                          good=iou(mapped,gt)
                          # Deliberately wrong control: treat crop-local pixels as if they belonged to the full image.
                          bad=iou(local,gt)
                          if good >= 0.55 and good-bad >= 0.25:
                              rx=x1/w; rw=(x2-x1)/w
                              ry=1-y2/h; rh=(y2-y1)/h
                              gx1,gy1,gx2,gy2=gt
                              selected={
                                  'image': str(ip.resolve()),
                                  'image_width': w,
                                  'image_height': h,
                                  'roi_index': roi_index,
                                  'roi_vision': [rx,ry,rw,rh],
                                  'gt_vision': [gx1/w,1-gy2/h,(gx2-gx1)/w,(gy2-gy1)/h],
                                  'python_mapped_iou': good,
                                  'python_naive_iou': bad,
                                  'python_score': score,
                              }
                              break
                      if selected: break
                  if selected: break
              if selected: break

          if not selected:
              raise SystemExit('no suitable deterministic ROI coordinate case found')
          Path('build/case/case.json').write_text(json.dumps(selected,indent=2),encoding='utf-8')
          print(json.dumps(selected,indent=2))
          PY

      - name: Build Swift Core ML ROI coordinate probe
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/roi_coordinate_probe.swift" <<'SWIFT'
          import CoreGraphics
          import CoreML
          import Foundation
          import ImageIO
          import Vision

          struct Case: Decodable {
              let image: String
              let image_width: Int
              let image_height: Int
              let roi_vision: [Double]
              let gt_vision: [Double]
          }
          struct Candidate {
              let box: CGRect
              let score: Double
          }

          guard CommandLine.arguments.count == 4 else {
              fatalError("usage: probe <model.mlmodelc> <case.json> <report.json>")
          }
          let modelURL = URL(fileURLWithPath: CommandLine.arguments[1])
          let caseURL = URL(fileURLWithPath: CommandLine.arguments[2])
          let reportURL = URL(fileURLWithPath: CommandLine.arguments[3])
          let test = try JSONDecoder().decode(Case.self, from: Data(contentsOf: caseURL))
          let imageURL = URL(fileURLWithPath: test.image)
          let roi = CGRect(x: test.roi_vision[0], y: test.roi_vision[1], width: test.roi_vision[2], height: test.roi_vision[3])
          let gt = CGRect(x: test.gt_vision[0], y: test.gt_vision[1], width: test.gt_vision[2], height: test.gt_vision[3])

          let config = MLModelConfiguration()
          config.computeUnits = .cpuAndNeuralEngine
          let mlModel = try MLModel(contentsOf: modelURL, configuration: config)
          let visionModel = try VNCoreMLModel(for: mlModel)
          let request = VNCoreMLRequest(model: visionModel)
          request.imageCropAndScaleOption = .scaleFit
          request.regionOfInterest = roi
          let handler = VNImageRequestHandler(url: imageURL, orientation: .up, options: [:])
          try handler.perform([request])

          guard let observation = (request.results ?? []).compactMap({ $0 as? VNCoreMLFeatureValueObservation }).first,
                let array = observation.featureValue.multiArrayValue else {
              fatalError("missing raw Core ML output")
          }
          let shape = array.shape.map(\.intValue)
          guard shape.count == 3 else { fatalError("unexpected shape \(shape)") }
          let channelsFirst = shape[1] >= 5 && shape[1] < shape[2]
          let count = channelsFirst ? shape[2] : shape[1]
          let features = channelsFirst ? shape[1] : shape[2]
          guard features >= 5 else { fatalError("unexpected feature count") }

          func value(_ feature: Int, _ index: Int) -> Double {
              let idx: [NSNumber] = channelsFirst
                ? [0, NSNumber(value: feature), NSNumber(value: index)]
                : [0, NSNumber(value: index), NSNumber(value: feature)]
              return array[idx].doubleValue
          }
          func iou(_ a: CGRect, _ b: CGRect) -> Double {
              let inter = a.intersection(b)
              guard !inter.isNull, inter.width > 0, inter.height > 0 else { return 0 }
              let ia = inter.width * inter.height
              let ua = a.width*a.height + b.width*b.height - ia
              return ua > 0 ? ia/ua : 0
          }
          func localVisionBox(rawX: Double, rawY: Double, rawW: Double, rawH: Double) -> CGRect? {
              // Ultralytics raw xywh is in 384x384 model pixels with a top-left y convention.
              var x = rawX / 384.0
              var y = rawY / 384.0
              var w = rawW / 384.0
              var h = rawH / 384.0

              // Vision .scaleFit letterboxes the ROI crop into the square model input.
              let roiPixelW = Double(test.image_width) * Double(roi.width)
              let roiPixelH = Double(test.image_height) * Double(roi.height)
              guard roiPixelW > 0, roiPixelH > 0 else { return nil }
              if roiPixelW >= roiPixelH {
                  let fittedH = roiPixelH / roiPixelW
                  let padY = (1.0 - fittedH) / 2.0
                  y = (y - padY) / fittedH
                  h /= fittedH
              } else {
                  let fittedW = roiPixelW / roiPixelH
                  let padX = (1.0 - fittedW) / 2.0
                  x = (x - padX) / fittedW
                  w /= fittedW
              }
              let minX = max(0, x-w/2), maxX = min(1, x+w/2)
              let minYTop = max(0, y-h/2), maxYTop = min(1, y+h/2)
              guard maxX > minX, maxYTop > minYTop else { return nil }
              return CGRect(
                  x: minX,
                  y: 1.0-maxYTop,
                  width: maxX-minX,
                  height: maxYTop-minYTop
              )
          }

          var localCandidates: [Candidate] = []
          for i in 0..<count {
              let score = value(4, i) // class 0 = person for COCO YOLO11 raw head
              guard score >= 0.09 else { continue }
              let rx=value(0,i), ry=value(1,i), rw=value(2,i), rh=value(3,i)
              guard [rx,ry,rw,rh,score].allSatisfy({ $0.isFinite }) else { continue }
              if let box = localVisionBox(rawX: rx, rawY: ry, rawW: rw, rawH: rh) {
                  localCandidates.append(Candidate(box: box, score: score))
              }
          }

          // NMS in ROI-local Vision coordinates.
          var remaining = localCandidates.sorted { $0.score > $1.score }
          var kept: [Candidate] = []
          while let best = remaining.first, kept.count < 20 {
              kept.append(best)
              remaining.removeFirst()
              remaining.removeAll { iou(best.box, $0.box) >= 0.50 }
          }
          guard !kept.isEmpty else { fatalError("no ROI person detections") }

          func manualFull(_ local: CGRect) -> CGRect {
              CGRect(
                  x: roi.minX + local.minX * roi.width,
                  y: roi.minY + local.minY * roi.height,
                  width: local.width * roi.width,
                  height: local.height * roi.height
              )
          }
          func appleFull(_ local: CGRect) -> CGRect {
              let pixels = VNImageRectForNormalizedRectUsingRegionOfInterest(local, test.image_width, test.image_height, roi)
              return VNNormalizedRectForImageRect(pixels, test.image_width, test.image_height)
          }

          var bestCorrectIoU = 0.0
          var bestNaiveIoU = 0.0
          var bestManualAppleDelta = Double.infinity
          var bestScore = 0.0
          var bestLocal = CGRect.zero
          var bestFull = CGRect.zero

          for candidate in kept {
              let full = manualFull(candidate.box)
              let apple = appleFull(candidate.box)
              let delta = max(
                  abs(full.minX-apple.minX), abs(full.minY-apple.minY),
                  abs(full.width-apple.width), abs(full.height-apple.height)
              )
              let correct = iou(full, gt)
              let naive = iou(candidate.box, gt)
              if correct > bestCorrectIoU {
                  bestCorrectIoU = correct
                  bestNaiveIoU = naive
                  bestManualAppleDelta = delta
                  bestScore = candidate.score
                  bestLocal = candidate.box
                  bestFull = full
              }
          }

          let report: [String: Any] = [
              "output_shape": shape,
              "roi": [roi.minX, roi.minY, roi.width, roi.height],
              "gt": [gt.minX, gt.minY, gt.width, gt.height],
              "best_local": [bestLocal.minX, bestLocal.minY, bestLocal.width, bestLocal.height],
              "best_full": [bestFull.minX, bestFull.minY, bestFull.width, bestFull.height],
              "best_score": bestScore,
              "correct_iou": bestCorrectIoU,
              "naive_iou": bestNaiveIoU,
              "manual_vs_apple_max_delta": bestManualAppleDelta,
          ]
          let data = try JSONSerialization.data(withJSONObject: report, options: [.prettyPrinted, .sortedKeys])
          try data.write(to: reportURL)
          print(String(data: data, encoding: .utf8)!)

          guard bestCorrectIoU >= 0.45 else { fatalError("ROI mapped detection does not overlap GT enough: \(bestCorrectIoU)") }
          guard bestCorrectIoU >= bestNaiveIoU + 0.20 else { fatalError("correct mapping does not beat naive mapping enough") }
          guard bestManualAppleDelta <= 1e-6 else { fatalError("manual ROI mapping disagrees with Apple helper: \(bestManualAppleDelta)") }
          print("ROI_COORDINATE_CONTRACT_PASS")
          SWIFT
          xcrun swiftc "$RUNNER_TEMP/roi_coordinate_probe.swift" -o "$RUNNER_TEMP/roi_coordinate_probe"

      - name: Validate real Core ML ROI coordinates
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/roi_coordinate_probe" \
            build/compiled/yolo11n.mlmodelc \
            build/case/case.json \
            build/report/swift_roi_coordinate_report.json \
            | tee build/report/swift_stdout.txt
          grep -q 'ROI_COORDINATE_CONTRACT_PASS' build/report/swift_stdout.txt
          cp build/case/case.json build/report/case.json

      - name: Publish evidence summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          case=json.loads(Path('build/report/case.json').read_text())
          swift=json.loads(Path('build/report/swift_roi_coordinate_report.json').read_text())
          text=f'''## Real Core ML ROI coordinate contract\n\n- Image: `{Path(case['image']).name}` ({case['image_width']}x{case['image_height']})\n- ROI (Vision lower-left normalized): `{case['roi_vision']}`\n- Python crop mapped IoU: **{case['python_mapped_iou']:.3f}**\n- Python naive-local IoU: **{case['python_naive_iou']:.3f}**\n- Swift Core ML correct mapped IoU: **{swift['correct_iou']:.3f}**\n- Swift naive-local IoU: **{swift['naive_iou']:.3f}**\n- Manual mapping vs Apple ROI helper max delta: **{swift['manual_vs_apple_max_delta']:.8f}**\n- Raw output: `{swift['output_shape']}`\n\nThis validates the `.up` orientation ROI mapping contract only. Rotated ReplayKit orientations require a separate test before runtime integration. No production app or IPA is changed.\n'''
          Path('build/report/summary.md').write_text(text)
          print(text)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(text)
          PY

      - name: Upload coordinate evidence
        uses: actions/upload-artifact@v4
        with:
          name: liteview-roi-coordinate-contract
          path: build/report/
          retention-days: 7
          if-no-files-found: error
