name: LiteView ROI Coordinate Contract

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-realtime-vision-assist
    paths:
      - '.github/workflows/liteview-roi-coordinate-contract.yml'

permissions:
  contents: read

jobs:
  roi-coordinate-contract:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy<=2.3.5' 'coremltools>=9.0' 'ultralytics[export-coreml]' opencv-python-headless

      - name: Download model and COCO128
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/model build/data build/cases build/report
          curl -fL --retry 8 --retry-delay 2 \
            'https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11n.pt' \
            -o build/model/yolo11n.pt
          curl -fL --retry 8 --retry-delay 2 \
            'https://github.com/ultralytics/assets/releases/download/v0.0.0/coco128.zip' \
            -o build/data/coco128.zip
          unzip -q build/data/coco128.zip -d build/data
          test -d build/data/coco128/images/train2017
          test -d build/data/coco128/labels/train2017

      - name: Export YOLO11n 384 Core ML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/export build/compiled
          cp build/model/yolo11n.pt build/export/yolo11n.pt
          (
            cd build/export
            python - <<'PY'
          from pathlib import Path
          import coremltools as ct
          from ultralytics import YOLO
          pkg = Path(YOLO('yolo11n.pt').export(format='coreml', imgsz=384, nms=False))
          spec = ct.utils.load_spec(str(pkg))
          images = [x.type.imageType for x in spec.description.input if x.type.WhichOneof('Type') == 'imageType']
          assert len(images) == 1
          assert int(images[0].width) == 384 and int(images[0].height) == 384
          print('EXPORT_384_PASS')
          PY
          )
          xcrun coremlc compile build/export/yolo11n.mlpackage build/compiled
          test -d build/compiled/yolo11n.mlmodelc

      - name: Prepare annotation-only cases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import cv2

          root = Path('build/data/coco128')
          images = root / 'images' / 'train2017'
          labels = root / 'labels' / 'train2017'
          cases = []
          edge_cases = []

          for lp in sorted(labels.glob('*.txt')):
              ip = images / f'{lp.stem}.jpg'
              if not ip.exists():
                  continue
              im = cv2.imread(str(ip))
              if im is None:
                  continue
              h, w = im.shape[:2]
              gts = []
              edge = False
              for line in lp.read_text().splitlines():
                  p = line.split()
                  if len(p) < 5 or int(float(p[0])) != 0:
                      continue
                  cx, cy, bw, bh = map(float, p[1:5])
                  x = cx - bw / 2
                  y_top = cy - bh / 2
                  # Vision normalized rectangle: bottom-left origin.
                  gts.append([x, 1.0 - (y_top + bh), bw, bh])
                  if w >= h:
                      edge = edge or cx >= 0.58 or cx <= 0.42
                  else:
                      edge = edge or cy >= 0.58 or cy <= 0.42
              if not gts:
                  continue
              item = {
                  'image': str(ip.resolve()),
                  'image_width': int(w),
                  'image_height': int(h),
                  'gts': gts,
              }
              (edge_cases if edge else cases).append(item)

          selected = (edge_cases + cases)[:24]
          assert len(selected) >= 12, len(selected)
          Path('build/cases/cases.json').write_text(json.dumps(selected, indent=2), encoding='utf-8')
          print(f'ANNOTATION_CASES={len(selected)}')
          PY

      - name: Build Vision-native ROI probe
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/roi_contract_probe.swift" <<'SWIFT'
          import CoreGraphics
          import CoreML
          import Foundation
          import ImageIO
          import Vision

          struct TestCase: Decodable {
              let image: String
              let image_width: Int
              let image_height: Int
              let gts: [[Double]]
          }

          struct Candidate {
              let box: CGRect
              let score: Double
          }

          guard CommandLine.arguments.count == 4 else {
              fatalError("usage: probe <model.mlmodelc> <cases.json> <report.json>")
          }

          let modelURL = URL(fileURLWithPath: CommandLine.arguments[1])
          let casesURL = URL(fileURLWithPath: CommandLine.arguments[2])
          let reportURL = URL(fileURLWithPath: CommandLine.arguments[3])
          let tests = try JSONDecoder().decode([TestCase].self, from: Data(contentsOf: casesURL))

          let config = MLModelConfiguration()
          config.computeUnits = .cpuAndNeuralEngine
          let mlModel = try MLModel(contentsOf: modelURL, configuration: config)
          let visionModel = try VNCoreMLModel(for: mlModel)

          func iou(_ a: CGRect, _ b: CGRect) -> Double {
              let inter = a.intersection(b)
              guard !inter.isNull, inter.width > 0, inter.height > 0 else { return 0 }
              let ia = inter.width * inter.height
              let ua = a.width * a.height + b.width * b.height - ia
              return ua > 0 ? ia / ua : 0
          }

          func rect(_ values: [Double]) -> CGRect {
              CGRect(x: values[0], y: values[1], width: values[2], height: values[3])
          }

          func rois(width: Int, height: Int) -> [CGRect] {
              let c = 0.68
              if width >= height {
                  return [
                      CGRect(x: 0, y: 0, width: c, height: 1),
                      CGRect(x: 1-c, y: 0, width: c, height: 1),
                  ]
              }
              return [
                  CGRect(x: 0, y: 1-c, width: 1, height: c),
                  CGRect(x: 0, y: 0, width: 1, height: c),
              ]
          }

          func manualFull(_ local: CGRect, roi: CGRect) -> CGRect {
              CGRect(
                  x: roi.minX + local.minX * roi.width,
                  y: roi.minY + local.minY * roi.height,
                  width: local.width * roi.width,
                  height: local.height * roi.height
              )
          }

          func appleFull(_ local: CGRect, roi: CGRect, width: Int, height: Int) -> CGRect {
              let pixels = VNImageRectForNormalizedRectUsingRegionOfInterest(local, width, height, roi)
              return VNNormalizedRectForImageRect(pixels, width, height)
          }

          func decode(
              imageURL: URL,
              width: Int,
              height: Int,
              roi: CGRect
          ) throws -> [Candidate] {
              let request = VNCoreMLRequest(model: visionModel)
              request.imageCropAndScaleOption = .scaleFit
              request.regionOfInterest = roi
              let handler = VNImageRequestHandler(url: imageURL, orientation: .up, options: [:])
              try handler.perform([request])

              guard let observation = (request.results ?? [])
                  .compactMap({ $0 as? VNCoreMLFeatureValueObservation }).first,
                    let array = observation.featureValue.multiArrayValue else {
                  return []
              }

              let shape = array.shape.map(\.intValue)
              guard shape.count == 3 else { return [] }
              let channelsFirst = shape[1] >= 5 && shape[1] < shape[2]
              let count = channelsFirst ? shape[2] : shape[1]
              let features = channelsFirst ? shape[1] : shape[2]
              guard features >= 5 else { return [] }

              func value(_ feature: Int, _ index: Int) -> Double {
                  let idx: [NSNumber] = channelsFirst
                      ? [0, NSNumber(value: feature), NSNumber(value: index)]
                      : [0, NSNumber(value: index), NSNumber(value: feature)]
                  return array[idx].doubleValue
              }

              let roiPixelW = Double(width) * Double(roi.width)
              let roiPixelH = Double(height) * Double(roi.height)
              guard roiPixelW > 0, roiPixelH > 0 else { return [] }

              func localVisionBox(_ rawX: Double, _ rawY: Double, _ rawW: Double, _ rawH: Double) -> CGRect? {
                  var x = rawX / 384.0
                  var yTop = rawY / 384.0
                  var w = rawW / 384.0
                  var h = rawH / 384.0

                  if roiPixelW >= roiPixelH {
                      let fittedH = roiPixelH / roiPixelW
                      let padY = (1.0 - fittedH) / 2.0
                      yTop = (yTop - padY) / fittedH
                      h /= fittedH
                  } else {
                      let fittedW = roiPixelW / roiPixelH
                      let padX = (1.0 - fittedW) / 2.0
                      x = (x - padX) / fittedW
                      w /= fittedW
                  }

                  let minX = max(0, x - w/2)
                  let maxX = min(1, x + w/2)
                  let minYTop = max(0, yTop - h/2)
                  let maxYTop = min(1, yTop + h/2)
                  guard maxX > minX, maxYTop > minYTop else { return nil }
                  return CGRect(
                      x: minX,
                      y: 1.0 - maxYTop,
                      width: maxX - minX,
                      height: maxYTop - minYTop
                  )
              }

              var candidates: [Candidate] = []
              for i in 0..<count {
                  let score = value(4, i)
                  guard score >= 0.09 else { continue }
                  let x = value(0, i), y = value(1, i), w = value(2, i), h = value(3, i)
                  guard [x, y, w, h, score].allSatisfy({ $0.isFinite }) else { continue }
                  if let box = localVisionBox(x, y, w, h) {
                      candidates.append(Candidate(box: box, score: score))
                  }
              }

              var remaining = candidates.sorted { $0.score > $1.score }
              var kept: [Candidate] = []
              while let best = remaining.first, kept.count < 30 {
                  kept.append(best)
                  remaining.removeFirst()
                  remaining.removeAll { iou(best.box, $0.box) >= 0.50 }
              }
              return kept
          }

          var totalROIs = 0
          var totalDetections = 0
          var correctMatches = 0
          var mappingWins = 0
          var correctIoUSum = 0.0
          var naiveIoUSum = 0.0
          var bestCorrectIoU = 0.0
          var bestImprovement = -Double.infinity
          var maxAppleDelta = 0.0
          var examples: [[String: Any]] = []

          for test in tests {
              let imageURL = URL(fileURLWithPath: test.image)
              let gts = test.gts.map(rect)
              for roi in rois(width: test.image_width, height: test.image_height) {
                  totalROIs += 1
                  let candidates = try autoreleasepool {
                      try decode(imageURL: imageURL, width: test.image_width, height: test.image_height, roi: roi)
                  }
                  totalDetections += candidates.count

                  for candidate in candidates {
                      let full = manualFull(candidate.box, roi: roi)
                      let apple = appleFull(candidate.box, roi: roi, width: test.image_width, height: test.image_height)
                      let delta = max(
                          abs(full.minX - apple.minX),
                          abs(full.minY - apple.minY),
                          abs(full.width - apple.width),
                          abs(full.height - apple.height)
                      )
                      maxAppleDelta = max(maxAppleDelta, delta)

                      let correct = gts.map { iou(full, $0) }.max() ?? 0
                      let naive = gts.map { iou(candidate.box, $0) }.max() ?? 0
                      if correct >= 0.35 {
                          correctMatches += 1
                          correctIoUSum += correct
                          naiveIoUSum += naive
                          let improvement = correct - naive
                          if improvement >= 0.10 { mappingWins += 1 }
                          if correct > bestCorrectIoU { bestCorrectIoU = correct }
                          if improvement > bestImprovement {
                              bestImprovement = improvement
                              examples = [[
                                  "image": test.image,
                                  "roi": [roi.minX, roi.minY, roi.width, roi.height],
                                  "local": [candidate.box.minX, candidate.box.minY, candidate.box.width, candidate.box.height],
                                  "full": [full.minX, full.minY, full.width, full.height],
                                  "score": candidate.score,
                                  "correct_iou": correct,
                                  "naive_iou": naive,
                                  "improvement": improvement,
                              ]]
                          }
                      }
                  }
              }
          }

          let report: [String: Any] = [
              "cases": tests.count,
              "rois": totalROIs,
              "detections": totalDetections,
              "correct_matches": correctMatches,
              "mapping_wins": mappingWins,
              "correct_iou_sum": correctIoUSum,
              "naive_iou_sum": naiveIoUSum,
              "best_correct_iou": bestCorrectIoU,
              "best_improvement": bestImprovement,
              "manual_vs_apple_max_delta": maxAppleDelta,
              "examples": examples,
          ]
          let data = try JSONSerialization.data(withJSONObject: report, options: [.prettyPrinted, .sortedKeys])
          try data.write(to: reportURL)
          print(String(data: data, encoding: .utf8)!)
          SWIFT
          xcrun swiftc "$RUNNER_TEMP/roi_contract_probe.swift" -o "$RUNNER_TEMP/roi_contract_probe"

      - name: Run real Vision ROI coordinate validation
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/roi_contract_probe" \
            build/compiled/yolo11n.mlmodelc \
            build/cases/cases.json \
            build/report/roi_coordinate_report.json \
            | tee build/report/swift_stdout.txt

      - name: Guard coordinate contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('build/report/roi_coordinate_report.json').read_text())
          print(json.dumps(r, indent=2))
          assert r['rois'] >= 24, r
          assert r['detections'] > 0, r
          assert r['correct_matches'] >= 4, r
          assert r['mapping_wins'] >= 2, r
          assert r['best_correct_iou'] >= 0.45, r
          assert r['best_improvement'] >= 0.10, r
          assert r['correct_iou_sum'] > r['naive_iou_sum'], r
          assert r['manual_vs_apple_max_delta'] <= 1e-6, r
          print('ROI_COORDINATE_CONTRACT_PASS')
          PY

      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Vision-native ROI coordinate contract'
            echo
            echo 'Python only prepared annotation/image metadata. All inference, ROI preprocessing, raw Core ML decode, NMS and coordinate mapping ran through Swift + Vision.'
            echo
            if [ -f build/report/roi_coordinate_report.json ]; then
              echo '```json'
              cat build/report/roi_coordinate_report.json
              echo '```'
            else
              echo 'No coordinate report was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coordinate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liteview-roi-coordinate-contract
          path: |
            build/report/
            build/cases/cases.json
          retention-days: 7
          if-no-files-found: warn
