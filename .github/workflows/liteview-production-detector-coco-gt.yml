name: LiteView Production Detector COCO GT

on:
  push:
    branches:
      - feature/ios-realtime-vision-runtime-candidate
    paths:
      - '.github/workflows/liteview-production-detector-coco-gt.yml'
      - 'ios/PhoenixRealtimeVisionAssist/Sources/ExtensionSupport/BroadcastFramePreprocessor.swift'
      - 'ios/PhoenixRealtimeVisionAssist/Sources/ExtensionSupport/BroadcastNanoPersonDetector.swift'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-detector-coco-gt:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Stage model and COCO128 person cases
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/production-coco-gt
          mkdir -p build/production-coco-gt/data build/production-coco-gt/model

          MODEL_ZIP="$RUNNER_TEMP/liteview-yolo11n-coreml.zip"
          MODEL_UNZIP="$RUNNER_TEMP/liteview-yolo11n-coreml"
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors --connect-timeout 20 \
            -o "$MODEL_ZIP" \
            'https://github.com/liubanxia/project_phoenix_core/releases/download/liteview-coreml-latest/liteview-yolo11n-coreml.zip'
          rm -rf "$MODEL_UNZIP"
          mkdir -p "$MODEL_UNZIP"
          unzip -q "$MODEL_ZIP" -d "$MODEL_UNZIP"
          PACKAGE="$(find "$MODEL_UNZIP" -type d -name 'yolo11n.mlpackage' -print -quit)"
          test -n "$PACKAGE"
          xcrun coremlc compile "$PACKAGE" build/production-coco-gt/model
          MODEL="$(find build/production-coco-gt/model -type d -name 'yolo11n.mlmodelc' -print -quit)"
          test -n "$MODEL"

          curl -fL --retry 6 --retry-delay 2 \
            'https://github.com/ultralytics/assets/releases/download/v0.0.0/coco128.zip' \
            -o "$RUNNER_TEMP/coco128.zip"
          unzip -q "$RUNNER_TEMP/coco128.zip" -d build/production-coco-gt/data

          python3 - <<'PY'
          from pathlib import Path
          root = Path('build/production-coco-gt/data/coco128').resolve()
          rows = []
          for label in sorted((root / 'labels').rglob('*.txt')):
              persons = []
              for line in label.read_text().splitlines():
                  p = line.split()
                  if len(p) >= 5 and p[0] == '0':
                      persons.append(tuple(map(float, p[1:5])))
              if not persons:
                  continue
              image = next(iter((root / 'images').rglob(label.stem + '.jpg')), None)
              if image is None:
                  continue
              encoded = ';'.join(','.join(f'{v:.8f}' for v in box) for box in persons)
              rows.append(f'{image.resolve()}\t{encoded}')
              if len(rows) >= 48:
                  break
          assert len(rows) >= 40, len(rows)
          Path('build/production-coco-gt/cases.tsv').write_text('\n'.join(rows) + '\n')
          print('CASES', len(rows))
          PY

      - name: Build actual production detector GT probe bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT='ios/PhoenixRealtimeVisionAssist'
          APP="$RUNNER_TEMP/LiteViewProductionGTProbe.app"
          MACOS="$APP/Contents/MacOS"
          RES="$APP/Contents/Resources"
          MODEL="$(find build/production-coco-gt/model -type d -name 'yolo11n.mlmodelc' -print -quit)"
          rm -rf "$APP"
          mkdir -p "$MACOS" "$RES/BroadcastModels"
          cp -R "$MODEL" "$RES/BroadcastModels/yolo11n.mlmodelc"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>LiteViewProductionGTProbe</string>
            <key>CFBundleIdentifier</key><string>com.phoenix.liteview.production-gt-probe</string>
            <key>CFBundleName</key><string>LiteViewProductionGTProbe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
          </dict></plist>
          PLIST

          cat > "$RUNNER_TEMP/main.swift" <<'SWIFT'
          import CoreGraphics
          import CoreVideo
          import Foundation
          import ImageIO

          struct LightweightTargetPoint: Sendable, Equatable {
              let x: Double
              let y: Double
          }

          enum LiteViewTelemetryDecoder: UInt64, Sendable {
              case none = 0
              case recognizedObject = 1
              case coordinateConfidence = 2
              case ultralyticsRaw = 3
              case emptyOutput = 4
              case unsupported = 5
          }

          struct GTBox {
              let rect: CGRect
              let effective384Height: Double
          }

          struct Metrics {
              var gt = 0
              var predictions = 0
              var matches = 0
              var smallGT = 0
              var smallMatches = 0
              var mediumGT = 0
              var mediumMatches = 0
              var largeGT = 0
              var largeMatches = 0
          }

          func makeSourceBuffer(from url: URL) -> CVPixelBuffer {
              guard let src = CGImageSourceCreateWithURL(url as CFURL, nil),
                    let image = CGImageSourceCreateImageAtIndex(src, 0, nil) else {
                  fatalError("cannot load \(url.path)")
              }
              let width = 1920, height = 1080
              var buffer: CVPixelBuffer?
              let attrs: [CFString: Any] = [
                  kCVPixelBufferCGImageCompatibilityKey: true,
                  kCVPixelBufferCGBitmapContextCompatibilityKey: true,
                  kCVPixelBufferMetalCompatibilityKey: true,
                  kCVPixelBufferIOSurfacePropertiesKey: [:] as CFDictionary,
              ]
              let status = CVPixelBufferCreate(
                  kCFAllocatorDefault, width, height, kCVPixelFormatType_32BGRA,
                  attrs as CFDictionary, &buffer
              )
              guard status == kCVReturnSuccess, let buffer else { fatalError("buffer create \(status)") }
              CVPixelBufferLockBaseAddress(buffer, [])
              defer { CVPixelBufferUnlockBaseAddress(buffer, []) }
              guard let base = CVPixelBufferGetBaseAddress(buffer),
                    let ctx = CGContext(
                      data: base, width: width, height: height, bitsPerComponent: 8,
                      bytesPerRow: CVPixelBufferGetBytesPerRow(buffer),
                      space: CGColorSpaceCreateDeviceRGB(),
                      bitmapInfo: CGBitmapInfo.byteOrder32Little.rawValue |
                        CGImageAlphaInfo.premultipliedFirst.rawValue
                    ) else { fatalError("context") }
              ctx.draw(image, in: CGRect(x: 0, y: 0, width: width, height: height))
              return buffer
          }

          func parseGT(_ encoded: String) -> [GTBox] {
              encoded.split(separator: ";").compactMap { item in
                  let p = item.split(separator: ",").compactMap { Double($0) }
                  guard p.count == 4 else { return nil }
                  let xc = p[0], yc = p[1], w = p[2], h = p[3]
                  let x = max(0, xc - w / 2)
                  let yVision = max(0, 1 - (yc + h / 2))
                  let rect = CGRect(x: x, y: yVision, width: min(w, 1 - x), height: min(h, 1 - yVision))
                  // 1920x1080 scaleFit into 384 square gives 216 useful vertical pixels.
                  return GTBox(rect: rect, effective384Height: h * 216.0)
              }
          }

          func iou(_ a: CGRect, _ b: CGRect) -> Double {
              let inter = a.intersection(b)
              if inter.isNull || inter.isEmpty { return 0 }
              let ia = Double(inter.width * inter.height)
              let ua = Double(a.width * a.height + b.width * b.height - inter.width * inter.height)
              return ua > 0 ? ia / ua : 0
          }

          func nms(_ detections: [BroadcastNanoDetection], threshold: Double = 0.45) -> [BroadcastNanoDetection] {
              var remaining = detections.sorted { $0.confidence > $1.confidence }
              var kept: [BroadcastNanoDetection] = []
              while let best = remaining.first, kept.count < 16 {
                  kept.append(best)
                  remaining.removeFirst()
                  remaining.removeAll { iou(best.boundingBox, $0.boundingBox) >= threshold }
              }
              return kept
          }

          func update(_ metrics: inout Metrics, gt: [GTBox], predictions: [BroadcastNanoDetection]) {
              metrics.gt += gt.count
              metrics.predictions += predictions.count
              var used = Set<Int>()
              for target in gt {
                  if target.effective384Height < 32 { metrics.smallGT += 1 }
                  else if target.effective384Height < 64 { metrics.mediumGT += 1 }
                  else { metrics.largeGT += 1 }

                  var bestIndex: Int? = nil
                  var best = 0.0
                  for (i, pred) in predictions.enumerated() where !used.contains(i) {
                      let overlap = iou(target.rect, pred.boundingBox)
                      if overlap > best { best = overlap; bestIndex = i }
                  }
                  if let bestIndex, best >= 0.30 {
                      used.insert(bestIndex)
                      metrics.matches += 1
                      if target.effective384Height < 32 { metrics.smallMatches += 1 }
                      else if target.effective384Height < 64 { metrics.mediumMatches += 1 }
                      else { metrics.largeMatches += 1 }
                  }
              }
          }

          func ratio(_ a: Int, _ b: Int) -> Double { b > 0 ? Double(a) / Double(b) : 0 }

          guard CommandLine.arguments.count == 2 else { fatalError("usage: probe <cases.tsv>") }
          let rows = try String(contentsOfFile: CommandLine.arguments[1], encoding: .utf8)
              .split(separator: "\n")
          guard rows.count >= 40 else { fatalError("too few cases") }

          let detector = BroadcastNanoPersonDetector()
          let full = CGRect(x: 0, y: 0, width: 1, height: 1)
          let left = CGRect(x: 0, y: 0, width: 0.68, height: 1)
          let right = CGRect(x: 0.32, y: 0, width: 0.68, height: 1)
          var fullMetrics = Metrics()
          var cycleMetrics = Metrics()
          var validCases = 0

          for (index, row) in rows.enumerated() {
              let fields = row.split(separator: "\t", maxSplits: 1).map(String.init)
              guard fields.count == 2 else { continue }
              let gt = parseGT(fields[1])
              guard !gt.isEmpty else { continue }
              let source = makeSourceBuffer(from: URL(fileURLWithPath: fields[0]))

              let fullResult = detector.detect(
                  in: source, orientation: .up,
                  minimumConfidence: 0.12, regionOfInterest: full
              )
              guard fullResult.succeeded else { fatalError("full detector failure \(index)") }
              let fullPreds = fullResult.detections
              update(&fullMetrics, gt: gt, predictions: fullPreds)

              let leftResult = detector.detect(
                  in: source, orientation: .up,
                  minimumConfidence: 0.09, regionOfInterest: left
              )
              let rightResult = detector.detect(
                  in: source, orientation: .up,
                  minimumConfidence: 0.09, regionOfInterest: right
              )
              guard leftResult.succeeded, rightResult.succeeded else {
                  fatalError("ROI detector failure \(index)")
              }
              let cyclePreds = nms(fullPreds + leftResult.detections + rightResult.detections)
              update(&cycleMetrics, gt: gt, predictions: cyclePreds)
              validCases += 1
          }

          func printMetrics(_ name: String, _ m: Metrics) {
              print("\(name)_CASES=\(validCases)")
              print("\(name)_GT=\(m.gt)")
              print("\(name)_PREDICTIONS=\(m.predictions)")
              print("\(name)_MATCHES=\(m.matches)")
              print(String(format: "\(name)_RECALL=%.4f", ratio(m.matches, m.gt)))
              print(String(format: "\(name)_PRECISION=%.4f", ratio(m.matches, m.predictions)))
              print("\(name)_SMALL_GT=\(m.smallGT)")
              print(String(format: "\(name)_SMALL_RECALL=%.4f", ratio(m.smallMatches, m.smallGT)))
              print("\(name)_MEDIUM_GT=\(m.mediumGT)")
              print(String(format: "\(name)_MEDIUM_RECALL=%.4f", ratio(m.mediumMatches, m.mediumGT)))
              print("\(name)_LARGE_GT=\(m.largeGT)")
              print(String(format: "\(name)_LARGE_RECALL=%.4f", ratio(m.largeMatches, m.largeGT)))
          }

          printMetrics("FULL", fullMetrics)
          printMetrics("CYCLE", cycleMetrics)

          let fullRecall = ratio(fullMetrics.matches, fullMetrics.gt)
          let cycleRecall = ratio(cycleMetrics.matches, cycleMetrics.gt)
          let fullSmall = ratio(fullMetrics.smallMatches, fullMetrics.smallGT)
          let cycleSmall = ratio(cycleMetrics.smallMatches, cycleMetrics.smallGT)
          let cyclePrecision = ratio(cycleMetrics.matches, cycleMetrics.predictions)

          guard validCases >= 40,
                fullMetrics.gt >= 40,
                fullRecall >= 0.45,
                cycleRecall + 0.001 >= fullRecall,
                cycleSmall + 0.001 >= fullSmall,
                cyclePrecision >= 0.35 else {
              fatalError("production detector COCO GT sanity gate failed")
          }
          print("PRODUCTION_DETECTOR_COCO_GT_PASS")
          SWIFT

          xcrun swiftc -O \
            "$ROOT/Sources/ExtensionSupport/BroadcastFramePreprocessor.swift" \
            "$ROOT/Sources/ExtensionSupport/BroadcastNanoPersonDetector.swift" \
            "$RUNNER_TEMP/main.swift" \
            -o "$MACOS/LiteViewProductionGTProbe"

      - name: Run production detector against COCO person ground truth
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/LiteViewProductionGTProbe.app"
          "$APP/Contents/MacOS/LiteViewProductionGTProbe" build/production-coco-gt/cases.tsv \
            | tee build/production-coco-gt/results.log
          grep -q 'PRODUCTION_DETECTOR_COCO_GT_PASS' build/production-coco-gt/results.log

      - name: Publish ground-truth summary
        if: always()
        shell: bash
        run: |
          {
            echo '## LiteView production detector — COCO person ground truth'
            echo
            echo 'FULL is one production full-frame call at confidence 0.12. CYCLE is the union of FULL plus the two 68% ROI reacquisition phases at confidence 0.09; it represents cycle-level reacquisition potential, not per-frame inference.'
            echo
            if [ -f build/production-coco-gt/results.log ]; then
              echo '```text'
              grep -E '^(FULL|CYCLE)_(CASES|GT|PREDICTIONS|MATCHES|RECALL|PRECISION|SMALL|MEDIUM|LARGE)|PRODUCTION_DETECTOR_COCO' build/production-coco-gt/results.log || true
              echo '```'
            fi
            echo
            echo 'Small means an annotated person would be under 32 pixels tall after 1920x1080 scaleFit into the 384 detector input. This is a generic visible-person benchmark, not game-specific validation.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liteview-production-detector-coco-gt
          path: |
            build/production-coco-gt/results.log
            build/production-coco-gt/cases.tsv
          retention-days: 7
          if-no-files-found: warn
