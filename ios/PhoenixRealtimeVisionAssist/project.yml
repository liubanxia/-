name: PhoenixRealtimeVisionAssist
options:
  bundleIdPrefix: com.phoenix
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  PhoenixRealtimeVisionAssist:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Core
      - path: Sources/Vision
      - path: Sources/Audio
      - path: Sources/Map
      - path: Sources/Overlay
    resources:
      - path: Resources
        optional: true
    info:
      path: Sources/App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Config/App.entitlements
    dependencies:
      - target: PhoenixBroadcastExtension
        embed: true
  PhoenixBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Broadcast
      - path: Sources/Core
      - path: Sources/Vision
      - path: Sources/Audio
      - path: Sources/Map
    resources:
      - path: Resources
        optional: true
    info:
      path: Sources/Broadcast/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist.broadcast
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Config/Broadcast.entitlements
