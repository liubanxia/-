name: PhoenixRealtimeVisionAssist
options:
  bundleIdPrefix: com.phoenix
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 37
    MARKETING_VERSION: 0.9.20
targets:
  PhoenixRealtimeVisionAssist:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - RadarPiPController.swift
          - RadarBootstrapLoader.m
          - FloatingDotPiPController.swift
          - FullMapFloatingRadarController.swift
          - MultiMapFloatingRadarController.swift
          - VisibleMultiMapRadarController.swift
          - EvidenceFirstRadarController.swift
          - HUDFusedRadarController.swift
          - EdgeHUDRadarController.swift
      - path: Sources/Core
      - path: Sources/Vision
      - path: Sources/Audio
      - path: Sources/Map
      - path: Sources/Overlay
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: LiteView
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: "LiteView uses your local network only to send its own screen-visible radar analysis to your Web Radar device."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_COMPILATION_MODE: singlefile
        SWIFT_OPTIMIZATION_LEVEL: -O
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.phoenix.realtimevisionassist
    dependencies:
      - target: PhoenixBroadcastExtension
        embed: true
  PhoenixBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Broadcast
      - path: Sources/ExtensionSupport
      - path: Sources/Core/EvidenceStateChannels.swift
      - path: Sources/Core/HUDSoundStateChannel.swift
      - path: Sources/Core/CompassHeadingStateChannel.swift
      - path: Sources/Core/MapLocalizationStateChannel.swift
      - path: Sources/Core/ContinuousMapPositionStateChannel.swift
      - path: Sources/Core/MapScreenVisibilityStateChannel.swift
      - path: Sources/Core/WebRadarConfiguration.swift
      - path: Resources/BroadcastModels
        type: folder
        buildPhase: resources
        optional: true
    info:
      path: Sources/Broadcast/Info.plist
      properties:
        CFBundleDisplayName: LiteView Broadcast
        NSLocalNetworkUsageDescription: "LiteView Broadcast uses your local network only to send screen-visible radar analysis to your Web Radar device."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: PhoenixBroadcastExtension.EnhancedBroadcastSampleHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist.broadcast
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_COMPILATION_MODE: singlefile
        SWIFT_OPTIMIZATION_LEVEL: -O
    entitlements:
      path: Config/Broadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.phoenix.realtimevisionassist
  PhoenixRealtimeVisionAssistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - '**/README.md'
      - path: Sources/Core/RuntimeConfiguration.swift
      - path: Sources/Core/BroadcastLifecycle.swift
      - path: Sources/Core/SharedRealtimeStateStore.swift
      - path: Sources/Core/EvidenceStateChannels.swift
      - path: Sources/Core/HUDSoundStateChannel.swift
      - path: Sources/Core/CompassHeadingStateChannel.swift
      - path: Sources/Core/MapLocalizationStateChannel.swift
      - path: Sources/Core/ContinuousMapPositionStateChannel.swift
      - path: Sources/Core/MapScreenVisibilityStateChannel.swift
      - path: Sources/Core/WebRadarConfiguration.swift
      - path: Sources/Vision/PhoenixCapabilityModelBank.swift
      - path: Sources/Map
        excludes:
          - README.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhoenixRealtimeVisionAssist:
    build:
      targets:
        PhoenixRealtimeVisionAssist: all
        PhoenixBroadcastExtension: all
        PhoenixRealtimeVisionAssistTests:
          - test
    test:
      targets:
        - PhoenixRealtimeVisionAssistTests
