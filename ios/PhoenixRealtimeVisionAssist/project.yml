name: PhoenixRealtimeVisionAssist
options:
  bundleIdPrefix: com.phoenix
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 17
    MARKETING_VERSION: 0.9.1
targets:
  PhoenixRealtimeVisionAssist:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Core
      - path: Sources/Vision
      - path: Sources/Audio
      - path: Sources/Map
      - path: Sources/Overlay
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: LiteView
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.phoenix.realtimevisionassist
    dependencies:
      - target: PhoenixBroadcastExtension
        embed: true
  PhoenixBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Broadcast
      - path: Sources/ExtensionSupport/BroadcastNanoPersonDetector.swift
      - path: Sources/Core/SharedRealtimeStateStore.swift
    postBuildScripts:
      - name: Copy LiteView Broadcast Core ML model
        script: |
          set -e
          MODEL_ROOT="${SRCROOT}/Resources/BroadcastModels"
          DEST_ROOT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DEST_ROOT"
          rm -rf "$DEST_ROOT/yolo11n.mlmodelc"
          if [ -d "$MODEL_ROOT/yolo11n.mlmodelc" ]; then
            cp -R "$MODEL_ROOT/yolo11n.mlmodelc" "$DEST_ROOT/yolo11n.mlmodelc"
          fi
    info:
      path: Sources/Broadcast/Info.plist
      properties:
        CFBundleDisplayName: LiteView Broadcast
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: PhoenixBroadcastExtension.BroadcastSampleHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist.broadcast
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Config/Broadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.phoenix.realtimevisionassist
  PhoenixRealtimeVisionAssistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Sources/Core/RuntimeConfiguration.swift
      - path: Sources/Core/BroadcastLifecycle.swift
      - path: Sources/Core/SharedRealtimeStateStore.swift
      - path: Sources/Vision/PhoenixCapabilityModelBank.swift
      - path: Sources/Map
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhoenixRealtimeVisionAssist:
    build:
      targets:
        PhoenixRealtimeVisionAssist: all
        PhoenixBroadcastExtension: all
        PhoenixRealtimeVisionAssistTests:
          - test
    test:
      targets:
        - PhoenixRealtimeVisionAssistTests
