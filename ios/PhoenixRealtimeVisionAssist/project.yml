name: PhoenixRealtimeVisionAssist
options:
  bundleIdPrefix: com.phoenix
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 12
    MARKETING_VERSION: 0.8.1
targets:
  PhoenixRealtimeVisionAssist:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Core
      - path: Sources/Vision
      - path: Sources/Audio
      - path: Sources/Map
      - path: Sources/Overlay
    resources:
      - path: Resources/Models/yolo11n.mlmodelc
        optional: true
        type: folder
    postBuildScripts:
      - name: Copy LiteView Core ML model pool
        script: |
          set -e
          MODEL_ROOT="${SRCROOT}/Resources/Models"
          DEST_ROOT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ -d "$MODEL_ROOT" ]; then
            for SRC in "$MODEL_ROOT"/*.mlmodelc; do
              [ -d "$SRC" ] || continue
              NAME="$(basename "$SRC")"
              DST="$DEST_ROOT/$NAME"
              rm -rf "$DST"
              mkdir -p "$DEST_ROOT"
              cp -R "$SRC" "$DST"
            done
          fi
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: LiteView
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.phoenix.realtimevisionassist
    dependencies:
      - target: PhoenixBroadcastExtension
        embed: true
  PhoenixBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Broadcast
      - path: Sources/ExtensionSupport/BroadcastNanoPersonDetector.swift
      - path: Sources/Core/SharedRealtimeStateStore.swift
    resources:
      - path: Resources/BroadcastModels
        optional: true
        type: folder
    info:
      path: Sources/Broadcast/Info.plist
      properties:
        CFBundleDisplayName: LiteView Broadcast
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: PhoenixBroadcastExtension.BroadcastSampleHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist.broadcast
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Config/Broadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.phoenix.realtimevisionassist
  PhoenixRealtimeVisionAssistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Sources/Core/RuntimeConfiguration.swift
      - path: Sources/Core/BroadcastLifecycle.swift
      - path: Sources/Core/SharedRealtimeStateStore.swift
      - path: Sources/Vision/PhoenixCapabilityModelBank.swift
      - path: Sources/Map
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhoenixRealtimeVisionAssist:
    build:
      targets:
        PhoenixRealtimeVisionAssist: all
        PhoenixBroadcastExtension: all
        PhoenixRealtimeVisionAssistTests:
          - test
    test:
      targets:
        - PhoenixRealtimeVisionAssistTests
