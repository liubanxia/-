name: PhoenixRealtimeVisionAssist
options:
  bundleIdPrefix: com.phoenix
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 0.2.0
targets:
  PhoenixRealtimeVisionAssist:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Core
      - path: Sources/Vision
      - path: Sources/Audio
      - path: Sources/Map
      - path: Sources/Overlay
    resources:
      - path: Resources/Models/yolo11n.mlmodelc
        optional: true
        type: folder
    postBuildScripts:
      - name: Copy LiteView Core ML model
        script: |
          set -e
          SRC="${SRCROOT}/Resources/Models/yolo11n.mlmodelc"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/yolo11n.mlmodelc"
          if [ -d "$SRC" ]; then
            rm -rf "$DST"
            mkdir -p "$(dirname "$DST")"
            cp -R "$SRC" "$DST"
          fi
    info:
      path: Sources/App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Config/App.entitlements
    dependencies:
      - target: PhoenixBroadcastExtension
        embed: true
  PhoenixBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Broadcast
      - path: Sources/Core/SharedRealtimeStateStore.swift
    info:
      path: Sources/Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Phoenix Broadcast
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).BroadcastSampleHandler"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist.broadcast
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Config/Broadcast.entitlements
  PhoenixRealtimeVisionAssistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Sources/Core/RuntimeConfiguration.swift
      - path: Sources/Core/BroadcastLifecycle.swift
      - path: Sources/Core/SharedRealtimeStateStore.swift
      - path: Sources/Map
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoenix.realtimevisionassist.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhoenixRealtimeVisionAssist:
    build:
      targets:
        PhoenixRealtimeVisionAssist: all
        PhoenixBroadcastExtension: all
        PhoenixRealtimeVisionAssistTests:
          - test
    test:
      targets:
        - PhoenixRealtimeVisionAssistTests
